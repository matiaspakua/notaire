name: DAST — OWASP ZAP Baseline

# Issue #1067 / CU78 / ADR-006. Nightly + manual DAST against a live API.
# OpenAPI contract diff gates PRs; ZAP is intentionally not on every PR.
on:
  schedule:
    - cron: '0 5 * * 1'  # Weekly, Mondays 5am UTC (after k6 at 4am)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: notaire
          POSTGRES_USER: notaire
          POSTGRES_PASSWORD: notaire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend
        run: mvn clean package -pl backend-api -am -DskipTests -q

      - name: Start backend API
        run: |
          java -jar backend-api/target/*.jar \
            --server.port=8080 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/notaire \
            --spring.datasource.username=notaire \
            --spring.datasource.password=notaire \
            --spring.jpa.hibernate.ddl-auto=update \
            --jwt.secret="${JWT_SECRET}" \
            --actuator.security.username="${ACTUATOR_USER}" \
            --actuator.security.password="${ACTUATOR_PASSWORD}" \
            --app.admin.username="${ADMIN_USER}" \
            --app.admin.password="${ADMIN_PASSWORD}" &
          echo "Waiting for backend..."
          timeout 90 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done'
          echo "Backend is ready"
        env:
          JWT_SECRET: ci-zap-only-jwt-secret-do-not-use-in-prod-!!
          ACTUATOR_USER: ci-zap-actuator-user
          ACTUATOR_PASSWORD: ci-zap-actuator-pass
          ADMIN_USER: ci-zap-admin
          ADMIN_PASSWORD: ci-zap-admin-pass

      - name: OWASP ZAP baseline scan
        # Warn-first policy (#1067): publish the report; do not fail the job on
        # baseline alerts until an allowlist/ratchet lands. Fail only if ZAP
        # itself cannot run.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report

      - name: Upload ZAP report files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report-files
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
          if-no-files-found: error
