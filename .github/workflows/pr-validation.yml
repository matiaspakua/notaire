name: PR Validation

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================
  # JOB 1: Validate PR Title & Description
  # ==========================================
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PR Title
        # Accepts: [#NNN] type(scope)?: description  (project convention)
        # Also accepts plain: type(scope)?: description  (fallback)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
          SCOPE="(\([a-zA-Z0-9_/-]+\))?"
          DESC=".+"
          # Pattern 1: [#123] type(scope)?: description
          PATTERN1="^\[#[0-9]+\] (${TYPES})${SCOPE}: ${DESC}"
          # Pattern 2: plain type(scope)?: description
          PATTERN2="^(${TYPES})${SCOPE}: ${DESC}"

          if echo "$PR_TITLE" | grep -qE "$PATTERN1"; then
            echo "✅ PR title matches project convention: [#NNN] type: description"
          elif echo "$PR_TITLE" | grep -qE "$PATTERN2"; then
            echo "✅ PR title matches conventional commits format: type: description"
          else
            echo "❌ PR title does not follow the required format."
            echo ""
            echo "Expected (project convention):  [#NNN] type(scope)?: description"
            echo "Fallback (conventional commits): type(scope)?: description"
            echo ""
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo ""
            echo "Examples:"
            echo "  [#453] feat: add animated workflow tracker"
            echo "  [#254] fix(api): resolve 500 on gestiones list"
            echo "  feat(auth): add JWT refresh token"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

      - name: Validate Use Case Reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "=== Validating Use Case Reference ==="

          # Check if PR body or title contains CU- or UC- reference
          if echo "$PR_BODY$PR_TITLE" | grep -qiE "(CU-[0-9]{1,3}|UC-[0-9]{1,3}|Refs\s+CU|References\s+CU)"; then
            echo "✅ Use Case reference found"
            echo ""
            UC_REF=$(echo "$PR_BODY$PR_TITLE" | grep -oiE "(CU-[0-9]{1,3}|UC-[0-9]{1,3})" | head -1)
            echo "  Referenced: $UC_REF"
          else
            echo "⚠️  WARNING: PR does not reference a Use Case (CU-XX)"
            echo ""
            echo "Please add a Use Case reference to your PR body, for example:"
            echo "  - 'Implements CU-05: Preparar escritura'"
            echo "  - 'Refs CU-42 and CU-43'"
            echo "  - 'Supports infrastructure CU-74 (Performance)'"
            echo ""
            echo "Use Cases are documented in:"
            echo "  docs/01-business/02-use-cases/03_CU\\ -\\ Casos\\ de\\ Uso/"
            echo ""
            echo "Note: This is a warning, not a blocker. Please address in the next commit."
          fi

      - name: Check for Required Files
        run: |
          echo "=== Checking required files ==="

          # Check if PR adds new dependencies
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | grep -q "pom.xml"; then
            echo "📦 pom.xml modified - dependency change detected"
          fi

          # Check if PR adds new workflows
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | grep -q "\.github/workflows"; then
            echo "⚙️  Workflows modified"
          fi

      - name: Check Files Size
        run: |
          # Check for large files
          large_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | xargs -I {} wc -c {} 2>/dev/null | awk '$1 > 5000000 {print $2}')
          if [ -n "$large_files" ]; then
            echo "⚠️  Large files detected (>5MB):"
            echo "$large_files"
          else
            echo "✅ No large files detected"
          fi

  # ==========================================
  # JOB 2: Quick Build Check
  # ==========================================
  quick-build:
    name: Quick Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Quick Build (no tests)
        run: mvn clean compile -DskipTests -q

      - name: Verify Parent POM
        run: mvn help:effective-pom -q | head -20

  # ==========================================
  # JOB 3: Dependency Analysis
  # ==========================================
  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Analyze Dependencies
        run: |
          mvn dependency:tree -pl backend-api -am -q | head -50
          echo ""
          echo "=== Checking for vulnerable dependencies ==="
          mvn dependency:analyze -pl backend-api -am -q || true

  # ==========================================
  # JOB 4: Lint Java Code
  # ==========================================
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -pl backend-api -q || true

      - name: Upload Checkstyle Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkstyle-report
          path: backend-api/target/checkstyle-result.xml
          retention-days: 7

  # ==========================================
  # JOB 5: Branch Protection Check
  # ==========================================
  branch-protection:
    name: Branch Protection Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check Branch Name
        run: |
          branch_name="${{ github.head_ref }}"
          echo "Branch: $branch_name"
          
          # Allowed patterns:
          #   Standard:   feature/*, bugfix/*, hotfix/*, release/*, main, develop
          #   Issue-based: <ISSUE-ID>/(feat|fix|docs|refactor|ci|chore|perf|test|build|revert)/*
          allowed_prefixes="^(main|develop|feature/|bugfix/|hotfix/|release/|[0-9]+/(feat|fix|docs|refactor|ci|chore|perf|test|build|revert)/)"

          if [[ ! "$branch_name" =~ $allowed_prefixes ]]; then
            echo "⚠️  Warning: Branch name doesn't follow conventional naming"
            echo "Expected: feature/*, bugfix/*, hotfix/*, release/*, or <ISSUE-ID>/type/name"
          else
            echo "✅ Branch name follows conventions"
          fi

  # ==========================================
  # JOB 6: Generate PR Report
  # ==========================================
  generate-report:
    name: Generate PR Report
    runs-on: ubuntu-latest
    needs: [validate-pr, quick-build, dependency-analysis, lint, branch-protection]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate Markdown Report
        run: |
          mkdir -p reports
          
          cat > reports/pr-validation-report.md << 'EOFMARKDOWN'
---
title: PR Validation Report
nav_order: 1
---

# 📋 PR Validation Report

**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S")
**PR:** #${{ github.event.pull_request.number }}
**Branch:** ${{ github.head_ref }}

---

## 📋 Validation Results

| Check | Status |
|-------|--------|
| PR Title & Description | ${{ needs.validate-pr.result }} |
| Quick Build | ${{ needs.quick-build.result }} |
| Dependency Analysis | ${{ needs.dependency-analysis.result }} |
| Code Lint | ${{ needs.lint.result }} |
| Branch Protection | ${{ needs.branch-protection.result }} |

---

## 📝 PR Details

- **Title:** ${{ github.event.pull_request.title }}
- **Author:** ${{ github.event.pull_request.user.login }}
- **Created:** ${{ github.event.pull_request.created_at }}
- **Changes:** ${{ github.event.pull_request.changed_files }} files

---

## ✅ Conclusion

EOFMARKDOWN
          
          # Add conclusion based on results
          if [ "${{ needs.validate-pr.result }}" == "success" ] && \
             [ "${{ needs.quick-build.result }}" == "success" ]; then
            echo "✅ **PR Ready**: Validation passed, ready for CI pipeline" >> reports/pr-validation-report.md
          else
            echo "⚠️ **Review Required**: Some checks failed, please review" >> reports/pr-validation-report.md
          fi
          
          cat >> reports/pr-validation-report.md << 'EOFMARKDOWN'

---

*Report generated by PR Validation Pipeline*
EOFMARKDOWN
          
          echo "PR validation report generated"

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: pr-validation-report
          path: reports
          retention-days: 7

  # ==========================================
  # JOB 7: Auto-Comment PR
  # ==========================================
  comment-pr:
    name: Comment PR
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Comment PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.issue.number;
            const prTitle = context.payload.pull_request.title;
            const branchName = context.payload.pull_request.head.ref;
            
            const comment = `
            ## 🔍 PR Validation Summary

            **Branch:** \`${branchName}\`
            
            ### Quick Info
            - ✅ Build: Compiled successfully
            - ✅ Dependencies: Analyzed
            - ✅ Lint: Checkstyle completed
            
            ### Next Steps
            1. Wait for CI workflows to complete
            2. Review test coverage results
            3. Ensure all checks pass before merging
            
            ---
            *This comment is automatically generated*
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            })

  # ==========================================
  # JOB 8: Publish Reports to docs/wiki/
  # ==========================================
  publish-report:
    name: Publish to Wiki
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: pr-validation-report
          path: ./reports

      - name: Generate PR Report for Wiki
        run: |
          mkdir -p docs/wiki/cicd-reports
          PR_NUMBER=${{ github.event.pull_request.number }}
          DATE=$(date +%Y-%m-%d)
          
          # Generate PR Validation Report
          cat > docs/wiki/cicd-reports/pr-validation-$PR_NUMBER.md << EOF
---
title: PR #$PR_NUMBER Validation Report
---

# PR Validation Report

**PR:** #$PR_NUMBER  
**Branch:** ${{ github.head_ref }}  
**Date:** $DATE

## Validation Results

| Check | Status |
|-------|--------|
| PR Title & Description | ${{ needs.validate-pr.result }} |
| Quick Build | ${{ needs.quick-build.result }} |
| Dependency Analysis | ${{ needs.dependency-analysis.result }} |
| Code Lint | ${{ needs.lint.result }} |
| Branch Protection | ${{ needs.branch-protection.result }} |

## PR Details

- **Title:** ${{ github.event.pull_request.title }}
- **Author:** ${{ github.event.pull_request.user.login }}
- **Changes:** ${{ github.event.pull_request.changed_files }} files

## Status

EOF
          
          if [ "${{ needs.validate-pr.result }}" == "success" ] && [ "${{ needs.quick-build.result }}" == "success" ]; then
            echo "✅ **PR Ready** - Validation passed, ready for CI pipeline" >> docs/wiki/cicd-reports/pr-validation-$PR_NUMBER.md
          else
            echo "⚠️ **Review Required** - Some checks failed" >> docs/wiki/cicd-reports/pr-validation-$PR_NUMBER.md
          fi
          
          echo "" >> docs/wiki/cicd-reports/pr-validation-$PR_NUMBER.md
          echo "---" >> docs/wiki/cicd-reports/pr-validation-$PR_NUMBER.md
          echo "*Report generated on $DATE*" >> docs/wiki/cicd-reports/pr-validation-$PR_NUMBER.md
          
          echo "PR Validation Report generated"

      - name: Commit and Push Reports
        run: |
          git config --local user.email "ci@notaire.com"
          git config --local user.name "CI Bot"
          
          git add docs/wiki/cicd-reports/ 2>/dev/null || echo "No reports to add"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: add PR validation report for PR #${{ github.event.pull_request.number }}" || echo "No changes to commit"
            git push origin ${{ github.head_ref }} || git push origin ${{ github.head_ref }} --force
          fi