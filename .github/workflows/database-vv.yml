name: Database V&V

# Issue #1191 / CU76 / CU75. Black-box database verification: empty PostgreSQL, Flyway CLI migrate,
# SQL checks (testing/database). Runs on a version tag and on manual dispatch. GitHub does not
# apply paths filters to tag pushes, so a release always runs the suite. Former pull-request
# filters were testing/database/**, backend-api/src/main/resources/db/migration/**,
# testing/scripts/run.sh and .github/workflows/database-vv.yml.
# Mirrored locally by `bash workspace/sdlc/preflight.sh --full` ("database v&v suite").
on:
  push:
    tags:
      - 'v*'
      - 'notaire-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-vv:
    name: Database V&V
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run the database suite
        run: bash testing/scripts/run.sh database
