name: Database V&V

# Caller for matiaspakua/notaire-testing reusable database V&V (#2514).
on:
  push:
    tags:
      - 'v*'
      - 'notaire-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-vv:
    name: Database V&V
    uses: matiaspakua/notaire-testing/.github/workflows/database-vv.yml@e2bfc27200439898f5d7c0a29a218ceb0358cb28
    with:
      app-ref: ${{ github.sha }}
      testing-ref: e2bfc27200439898f5d7c0a29a218ceb0358cb28
