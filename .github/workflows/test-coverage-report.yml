name: Test Coverage Report

# Aggregates backend (JaCoCo), frontend (Vitest) and E2E coverage into a
# single artifact. Report-only: test enforcement happens in ci.yml,
# frontend-ci.yml and playwright-e2e.yml.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run test coverage script
        run: bash integration-test/scripts/generate-coverage-report.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage-reports/
          retention-days: 30
