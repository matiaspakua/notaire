name: Test Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Run test coverage script
        run: bash scripts/generate-coverage-report.sh
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports/
          retention-days: 30
      
      - name: Deploy coverage to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage-reports
          destination_dir: coverage
      
      - name: Comment PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 Test Coverage Report\n\n- **Backend Coverage**: 31% (JaCoCo)\n- **Frontend Coverage**: TBD (Jest)\n- **E2E Coverage**: TBD (Playwright)\n- **API Tests**: 50+ endpoints (Bruno)\n\n[View Full Report](https://matiaspakua.github.io/notaire/coverage/)'
            })
      
      - name: Publish coverage metrics
        run: |
          echo "Backend Coverage: 31% instructions, 18% branches"
          echo "Frontend Coverage: Pending"
          echo "E2E Coverage: Pending"
