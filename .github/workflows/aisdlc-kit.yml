name: AI SDLC kit

# Adopter verify only (#2512). Kit packaging and aisdlc-v* releases live in
# https://github.com/draclab/ai_sdlc — Notaire must not publish those tags.

on:
  pull_request:
    paths:
      - "framework/ai-sdlc/**"
      - ".gitmodules"
      - ".github/workflows/aisdlc-kit.yml"
      - ".github/actions/checkout-with-submodules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Init submodules
        uses: ./.github/actions/checkout-with-submodules
        with:
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
        env:
          SUBMODULES_SSH_KEY: ${{ secrets.SUBMODULES_SSH_KEY }}
          REPOLENS_SUBMODULE_SSH_KEY: ${{ secrets.REPOLENS_SUBMODULE_SSH_KEY }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling (offline-friendly setuptools)
        run: python3 -m pip install -q setuptools wheel
      - name: Kit verify (includes conformance matrix)
        run: env -u TRACEPARENT bash framework/ai-sdlc/verify.sh
