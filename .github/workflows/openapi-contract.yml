name: OpenAPI Contract

# Issue #1067 / CU76. On every PR: regenerate OpenAPI from the backend and
# fail if the committed artifact is stale or introduces breaking changes vs
# the base branch's committed spec.
#
# Bootstrap: when the base ref does not yet contain
# backend-api/openapi/openapi.yaml (first introduction), skip the breaking
# diff after the freshness check — fail-on ERR applies only once a base
# artifact exists.
#
# Intended breaks: list the exact oasdiff line in this pull request's own
# backend-api/openapi/accepted-breaking-changes.d/<issue>-<slug>.txt (#1315,
# see the README there).
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      frontend: ${{ steps.out.outputs.frontend }}
      testing: ${{ steps.out.outputs.testing }}
      docs: ${{ steps.out.outputs.docs }}
      ci: ${{ steps.out.outputs.ci }}
      openapi: ${{ steps.out.outputs.openapi }}
      product: ${{ steps.out.outputs.product }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend-api/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
            testing:
              - 'testing/**'
            openapi:
              - 'backend-api/openapi/**'
              - 'backend-api/tools/export-openapi.sh'
            docs:
              - 'docs/**'
              - 'CONSTITUTION.md'
              - 'AGENTS.md'
              - 'CHANGELOG.md'
              - '.claude/**'
              - 'github-page/**'
            ci:
              - '.github/workflows/**'
              - 'workspace/sdlc/**'
              - 'workspace/tests/**'
              - 'workspace/ci/**'
              - 'security/**'
              - 'contracts/**'
      - id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in backend frontend testing docs ci openapi product; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          echo "testing=${{ steps.filter.outputs.testing }}" >> "$GITHUB_OUTPUT"
          echo "docs=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
          echo "ci=${{ steps.filter.outputs.ci }}" >> "$GITHUB_OUTPUT"
          echo "openapi=${{ steps.filter.outputs.openapi }}" >> "$GITHUB_OUTPUT"
          product=false
          if [ "${{ steps.filter.outputs.backend }}" = "true" ] \
            || [ "${{ steps.filter.outputs.frontend }}" = "true" ] \
            || [ "${{ steps.filter.outputs.testing }}" = "true" ] \
            || [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            product=true
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  openapi-contract:
    name: OpenAPI commit + breaking diff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes]
    if: ${{ needs.changes.outputs.openapi == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base ref for OpenAPI comparison
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Export OpenAPI from springdoc (H2)
        run: bash backend-api/tools/export-openapi.sh --maven

      - name: Committed OpenAPI must match export
        run: |
          if ! git diff --exit-code -- backend-api/openapi/openapi.yaml; then
            echo "::error::backend-api/openapi/openapi.yaml is stale."
            echo "Regenerate with: bash backend-api/tools/export-openapi.sh"
            echo "Then commit the updated artifact in the same PR."
            exit 1
          fi

      - name: Resolve base OpenAPI for breaking-change diff
        id: base
        run: |
          set -euo pipefail
          SPEC_PATH="backend-api/openapi/openapi.yaml"
          BASE_REF="${{ github.base_ref || 'main' }}"
          BASE_SPEC_REF="origin/${BASE_REF}:${SPEC_PATH}"
          mkdir -p .openapi-ci
          rm -f .openapi-ci/base-openapi.yaml

          if git cat-file -e "${BASE_SPEC_REF}" 2>/dev/null; then
            git show "${BASE_SPEC_REF}" > .openapi-ci/base-openapi.yaml
            if [ ! -s .openapi-ci/base-openapi.yaml ]; then
              echo "::error::Base OpenAPI at ${BASE_SPEC_REF} is empty"
              exit 1
            fi
            echo "has_base=true" >> "$GITHUB_OUTPUT"
            echo "Base OpenAPI found at ${BASE_SPEC_REF} — running breaking-change gate."
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenAPI breaking diff"
              echo ""
              echo "**Skipped (bootstrap):** \`${SPEC_PATH}\` is not present on"
              echo "\`origin/${BASE_REF}\` yet. Freshness check against the export still ran."
              echo "Subsequent PRs will fail on \`oasdiff\` ERR-level breaking changes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=OpenAPI breaking diff skipped::No ${SPEC_PATH} on origin/${BASE_REF} yet (first introduction). Breaking-change gate skipped; freshness check still enforced."
          fi

      # oasdiff runs from its checksum-verified release binary, not the Docker-based
      # oasdiff-action: building tufin/oasdiff from Docker Hub failed with 429 rate
      # limits on shared runners (#1380). Same version (v1.33.0) and same rule.
      - name: Install oasdiff
        if: steps.base.outputs.has_base == 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/oasdiff.tar.gz \
            https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          echo "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff

      # One file per pull request in accepted-breaking-changes.d (#1315), so
      # accepting a break never conflicts with another open pull request. Files
      # unchanged on the base belong to merged pull requests: their breaks are in
      # the base spec already and they are never ignored (listed for deletion).
      # This pull request's entries must still match a current break (no stale
      # entry or typo) and are the only list the diff below ignores.
      - name: "Accepted breaking changes: assemble and check"
        if: steps.base.outputs.has_base == 'true'
        run: |
          set -euo pipefail
          # Uses the oasdiff binary installed above.
          OASDIFF=/tmp/oasdiff python3 workspace/sdlc/check-accepted-breaking-changes.py \
            .openapi-ci/base-openapi.yaml backend-api/openapi/openapi.yaml \
            --base-ref "origin/${{ github.base_ref || 'main' }}" \
            --write-ignore .openapi-ci/accepted-breaking-changes.txt

      - name: Detect breaking OpenAPI changes (oasdiff)
        if: steps.base.outputs.has_base == 'true'
        run: |
          # Owner-accepted breaks of this pull request only (assembled above).
          /tmp/oasdiff breaking .openapi-ci/base-openapi.yaml backend-api/openapi/openapi.yaml \
            --fail-on ERR \
            --err-ignore .openapi-ci/accepted-breaking-changes.txt \
            --format githubactions

  suite-openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, openapi-contract]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Require OpenAPI contract success or intentional skip
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "openapi-contract=${{ needs.openapi-contract.result }}"
          do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}=${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "${failed}"

