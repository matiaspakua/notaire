name: Playwright E2E — Full Suite

# API tests (Bruno) + UI E2E tests (Playwright) against the full stack
# (PostgreSQL + backend + frontend). Runs on every PR into main, every merge
# to main, on a weekday schedule, and on manual dispatch. Test failures FAIL
# the pipeline. The coverage-report job publishes artifact + job summary on
# non-PR events (no git commits to main — issue #1041); see its `if:`.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1-5'  # Weekdays 6am UTC
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (--grep)'
        required: false
        default: ''
        type: string
      cleanup:
        description: 'Cleanup test data after run'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_URL: http://localhost:8080/api/v1
  BASE_URL: http://localhost:3000
  E2E_CLEANUP: ${{ inputs.cleanup || 'true' }}
  JWT_SECRET: ci-e2e-only-jwt-secret-do-not-use-in-prod-!!
  ACTUATOR_USER: ci-e2e-actuator-user
  ACTUATOR_PASSWORD: ci-e2e-actuator-pass

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      frontend: ${{ steps.out.outputs.frontend }}
      testing: ${{ steps.out.outputs.testing }}
      docs: ${{ steps.out.outputs.docs }}
      ci: ${{ steps.out.outputs.ci }}
      openapi: ${{ steps.out.outputs.openapi }}
      product: ${{ steps.out.outputs.product }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend-api/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
            testing:
              - 'testing/**'
            openapi:
              - 'backend-api/openapi/**'
              - 'backend-api/tools/export-openapi.sh'
            docs:
              - 'docs/**'
              - 'CONSTITUTION.md'
              - 'AGENTS.md'
              - 'CHANGELOG.md'
              - '.claude/**'
              - 'github-page/**'
            ci:
              - '.github/workflows/**'
              - 'workspace/sdlc/**'
              - 'workspace/tests/**'
              - 'workspace/ci/**'
              - 'security/**'
              - 'contracts/**'
      - id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in backend frontend testing docs ci openapi product; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          echo "testing=${{ steps.filter.outputs.testing }}" >> "$GITHUB_OUTPUT"
          echo "docs=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
          echo "ci=${{ steps.filter.outputs.ci }}" >> "$GITHUB_OUTPUT"
          echo "openapi=${{ steps.filter.outputs.openapi }}" >> "$GITHUB_OUTPUT"
          product=false
          if [ "${{ steps.filter.outputs.backend }}" = "true" ] \
            || [ "${{ steps.filter.outputs.frontend }}" = "true" ] \
            || [ "${{ steps.filter.outputs.testing }}" = "true" ] \
            || [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            product=true
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # JOB 1: Backend Build
  # ──────────────────────────────────────────────
  backend-build:
    name: Build Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: ${{ needs.changes.outputs.product == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Build backend
        run: mvn clean package -pl backend-api -am -DskipTests -q

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend-api/target/*.jar
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2: Frontend Build
  # ──────────────────────────────────────────────
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.product == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js app
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1
          include-hidden-files: true

  # ──────────────────────────────────────────────
  # JOB 3: API Tests (Bruno) — requires DB + backend
  # ──────────────────────────────────────────────
  api-tests:
    name: API Tests (Bruno)
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub library image via Google's public pull-through cache: anonymous
        # Docker Hub pulls hit the 429 rate limit on shared runners (#1380).
        image: mirror.gcr.io/library/postgres:16.15-alpine
        env:
          POSTGRES_DB: notaire
          POSTGRES_USER: notaire
          POSTGRES_PASSWORD: notaire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-api/target/

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '26'

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start backend API
        run: |
          java -jar backend-api/target/*.jar \
            --server.port=8080 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/notaire \
            --spring.datasource.username=notaire \
            --spring.datasource.password=notaire \
            --spring.jpa.hibernate.ddl-auto=update \
            --jwt.secret="${JWT_SECRET}" \
            --actuator.security.username="${ACTUATOR_USER}" \
            --actuator.security.password="${ACTUATOR_PASSWORD}" &
          echo "Waiting for backend..."
          sleep 15
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done'
          echo "Backend is ready"

      # The collection sends "Authorization: Bearer {{token}}" on every request
      # (opencollection.yml). Folders run alphabetically, so the token must be
      # provided up front rather than captured by the auth/login request.
      - name: Run Bruno API tests
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/usuarios/login \
            -H 'Content-Type: application/json' \
            -d '{"name":"admin","password":"admin"}' | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: could not obtain JWT token from login endpoint" >&2
            exit 1
          fi
          cd backend-api/api-test
          # The CLI stays unpinned (see api-test/README.md), so every run resolves
          # it from the live npm registry. Retry the install so a transient
          # registry error (e.g. a dependency published seconds after its
          # dependent: ETARGET tldts-core@^7.4.17, #567) does not fail the suite.
          for attempt in 1 2 3; do
            if npx --yes @usebruno/cli --version; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "ERROR: could not install @usebruno/cli after 3 attempts" >&2
              exit 1
            fi
            echo "Bruno CLI install failed (attempt $attempt/3); retrying in 60s" >&2
            sleep 60
          done
          npx @usebruno/cli run --env Development \
            --env-var token="$TOKEN" \
            --reporter-junit bruno-results.xml \
            --reporter-json bruno-results.json \
            --reporter-html bruno-report.html

      - name: Upload API test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-report
          path: |
            backend-api/api-test/bruno-results.xml
            backend-api/api-test/bruno-results.json
            backend-api/api-test/bruno-report.html
          retention-days: 30

      - name: Publish API test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: API Tests (Bruno)
          path: backend-api/api-test/bruno-results.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 4: UI E2E Tests (Playwright) — sharded (#1258 / #1197 P0.3)
  # ──────────────────────────────────────────────
  e2e-tests:
    name: UI E2E shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 30
    services:
      postgres:
        # Docker Hub library image via Google's public pull-through cache: anonymous
        # Docker Hub pulls hit the 429 rate limit on shared runners (#1380).
        image: mirror.gcr.io/library/postgres:16.15-alpine
        env:
          POSTGRES_DB: notaire
          POSTGRES_USER: notaire
          POSTGRES_PASSWORD: notaire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      # ── Download builds ──
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-api/target/

      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/.next/

      # ── Setup Node ──
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            testing/e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install E2E suite dependencies
        run: npm ci
        working-directory: testing/e2e

      - name: Type-check E2E suite
        run: npx tsc --noEmit
        working-directory: testing/e2e

      - name: Lint E2E suite
        run: npx eslint . --max-warnings=0
        working-directory: testing/e2e

      # ── Setup Java ──
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '26'

      # ── Start backend ──
      - name: Start backend API
        run: |
          java -jar backend-api/target/*.jar \
            --server.port=8080 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/notaire \
            --spring.datasource.username=notaire \
            --spring.datasource.password=notaire \
            --spring.jpa.hibernate.ddl-auto=update \
            --jwt.secret="${JWT_SECRET}" \
            --actuator.security.username="${ACTUATOR_USER}" \
            --actuator.security.password="${ACTUATOR_PASSWORD}" &
          echo "Waiting for backend..."
          sleep 15
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done'
          echo "Backend is ready"

      # ── Start frontend ──
      - name: Start frontend
        run: |
          npm run start &
          echo "Waiting for frontend..."
          sleep 5
          npx wait-on http://localhost:3000 --timeout 30000
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8080/api/v1

      # ── Install Playwright ──
      # chromium: smoke/health projects (bundled engine).
      # chrome: the "chromium" project pins channel:"chrome" (testing/e2e/playwright.config.ts).
      # webkit: the "mobile" project emulates iPhone SE, which uses the WebKit engine.
      - name: Install Playwright browsers
        # Retried: a truncated browser download (e.g. the Chrome .deb, "Invalid archive
        # signature") is a transient CDN failure, not a test failure (#1380).
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium chrome webkit; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "ERROR: could not install Playwright browsers after 3 attempts" >&2
              exit 1
            fi
            echo "Playwright browser install failed (attempt $attempt/3); retrying in 30s" >&2
            sleep 30
          done
        working-directory: testing/e2e

      # ── Run Playwright E2E tests ──
      # Deliberately NOT passing --reporter here (issue #658): the CLI --reporter flag
      # fully overrides playwright.config.ts's own `reporter` array, silently dropping
      # its outputFile paths (test-results/results.json, results.xml) that
      # testing/tools/generate_e2e_coverage_report.py depends on, and the custom
      # tests/reporters/coverage-report.ts business-coverage reporter entirely.
      - name: Run Playwright E2E tests
        run: |
          if [ -n "${{ inputs.test_filter }}" ]; then
            npx playwright test --shard=${{ matrix.shard }}/3 --grep "${{ inputs.test_filter }}"
          else
            npx playwright test --shard=${{ matrix.shard }}/3
          fi
        working-directory: testing/e2e
        env:
          CI: true
          E2E_CLEANUP: ${{ env.E2E_CLEANUP }}

      # ── Upload blob report for merge-reports (#1258) ──
      - name: Upload Playwright blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: testing/e2e/blob-report/
          retention-days: 7
          if-no-files-found: ignore

      # ── Per-shard HTML / junit for triage ──
      - name: Upload Playwright shard report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            testing/e2e/playwright-report/
            testing/e2e/test-results/
          retention-days: 30

      - name: Upload traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: testing/e2e/test-results/traces/
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: UI E2E Test Results (${{ matrix.shard }}/3)
          path: testing/e2e/test-results/results.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 4b: Merge shard reports — keep heavy-CI check name (#1258)
  # Exact check-run name must remain "UI E2E Tests (Playwright)" for
  # workspace/sdlc/check-heavy-ci.sh.
  # ──────────────────────────────────────────────
  e2e-merge-reports:
    name: UI E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: ${{ always() && !cancelled() && needs.e2e-tests.result != 'skipped' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testing/e2e/package-lock.json

      - name: Install E2E suite dependencies
        run: npm ci
        working-directory: testing/e2e

      - name: Download shard blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-shard-*
          path: testing/e2e/all-blob-reports
          merge-multiple: true

      - name: Fail if any shard failed
        if: needs.e2e-tests.result != 'success'
        run: |
          echo "e2e-tests result=${{ needs.e2e-tests.result }} — fail-closed merge (#1258)" >&2
          exit 1

      - name: Merge blob reports
        run: npx playwright merge-reports --reporter html,json,junit ./all-blob-reports
        working-directory: testing/e2e
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            testing/e2e/playwright-report/
            testing/e2e/test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # JOB 5: Generate and publish coverage report
  # ──────────────────────────────────────────────
  coverage-report:
    name: Business Coverage Report
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-merge-reports]
    # Artifact + job summary only — never on a pull_request run (issue #1041).
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: api-test-report
          path: bruno-results
        continue-on-error: true

      - name: Generate coverage markdown from actual test results
        env:
          GHA_EVENT: ${{ github.event_name }}
          ARTIFACTS_ROOT: .
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p reports
          export OUTPUT_FILE="reports/e2e-coverage-$DATE.md"
          export REPORT_DATE="$DATE"
          python3 testing/tools/generate_e2e_coverage_report.py

      - name: Publish coverage report to job summary
        run: |
          REPORT=$(ls -1 reports/e2e-coverage-*.md 2>/dev/null | head -1 || true)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            {
              echo "## E2E business coverage report"
              echo ""
              cat "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No E2E coverage markdown generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-report
          path: reports/e2e-coverage-*.md
          retention-days: 30
          if-no-files-found: ignore

  # Suite aggregator for ruleset required check (#1040)
  # Exact check-run name must be "Playwright E2E".
  suite-playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, api-tests, e2e-merge-reports]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Require Playwright / Bruno suite jobs success
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "api-tests=${{ needs.api-tests.result }}" \
            "e2e-merge-reports=${{ needs.e2e-merge-reports.result }}"
          do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}=${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "${failed}"
