name: Playwright E2E — Full Suite

# API tests (Bruno) + UI E2E tests (Playwright) against the full stack
# (PostgreSQL + backend + frontend). Runs on every PR into main, every merge
# to main, on a weekday schedule, and on manual dispatch. Test failures FAIL
# the pipeline. The coverage-report job (commits to docs/wiki/ and pushes to
# main) is guarded to skip pull_request runs — see its `if:`.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1-5'  # Weekdays 6am UTC
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (--grep)'
        required: false
        default: ''
        type: string
      cleanup:
        description: 'Cleanup test data after run'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
  BASE_URL: http://localhost:3000
  E2E_CLEANUP: ${{ inputs.cleanup || 'true' }}
  JWT_SECRET: ci-e2e-only-jwt-secret-do-not-use-in-prod-!!
  ACTUATOR_USER: ci-e2e-actuator-user
  ACTUATOR_PASSWORD: ci-e2e-actuator-pass

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Backend Build
  # ──────────────────────────────────────────────
  backend-build:
    name: Build Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend
        run: mvn clean package -pl backend-api -am -DskipTests -q

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend-api/target/*.jar
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2: Frontend Build
  # ──────────────────────────────────────────────
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js app
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1
          include-hidden-files: true

  # ──────────────────────────────────────────────
  # JOB 3: API Tests (Bruno) — requires DB + backend
  # ──────────────────────────────────────────────
  api-tests:
    name: API Tests (Bruno)
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notaire
          POSTGRES_USER: notaire
          POSTGRES_PASSWORD: notaire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-api/target/

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start backend API
        run: |
          java -jar backend-api/target/*.jar \
            --server.port=8080 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/notaire \
            --spring.datasource.username=notaire \
            --spring.datasource.password=notaire \
            --spring.jpa.hibernate.ddl-auto=update \
            --jwt.secret="${JWT_SECRET}" \
            --actuator.security.username="${ACTUATOR_USER}" \
            --actuator.security.password="${ACTUATOR_PASSWORD}" &
          echo "Waiting for backend..."
          sleep 15
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done'
          echo "Backend is ready"

      # The collection sends "Authorization: Bearer {{token}}" on every request
      # (opencollection.yml). Folders run alphabetically, so the token must be
      # provided up front rather than captured by the auth/login request.
      - name: Run Bruno API tests
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/usuarios/login \
            -H 'Content-Type: application/json' \
            -d '{"nombre":"admin","contrasenia":"admin"}' | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: could not obtain JWT token from login endpoint" >&2
            exit 1
          fi
          cd backend-api/api-test
          npx @usebruno/cli run --env Developmen \
            --env-var token="$TOKEN" \
            --reporter-junit bruno-results.xml \
            --reporter-json bruno-results.json \
            --reporter-html bruno-report.html

      - name: Upload API test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-report
          path: |
            backend-api/api-test/bruno-results.xml
            backend-api/api-test/bruno-results.json
            backend-api/api-test/bruno-report.html
          retention-days: 30

      - name: Publish API test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: API Tests (Bruno)
          path: backend-api/api-test/bruno-results.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 4: UI E2E Tests (Playwright) — requires DB + backend + frontend
  # ──────────────────────────────────────────────
  e2e-tests:
    name: UI E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notaire
          POSTGRES_USER: notaire
          POSTGRES_PASSWORD: notaire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      # ── Download builds ──
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-api/target/

      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/.next/

      # ── Setup Node ──
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Setup Java ──
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Start backend ──
      - name: Start backend API
        run: |
          java -jar backend-api/target/*.jar \
            --server.port=8080 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/notaire \
            --spring.datasource.username=notaire \
            --spring.datasource.password=notaire \
            --spring.jpa.hibernate.ddl-auto=update \
            --jwt.secret="${JWT_SECRET}" \
            --actuator.security.username="${ACTUATOR_USER}" \
            --actuator.security.password="${ACTUATOR_PASSWORD}" &
          echo "Waiting for backend..."
          sleep 15
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done'
          echo "Backend is ready"

      # ── Start frontend ──
      - name: Start frontend
        run: |
          npm run start &
          echo "Waiting for frontend..."
          sleep 5
          npx wait-on http://localhost:3000 --timeout 30000
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      # ── Install Playwright ──
      # chromium: smoke/health projects (bundled engine).
      # chrome: the "chromium" project pins channel:"chrome" (playwright.config.ts).
      # webkit: the "mobile" project emulates iPhone SE, which uses the WebKit engine.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome webkit
        working-directory: frontend

      # ── Run Playwright E2E tests ──
      # Deliberately NOT passing --reporter here (issue #658): the CLI --reporter flag
      # fully overrides playwright.config.ts's own `reporter` array, silently dropping
      # its outputFile paths (test-results/results.json, results.xml) that
      # scripts/generate_e2e_coverage_report.py depends on, and the custom
      # tests/e2e/reporters/coverage-report.ts business-coverage reporter entirely.
      - name: Run Playwright E2E tests
        run: |
          if [ -n "${{ inputs.test_filter }}" ]; then
            npx playwright test --grep "${{ inputs.test_filter }}"
          else
            npx playwright test
          fi
        working-directory: frontend
        env:
          CI: true
          E2E_CLEANUP: ${{ env.E2E_CLEANUP }}

      # ── Upload Playwright results ──
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      # ── Upload trace on failure ──
      - name: Upload traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/traces/
          retention-days: 7

      # ── Publish test results as a check ──
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: UI E2E Test Results
          path: frontend/test-results/results.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 5: Generate and publish coverage report
  # ──────────────────────────────────────────────
  coverage-report:
    name: Business Coverage Report
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    # Commits to docs/wiki/ and pushes to main — never on a pull_request run.
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: api-test-report
          path: bruno-results
        continue-on-error: true

      - name: Generate coverage markdown from actual test results
        env:
          GHA_EVENT: ${{ github.event_name }}
          ARTIFACTS_ROOT: .
        run: |
          DATE=$(date +%Y-%m-%d)
          export OUTPUT_FILE="docs/wiki/cicd-reports/e2e-coverage-$DATE.md"
          export REPORT_DATE="$DATE"
          python3 scripts/generate_e2e_coverage_report.py

      - name: Commit coverage report
        continue-on-error: true
        run: |
          git config --local user.email "ci@notaire.com"
          git config --local user.name "CI Bot"
          git add docs/wiki/cicd-reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: add E2E coverage report for $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main || echo "Push skipped"
          fi
