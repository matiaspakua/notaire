name: Playwright E2E — Full Suite

# Caller for matiaspakua/notaire-testing reusable E2E workflow (#2514).
# Job display name stays "Playwright E2E" for protect-main / required checks.
on:
  push:
    tags:
      - 'v*'
      - 'notaire-v*'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (--grep)'
        required: false
        default: ''
        type: string
      cleanup:
        description: 'Cleanup test data after run'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-playwright-e2e:
    name: Playwright E2E
    uses: matiaspakua/notaire-testing/.github/workflows/e2e.yml@e2bfc27200439898f5d7c0a29a218ceb0358cb28
    with:
      app-ref: ${{ github.sha }}
      testing-ref: e2bfc27200439898f5d7c0a29a218ceb0358cb28
      test_filter: ${{ inputs.test_filter || '' }}
      cleanup: ${{ inputs.cleanup || 'true' }}
