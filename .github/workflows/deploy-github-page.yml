name: Deploy GitHub Page (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: github-page/package-lock.json

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── Generate coverage + snapshot from scratch ──
      - name: Run tests with coverage
        run: |
          echo "Running tests to generate JaCoCo reports..."
          mvn clean test jacoco:report -pl backend-api -am -q 2>/dev/null || true

      - name: Generate coverage snapshot
        run: |
          python3 scripts/generate-coverage-snapshot.py
          if [ -f "backend-api/target/site/jacoco/jacoco.xml" ]; then
            mkdir -p jacoco-report
            cp -r backend-api/target/site/jacoco/* jacoco-report/
          fi

      # ── Copy coverage reports to Next.js public dir ──
      - name: Copy coverage reports to public directory
        run: |
          mkdir -p github-page/public/coverage
          if [ -d "jacoco-report" ] && [ "$(ls -A jacoco-report 2>/dev/null)" ]; then
            cp -r jacoco-report/* github-page/public/coverage/
          else
            printf '%s\n' \
              '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Coverage Reports</title>' \
              '<meta http-equiv="refresh" content="0; url=/notaire/"></head>' \
              '<body><p>Coverage reports not available. <a href="/notaire/">Back to home</a></p></body></html>' \
              > github-page/public/coverage/index.html
          fi

      # ── Download Playwright E2E report ──
      - name: Download Playwright E2E report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading latest Playwright report from playwright-e2e.yml..."
          mkdir -p github-page/public/playwright
          if gh run download --repo "${{ github.repository }}" \
            --name playwright-report \
            --workflow playwright-e2e.yml \
            --dir playwright-report-dl 2>/dev/null; then
            if [ -d "playwright-report-dl" ] && [ "$(ls -A playwright-report-dl 2>/dev/null)" ]; then
              cp -r playwright-report-dl/* github-page/public/playwright/
              echo "Copied Playwright report to public/playwright/"
              ls -la github-page/public/playwright/ || true
            fi
          else
            echo "No Playwright report available (workflow may not have run yet)"
            printf '%s\n' \
              '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Playwright E2E Report</title>' \
              '<meta http-equiv="refresh" content="0; url=/notaire/"></head>' \
              '<body><p>Playwright E2E report not available. <a href="/notaire/">Back to home</a></p></body></html>' \
              > github-page/public/playwright/index.html
          fi

      # ── Generate metrics.json ──
      - name: Generate metrics.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          PR_COUNT=$(gh api "search/issues?q=repo:${REPO}+type:pr&per_page=1" --jq '.total_count' 2>/dev/null || echo "0")
          MD_COUNT=$(find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/.git/*" | wc -l | tr -d ' ')
          BACKEND_TEST_COUNT=$(find backend-api/src/test -name "*Test.java" 2>/dev/null | wc -l | tr -d ' ')
          FRONTEND_TEST_COUNT=$(find frontend/tests -name "*.spec.*" 2>/dev/null | wc -l | tr -d ' ')
          TEST_COUNT=$(( BACKEND_TEST_COUNT + FRONTEND_TEST_COUNT ))
          ADR_COUNT=$(find docs -name "ADR-*.md" 2>/dev/null | wc -l | tr -d ' ')
          UC_COUNT=$(find docs/01-business/02-use-cases -type f -name "CU*.md" 2>/dev/null | wc -l | tr -d ' ')
          RF_FILE="docs/01-business/01-requirements/01_RF - Requerimientos Funcionales/requerimientos.csv"
          RF_COUNT=$(tail -n +2 "$RF_FILE" 2>/dev/null | wc -l | tr -d ' ')
          DC1=$(yq '.services | length' docker-compose.yml 2>/dev/null || echo "0")
          DC2=$(yq '.services | length' infra/docker-compose.yml 2>/dev/null || echo "0")
          DOCKER_COUNT=$(( DC1 + DC2 ))
          GRAFANA_COUNT=$(find infra/grafana/provisioning/dashboards -name "*.json" 2>/dev/null | wc -l | tr -d ' ')
          CONTRIBUTORS=$(git log --format="%aE" | sort -u | wc -l | tr -d ' ')
          FIRST_COMMIT=$(git log --reverse --format="%aI" | head -1)

          COVERAGE_FILE="coverage-snapshot/coverage-snapshot.json"
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_JSON=$(cat "$COVERAGE_FILE")
          else
            COVERAGE_JSON='{"backendInstruction":0,"backendBranch":0,"frontendComponent":0,"e2eTests":0,"apiEndpoints":0,"lastUpdated":"unknown"}'
          fi

          mkdir -p github-page/public
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > github-page/public/metrics.json << METRICS_EOF
          {
            "generatedAt": "${GENERATED_AT}",
            "commits": ${COMMIT_COUNT},
            "pullRequests": ${PR_COUNT},
            "markdownFiles": ${MD_COUNT},
            "testClasses": ${TEST_COUNT},
            "adrCount": ${ADR_COUNT},
            "useCases": ${UC_COUNT},
            "functionalRequirements": ${RF_COUNT},
            "dockerServices": ${DOCKER_COUNT},
            "grafanaDashboards": ${GRAFANA_COUNT},
            "aiTools": 4,
            "contributors": ${CONTRIBUTORS},
            "firstCommitDate": "${FIRST_COMMIT}",
            "coverage": ${COVERAGE_JSON}
          }
          METRICS_EOF

      - name: Install dependencies
        working-directory: github-page
        run: npm ci

      - name: Build static site
        working-directory: github-page
        run: npm run build
        env:
          NODE_ENV: production

      - name: Validate build output
        working-directory: github-page
        run: |
          if [ ! -f out/index.html ]; then
            echo "ERROR: Static build did not generate out/index.html" >&2
            ls -la out || true
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-page/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
