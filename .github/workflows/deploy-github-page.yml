name: Deploy GitHub Page

# Single source of truth for the GitHub Pages deployment (see issue #778).
# Auto-deploys after the CI pipeline (ci.yml) completes successfully on main,
# so the page is always up to date with every merge — the deploy only runs
# when CI passed. Manual dispatch is kept for on-demand rebuilds.
on:
  workflow_run:
    workflows: [ "CI - Build, Test & Security" ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run on manual dispatch, or only after the CI workflow on main succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: github-page/package-lock.json

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── Generate coverage + snapshot from scratch ──
      - name: Run tests with coverage
        run: |
          echo "Running tests to generate JaCoCo reports..."
          if ! mvn clean test jacoco:report -pl backend-api -am -q; then
            echo "::warning::mvn test failed -- coverage snapshot will fall back to last deployed values"
          fi

      - name: Generate coverage snapshot
        run: |
          # generate-coverage-snapshot.py exits nonzero and writes nothing when
          # jacoco.xml is missing (issue #758) -- that's expected here if the
          # mvn run above failed; the shared metrics script falls back to the
          # last deployed values in that case rather than fabricating zeros.
          python3 scripts/generate-coverage-snapshot.py || true
          if [ -f "backend-api/target/site/jacoco/jacoco.xml" ]; then
            mkdir -p jacoco-report
            cp -r backend-api/target/site/jacoco/* jacoco-report/
          fi

      # ── Copy coverage reports to Next.js public dir ──
      - name: Copy coverage reports to public directory
        run: |
          mkdir -p github-page/public/coverage
          if [ -d "jacoco-report" ] && [ "$(ls -A jacoco-report 2>/dev/null)" ]; then
            cp -r jacoco-report/* github-page/public/coverage/
          else
            printf '%s\n' \
              '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Coverage Reports</title>' \
              '<meta http-equiv="refresh" content="0; url=/notaire/"></head>' \
              '<body><p>Coverage reports not available. <a href="/notaire/">Back to home</a></p></body></html>' \
              > github-page/public/coverage/index.html
          fi

      # ── Download Playwright E2E report ──
      - name: Download Playwright E2E report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading latest Playwright report..."
          mkdir -p github-page/public/playwright
          # `gh run download` has no --workflow flag (confirmed against the CLI
          # manual, issue #758) -- it was silently failing to parse and always
          # falling into the placeholder branch below. Without a run-id, --name
          # alone already downloads the latest artifact matching that name across
          # the whole repo, which is what we want here.
          if gh run download --repo "${{ github.repository }}" \
            --name playwright-report \
            --dir playwright-report-dl 2>/dev/null; then
            if [ -d "playwright-report-dl" ] && [ "$(ls -A playwright-report-dl 2>/dev/null)" ]; then
              cp -r playwright-report-dl/* github-page/public/playwright/
              echo "Copied Playwright report to public/playwright/"
              ls -la github-page/public/playwright/ || true
            fi
          else
            echo "No Playwright report available (workflow may not have run yet)"
            printf '%s\n' \
              '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Playwright E2E Report</title>' \
              '<meta http-equiv="refresh" content="0; url=/notaire/"></head>' \
              '<body><p>Playwright E2E report not available. <a href="/notaire/">Back to home</a></p></body></html>' \
              > github-page/public/playwright/index.html
          fi

      - name: Download frontend coverage report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading latest frontend unit test coverage..."
          if gh run download --repo "${{ github.repository }}" \
            --name frontend-unit-test-report \
            --dir frontend-coverage-dl 2>/dev/null; then
            echo "Downloaded frontend coverage artifact"
          else
            echo "No frontend coverage artifact available yet"
          fi

      # ── Generate metrics.json ──
      - name: Generate metrics.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/generate-github-page-metrics.sh

      - name: Install dependencies
        working-directory: github-page
        run: npm ci

      - name: Build static site
        working-directory: github-page
        run: npm run build
        env:
          NODE_ENV: production

      - name: Validate build output
        working-directory: github-page
        run: |
          if [ ! -f out/index.html ]; then
            echo "ERROR: Static build did not generate out/index.html" >&2
            ls -la out || true
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-page/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
