name: Release Please

# Releases are manual (#2477): this runs only when the Owner dispatches it.
# First dispatch: opens or updates the release PR from Conventional Commits.
# After the Owner merges that PR, a second dispatch creates the v* tag and the
# GitHub Release and dispatches the tag workflows. A push to main starts nothing.
# Does not bypass protect-main.
# Day-to-day and release PRs are gated by `bash workspace/sdlc/preflight.sh --full`.
# After #2001 the heavy workflows do not run on pull_request, so the Owner must
# drop the retired required checks from protect-main (#1040) or the release PR
# cannot merge.
# Uses the default GITHUB_TOKEN; the repository setting "Allow GitHub Actions to
# create and approve pull requests" must stay enabled (#1264). A tag created
# with GITHUB_TOKEN does not start on.push.tags workflows (#1599); this job
# dispatches them. See RELEASE.md.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

      # #1753: openapi.yaml is regenerated byte-for-byte, so it cannot carry a
      # release-please marker. Sync info.version from the manifest on the release
      # branch so the version-coherence and OpenAPI contract gates pass.
      - name: Checkout release branch
        if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: release-please--branches--main--components--notaire
          token: ${{ github.token }}

      - name: Sync OpenAPI info.version on the release branch
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          python3 workspace/release/sync-openapi-version.py backend-api/openapi/openapi.yaml "$VERSION"
          if git diff --quiet -- backend-api/openapi/openapi.yaml; then
            echo "OpenAPI info.version already $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(api): record $VERSION as the OpenAPI info version" -- backend-api/openapi/openapi.yaml
          git push origin HEAD:release-please--branches--main--components--notaire

      # #2448: no CI runs on the bot release PR (#2001), and CD only checks
      # coherence once the tag exists, too late to fix the tagged tree (0.9.0
      # shipped without images). Fail here while the cut can still be fixed.
      - name: Release branch passes product version coherence for its tag
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          python3 workspace/sdlc/check-product-version-coherence.py --tag "v$VERSION"

      - name: Dispatch CD on release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag_name }}"
          # GITHUB_TOKEN tag pushes do not start on.push.tags (#1599).
          gh workflow run ci.yml --ref "$TAG"
          gh workflow run frontend-ci.yml --ref "$TAG"
          gh workflow run playwright-e2e.yml --ref "$TAG"
          gh workflow run pages-ci.yml --ref "$TAG"
          gh workflow run openapi-contract.yml --ref "$TAG"
          gh workflow run database-vv.yml --ref "$TAG"
          gh workflow run sdlc-process.yml --ref "$TAG"
          gh workflow run test-coverage-report.yml --ref "$TAG"
          gh workflow run codeql.yml --ref "$TAG"
          gh workflow run cd.yml --ref "$TAG"
