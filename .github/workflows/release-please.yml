name: Release Please

# Opens/updates a release PR from Conventional Commits, then creates the v*
# GitHub Release + tag when that PR merges. Does not bypass protect-main:
# the release PR must pass required checks like any other PR (#1040).
# A PR opened with GITHUB_TOKEN triggers no other workflow, so the release PR
# could never get its required checks; the Owner-provisioned RELEASE_PLEASE_TOKEN
# (fine-grained PAT or GitHub App: contents + pull-requests write) is used
# instead, falling back to GITHUB_TOKEN until it exists (#1264).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
