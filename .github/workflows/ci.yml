name: CI - Build, Test & Security

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: -Xmx1024m -XX:MaxMetaspaceSize=512m

jobs:
  # ==========================================
  # JOB 1: Build and Compile
  # ==========================================
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Extract version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with Maven (skip tests)
        run: mvn clean compile -DskipTests -q

      - name: Validate project structure
        run: |
          echo "=== Project Modules ==="
          mvn help:evaluate -Dexpression=project.modules -q -DforceStdout
          echo ""
          echo "=== Build Artifacts ==="
          ls -la backend-api/target/classes 2>/dev/null || echo "Backend classes ready"

  # ==========================================
  # JOB 2: Unit Tests
  # ==========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run Unit Tests (Backend API)
        run: mvn test -pl backend-api -am -Dtest="**/unit/*" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run Unit Tests (Frontend Swing)
        run: mvn test -pl frontend-swing -am -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: |
            backend-api/target/surefire-reports/*.xml
            frontend-swing/target/surefire-reports/*.xml
          retention-days: 30

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Unit Tests
          path: backend-api/target/surefire-reports
          reporter: java-junit
          fail-on-error: false
          only-if: backend-api/target/surefire-reports

      - name: Publish Unit Test Results (Frontend)
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Unit Tests (Frontend)
          path: frontend-swing/target/surefire-reports
          reporter: java-junit
          fail-on-error: false
          only-if: frontend-swing/target/surefire-reports

  # ==========================================
  # JOB 3: Integration Tests
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run Integration Tests
        run: mvn test -pl backend-api -am -Dtest="**/integration/*" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: backend-api/target/surefire-reports/*.xml
          retention-days: 30

      - name: Publish Integration Test Results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Integration Tests
          path: backend-api/target/surefire-reports
          reporter: java-junit
          fail-on-error: false

  # ==========================================
  # JOB 4: Code Coverage (JaCoCo)
  # ==========================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run Tests with Coverage
        run: mvn test -pl backend-api -am -Dmaven.test.failure.ignore=true -Dsurefire.failIfNoSpecifiedTests=false
        continue-on-error: true

      - name: Generate JaCoCo Report
        run: mvn jacoco:report -pl backend-api -q
        continue-on-error: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend-api/target/site/jacoco
          retention-days: 30

      - name: Add Coverage Comment to PR
        uses: madrapps/jacoco-report@v1.7.2
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          title: "📊 Code Coverage Report"
          paths: ${{ github.workspace }}/backend-api/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80

  # ==========================================
  # JOB 5: Security Scan (Trivy)
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Publish Trivy Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy Cache
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

  # ==========================================
  # JOB 6: Build Docker Image
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, coverage]
    if: github.event_name == 'push' && always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ needs.build.outputs.version }}

      - name: Run Trivy on Docker Image
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/backend:latest'
          format: 'sarif'
          output: 'docker-trivy.sarif'

      - name: Upload Docker Trivy Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-trivy-results
          path: docker-trivy.sarif

  # ==========================================
  # JOB 7: Quality Checks (SpotBugs)
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run SpotBugs
        run: mvn spotbugs:check -pl backend-api -am -DskipSpotBugs=false -Dsurefire.failIfNoSpecifiedTests=false -q || true

      - name: Generate SpotBugs Report
        run: mvn spotbugs:xml -pl backend-api -am -DskipSpotBugs=false -Dsurefire.failIfNoSpecifiedTests=false -q || true

      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-report
          path: backend-api/target/spotbugsXml.xml
          retention-days: 7
