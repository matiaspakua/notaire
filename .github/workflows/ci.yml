name: CI - Build, Test & Security

# Full test pipeline: runs on every PR into main and every merge to main, plus
# manual dispatch. Test failures FAIL the pipeline — no failure-ignore flags.
# The only tolerated skip is -Dsurefire.failIfNoSpecifiedTests=false, which
# allows modules (notaire-shared) that have no tests matching a filter; it
# never masks a failing test.
#
# The report/wiki-publishing jobs (generate-reports/publish-reports)
# are guarded to only run on push-to-main or workflow_dispatch — a PR run must
# never publish reports or push commits to main. See each job's `if:`.
#
# GitHub Pages deployment no longer lives here (see issue #778): the single
# source of truth is deploy-github-page.yml, which auto-runs after this
# workflow completes successfully on main.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: -Xmx1024m -XX:MaxMetaspaceSize=512m

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: Build and Compile
  # ==========================================
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Extract version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with Maven (skip tests)
        run: mvn clean compile -DskipTests -q

      - name: Validate project structure
        run: |
          echo "=== Project Modules ==="
          mvn help:evaluate -Dexpression=project.modules -q -DforceStdout
          echo ""
          echo "=== Build Artifacts ==="
          ls -la backend-api/target/classes 2>/dev/null || echo "Backend classes ready"

  # ==========================================
  # JOB 2: Unit Tests (with JaCoCo coverage)
  # ==========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Everything outside the integration/ package is a unit test
      # (includes unit/**, security/**, service/mappers/**).
      - name: Run Unit Tests (Backend API)
        run: >
          mvn test -pl backend-api -am
          -Dtest='!**/integration/**'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Unit Test Report (surefire + JaCoCo coverage)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report
          path: |
            backend-api/target/surefire-reports/
            backend-api/target/site/jacoco/
          retention-days: 30

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Unit Tests
          path: 'backend-api/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

  # ==========================================
  # JOB 3: Integration Tests (H2 + Testcontainers/PostgreSQL, with JaCoCo coverage)
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run Integration Tests (H2)
        run: >
          mvn test -pl backend-api -am
          -Dtest='**/integration/**'
          -Dsurefire.failIfNoSpecifiedTests=false

      # Testcontainers tests validate entities against the Flyway-managed
      # PostgreSQL schema. Docker is available on ubuntu-latest runners.
      - name: Run Integration Tests (Testcontainers / PostgreSQL)
        run: mvn test -pl backend-api -am -Ppg-integration

      - name: Upload Integration Test Report (surefire + JaCoCo coverage)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-report
          path: |
            backend-api/target/surefire-reports/
            backend-api/target/site/jacoco/
          retention-days: 30

      - name: Publish Integration Test Results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Integration Tests
          path: 'backend-api/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

  # ==========================================
  # JOB 4: Combined Coverage & Quality Gate (mvn verify)
  # Runs the full suite once; enforces the JaCoCo ratchet floor
  # (jacoco:check bound to verify) plus checkstyle.
  # ==========================================
  coverage:
    name: Coverage Gate (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run full test suite with coverage gate
        run: >
          mvn verify -pl backend-api -am
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Generate coverage snapshot
        if: always()
        run: python3 scripts/generate-coverage-snapshot.py

      - name: Upload coverage snapshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-snapshot
          path: coverage-snapshot/
          retention-days: 7

      - name: Upload Combined Coverage Report (JaCoCo)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend-api/target/site/jacoco
          retention-days: 30

  # ==========================================
  # JOB 5: Security Scan (Trivy) — report-only
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Pre-warm the local Maven cache so Trivy can resolve POM metadata
      # without hitting Maven Central (avoids 429 rate-limit errors).
      - name: Warm Maven dependency cache
        run: mvn dependency:resolve -pl backend-api -am -q --no-transfer-progress || true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          # Report-only: found vulnerabilities are surfaced but do not block CI.
          exit-code: '0'
          ignore-unfixed: true

      - name: Display Trivy Results
        run: |
          if [ -f trivy-results.json ]; then
            echo "=== Trivy Scan Results ==="
            jq -r '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | "\(.Severity): \(.Title)"' trivy-results.json 2>/dev/null | head -20 || echo "No critical vulnerabilities found"
          fi

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30

  # ==========================================
  # JOB 6: Build Docker Image — only after all tests pass
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, unit-tests, integration-tests, coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend-api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ needs.build.outputs.version }}

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'json'
          output: 'trivy-image-results.json'
          # Report-only for now, tracked alongside the fs scan's blocking-policy decision (#705).
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Image Scan Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image-results
          path: trivy-image-results.json
          retention-days: 30

  # ==========================================
  # JOB 7: Quality Checks (SpotBugs) — report-only
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Fully-qualified plugin coordinates: `com.github.spotbugs` isn't in Maven's
      # default plugin-prefix search list, so the `spotbugs:spotbugs` shorthand
      # fails with "No plugin found for prefix" unless a matching pluginGroup is
      # configured in settings.xml — not guaranteed on a fresh CI runner.
      - name: Generate SpotBugs Report
        run: mvn compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs -pl backend-api -am -DskipSpotBugs=false -q

      - name: Summarize SpotBugs findings
        run: |
          if [ -f backend-api/target/spotbugsXml.xml ]; then
            BUGS=$(grep -c "<BugInstance" backend-api/target/spotbugsXml.xml || true)
            echo "SpotBugs findings: ${BUGS}"
          else
            echo "No SpotBugs report generated"
          fi

      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-report
          path: backend-api/target/spotbugsXml.xml
          retention-days: 7

  # ==========================================
  # JOB 8: Generate Markdown Reports
  # ==========================================
  generate-reports:
    name: Generate Markdown Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, unit-tests, integration-tests, coverage, security, quality, docker-build]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./reports

      - name: Prepare reports directory
        run: |
          mkdir -p ./markdown-reports
          cp reports/unit-test-report/backend-api/target/surefire-reports/*.xml ./markdown-reports/ 2>/dev/null || true
          cp reports/integration-test-report/backend-api/target/surefire-reports/*.xml ./markdown-reports/ 2>/dev/null || true
          cp reports/jacoco-report/jacoco.xml ./markdown-reports/ 2>/dev/null || true
          cp reports/trivy-results/trivy-results.json ./markdown-reports/ 2>/dev/null || true
          cp reports/spotbugs-report/spotbugsXml.xml ./markdown-reports/ 2>/dev/null || true

      - name: Generate Markdown Report
        env:
          GHA_BRANCH: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_BUILD: ${{ needs.build.result }}
          GHA_UNIT: ${{ needs.unit-tests.result }}
          GHA_INTEGRATION: ${{ needs.integration-tests.result }}
          GHA_COVERAGE: ${{ needs.coverage.result }}
          GHA_SECURITY: ${{ needs.security.result }}
          GHA_QUALITY: ${{ needs.quality.result }}
          GHA_DOCKER: ${{ needs.docker-build.result }}
        run: |
          # Aggregate test metrics across all surefire reports
          UNIT_TOTAL=0
          UNIT_FAIL=0
          for f in ./markdown-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            T=$(grep -oP '<testsuite[^>]*\btests="\K[0-9]+' "$f" | head -1 || echo 0)
            F=$(grep -oP '<testsuite[^>]*\bfailures="\K[0-9]+' "$f" | head -1 || echo 0)
            UNIT_TOTAL=$((UNIT_TOTAL + ${T:-0}))
            UNIT_FAIL=$((UNIT_FAIL + ${F:-0}))
          done

          # Extract security metrics
          if [ -f ./markdown-reports/trivy-results.json ]; then
            SEC_CRITICAL=$(jq -r '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' ./markdown-reports/trivy-results.json 2>/dev/null || echo "0")
            SEC_HIGH=$(jq -r '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' ./markdown-reports/trivy-results.json 2>/dev/null || echo "0")
          else
            SEC_CRITICAL="0"
            SEC_HIGH="0"
          fi

          # Extract combined coverage from JaCoCo XML (report-level LINE counter)
          if [ -f ./markdown-reports/jacoco.xml ]; then
            LINE_COV=$(grep -oP '<counter type="LINE" missed="[0-9]+" covered="\K[0-9]+' ./markdown-reports/jacoco.xml | tail -1 || echo "0")
            LINE_MISS=$(grep -oP '<counter type="LINE" missed="\K[0-9]+' ./markdown-reports/jacoco.xml | tail -1 || echo "0")
            TOTAL=$(( ${LINE_COV:-0} + ${LINE_MISS:-0} ))
            if [ "$TOTAL" -gt 0 ]; then
              COV_PCT=$((LINE_COV * 100 / TOTAL))
            else
              COV_PCT="0"
            fi
          else
            COV_PCT="0"
          fi

          export UNIT_TOTAL UNIT_FAIL SEC_CRITICAL SEC_HIGH COV_PCT
          export OUTPUT_FILE="./markdown-reports/ci-report.md"
          export REPORT_EMOJI="yes"
          export REPORT_NAV_ORDER="yes"
          bash scripts/generate-markdown-report.sh

      - name: Upload Markdown Reports
        uses: actions/upload-artifact@v7
        with:
          name: markdown-reports
          path: ./markdown-reports
          retention-days: 30

  # ==========================================
  # JOB 9: Publish Reports to docs/wiki/
  # ==========================================
  publish-reports:
    name: Publish to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [generate-reports]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./reports

      - name: Prepare reports for wiki
        run: |
          mkdir -p docs/wiki/cicd-reports
          cp reports/markdown-reports/ci-report.md docs/wiki/cicd-reports/ 2>/dev/null || true
          ls -la docs/wiki/cicd-reports/ 2>/dev/null || echo "No reports yet"

      - name: Commit and Push Reports
        run: |
          git config --local user.email "ci@notaire.com"
          git config --local user.name "CI Bot"
          git add docs/wiki/cicd-reports/ 2>/dev/null || echo "No reports to add"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: add CI report for $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

