name: Backend API CI

on:
  push:
    branches:
      - '**'
  pull_request:
    paths:
      - 'backend-api/**'
      - 'notaire-shared/**'
      - 'pom.xml'
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build backend-api with dependencies
        run: mvn clean install -pl backend-api -am -DskipTests

      - name: Run backend-api unit tests only
        run: mvn test -pl backend-api -Dtest="**/unit/*"

      - name: Check JaCoCo coverage
        run: mvn jacoco:check -pl backend-api

  auto-merge:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'matiaspakua'
    steps:
      - name: Approve PR
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --admin --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}