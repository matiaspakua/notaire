name: CD - Build & Publish Docker

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish'
        required: false
        type: string

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ==========================================
  # Build and Publish Docker Image
  # ==========================================
  build-and-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Generate SBOM (JSON)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'sbom.json'

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 365

      - name: Image Digest
        run: |
          echo "Image digest: ${{ steps.meta.outputs.tags }}"

  # ==========================================
  # Create GitHub Release
  # ==========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Update Docker Hub Description
  # ==========================================
  update-description:
    name: Update Container Registry Description
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Container Registry Description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ghcr.io/${{ github.repository }}/backend
          short-description: "Notaire Backend API - Spring Boot REST API"

  # ==========================================
  # Generate CD Report
  # ==========================================
  generate-report:
    name: Generate CD Report
    runs-on: ubuntu-latest
    needs: [build-and-publish, release, update-description]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate Markdown Report
        run: |
          mkdir -p reports
          cat > reports/cd-report.md << 'EOFMARKDOWN'
---
title: CD Report
nav_order: 1
---

# 🚀 CD Pipeline Report

**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S")
**Branch:** ${{ github.ref_name }}
**Commit:** ${{ github.sha }}

---

## 📋 Job Results

| Job | Status |
|-----|--------|
| Build & Publish | ${{ needs.build-and-publish.result }} |
| Create Release | ${{ needs.release.result }} |
| Update Description | ${{ needs.update-description.result }} |

---

## 🐳 Docker Image

| Property | Value |
|----------|-------|
| Registry | ghcr.io |
| Repository | ${{ github.repository }}/backend |
| Tag | ${{ github.ref_name }} |

---

## ✅ Conclusion

EOFMARKDOWN
          
          # Add conclusion based on results
          if [ "${{ needs.build-and-publish.result }}" == "success" ]; then
            echo "**Pipeline:** ✅ SUCCESS - Image built and published successfully" >> reports/cd-report.md
          else
            echo "**Pipeline:** ❌ FAILED - Check the logs for details" >> reports/cd-report.md
          fi
          
          cat >> reports/cd-report.md << 'EOFMARKDOWN'

---

*Report generated by CI/CD Pipeline*
EOFMARKDOWN
          
          echo "CD report generated"

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: cd-report
          path: reports/cd-report.md
          retention-days: 30

  # ==========================================
  # Publish to GitHub Pages
  # ==========================================
  publish-report:
    name: Publish Report
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
          fetch-depth: 0

      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: cd-report
          path: .

      - name: Prepare reports
        run: |
          mkdir -p _posts/cicd
          # Copy report with date-based name
          cp cd-report.md ./_posts/cicd/$(date +%Y-%m-%d)-cd-report.md

      - name: Commit and Push
        run: |
          git config --local user.email "ci@notaire.com"
          git config --local user.name "CI Bot"
          git add -A
          git commit -m "Update CD report - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin gh-pages || git push origin gh-pages --force
