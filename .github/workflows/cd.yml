name: CD - Build & Publish Docker

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish'
        required: false
        type: string

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ==========================================
  # Build and Publish Docker Image
  # ==========================================
  build-and-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Generate SBOM (JSON)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'sbom.json'

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 365

      - name: Image Digest
        run: |
          echo "Image digest: ${{ steps.meta.outputs.tags }}"

  # ==========================================
  # Create GitHub Release
  # ==========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Update Docker Hub Description
  # ==========================================
  update-description:
    name: Update Container Registry Description
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Container Registry Description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ghcr.io/${{ github.repository }}/backend
          short-description: "Notaire Backend API - Spring Boot REST API"

  # ==========================================
  # Generate CD Report
  # ==========================================
  generate-report:
    name: Generate CD Report
    runs-on: ubuntu-latest
    needs: [build-and-publish, release, update-description]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Generate Markdown Report
        env:
          OUTPUT_FILE: reports/cd-report.md
          GHA_BUILD_PUBLISH: ${{ needs.build-and-publish.result }}
          GHA_RELEASE: ${{ needs.release.result }}
          GHA_UPDATE_DESC: ${{ needs.update-description.result }}
          GHA_BRANCH: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_REPO: ${{ github.repository }}
          REPORT_EMOJI: yes
        run: |
          mkdir -p reports
          bash scripts/generate-cd-report.sh

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: cd-report
          path: reports/cd-report.md
          retention-days: 30

  # ==========================================
  # Publish Reports to docs/wiki/
  # ==========================================
  publish-report:
    name: Publish to Wiki
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Report
        uses: actions/download-artifact@v8
        with:
          name: cd-report
          path: ./reports

      - name: Generate CD Report for Wiki
        env:
          OUTPUT_FILE: docs/wiki/cicd-reports/cd-report.md
          GHA_BUILD_PUBLISH: ${{ needs.build-and-publish.result }}
          GHA_RELEASE: ${{ needs.release.result }}
          GHA_UPDATE_DESC: ${{ needs.update-description.result }}
          GHA_BRANCH: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_REPO: ${{ github.repository }}
          WIKI_MODE: yes
        run: |
          mkdir -p docs/wiki/cicd-reports
          bash scripts/generate-cd-report.sh

      - name: Commit and Push Reports
        run: |
          git config --local user.email "ci@notaire.com"
          git config --local user.name "CI Bot"
          
          git add docs/wiki/cicd-reports/ 2>/dev/null || echo "No reports to add"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: add CD report for $(date +%Y-%m-%d)" || echo "No changes to commit"
            git push origin ${{ github.ref_name }} || git push origin ${{ github.ref_name }} --force
          fi
