name: CD - Build & Publish Docker

# Publishes backend and frontend Docker images only AFTER the CI test pipeline
# has succeeded on main (workflow_run gate). Tag pushes and manual dispatch
# also publish.
on:
  workflow_run:
    workflows: ["CI - Build, Test & Security"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
      # Releases through 0.1.2 used notaire-v* and never matched v*, so SBOM
      # assets were not attached. Keep the legacy filter (#1571).
      - 'notaire-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish'
        required: false
        type: string

env:
  JAVA_VERSION: '26'
  REGISTRY: ghcr.io

jobs:
  release-identity:
    name: Release identity coherence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Product version coherence
        run: |
          set -euo pipefail
          args=(python3 workspace/sdlc/check-product-version-coherence.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          "${args[@]}"

  # ==========================================
  # Build and Publish Docker Images (matrix)
  # ==========================================
  build-and-publish:
    name: Build & Publish (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-identity
    # On workflow_run, only publish when CI (all tests) succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless (OIDC) signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: ./backend-api/Dockerfile
            sbom_artifact: sbom-backend
            scan_artifact: published-image-scan-backend
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            sbom_artifact: sbom-frontend
            scan_artifact: published-image-scan-frontend
    steps:
      # Pin checkout to the CI-tested commit on workflow_run. Under that event,
      # github.sha is tip-of-default-branch at CD schedule time — not the SHA CI
      # tested. Tag / workflow_dispatch fall back to github.sha (#1042).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicit publish SHA: do not trust metadata type=sha / github.sha under
      # workflow_run (those track tip-of-default-branch).
      - name: Resolve publish SHA
        id: publish_sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Immutable tags only (full + short publish SHA). Omit latest here — it
      # moves in a later step after this push succeeds.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.publish_sha.outputs.sha }}
            type=raw,value=${{ steps.publish_sha.outputs.sha_short }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
          build-args: |
            VERSION=${{ github.ref_name }}

      # Move mutable latest only after the SHA-tagged push succeeded (same digest).
      - name: Tag and push latest
        if: >
          github.event_name == 'workflow_run'
          || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:latest" \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}"

      # Real SBOM: CycloneDX document listing every package in the image.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.sbom_artifact }}
          path: sbom.cdx.json
          retention-days: 365

      # Vulnerability scan of the published image — separate concern from the
      # SBOM above. Report-only for now, tracked alongside the fs/image scan
      # blocking-policy decision in #705.
      - name: Scan Published Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: 'json'
          output: 'published-image-scan.json'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Published Image Scan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scan_artifact }}
          path: published-image-scan.json
          retention-days: 30

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (keyless/OIDC)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}"

      - name: Image Digest
        run: |
          echo "Component: ${{ matrix.component }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # ==========================================
  # Attach SBOMs to GitHub Release (release-please owns Release creation)
  # ==========================================
  release:
    name: Attach SBOM assets to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/notaire-v')
    concurrency:
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: ./sboms
          merge-multiple: false

      - name: Prepare SBOM assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp sboms/sbom-backend/sbom.cdx.json release-assets/sbom-backend.cdx.json
          cp sboms/sbom-frontend/sbom.cdx.json release-assets/sbom-frontend.cdx.json
          python3 workspace/release/product_release.py --write-sbom release-assets
          cp release/product-release.json release-assets/product-release.json
          python3 <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "product_release", "workspace/release/product_release.py"
          )
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          missing = [
              name
              for name in mod.RELEASE_ASSETS
              if not (Path("release-assets") / name).is_file()
          ]
          if missing:
              print("missing release assets:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          PY
          ls -la release-assets

      - name: Attach SBOMs to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-assets/sbom-backend.cdx.json
            release-assets/sbom-frontend.cdx.json
            release-assets/sbom-database.cdx.json
            release-assets/sbom-notaire.cdx.json
            release-assets/product-release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export TAG="${GITHUB_REF_NAME}"
          python3 <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys

          spec = importlib.util.spec_from_file_location(
              "product_release", "workspace/release/product_release.py"
          )
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          tag = os.environ["TAG"]
          payload = subprocess.run(
              ["gh", "release", "view", tag, "--json", "assets"],
              check=True,
              capture_output=True,
              text=True,
          )
          names = sorted(item["name"] for item in json.loads(payload.stdout)["assets"])
          expected = sorted(mod.RELEASE_ASSETS)
          if names != expected:
              print(f"release assets {names} != expected {expected}", file=sys.stderr)
              sys.exit(1)
          PY

  # ==========================================
  # Update Docker Hub Description
  # ==========================================
  update-description:
    name: Update Container Registry Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Container Registry Description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ghcr.io/${{ github.repository }}/backend
          short-description: "Notaire Backend API - Spring Boot REST API"

  # ==========================================
  # Generate CD Report
  # ==========================================
  generate-report:
    name: Generate CD Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-publish, release, update-description]
    if: always() && needs.build-and-publish.result != 'skipped'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Generate Markdown Report
        env:
          OUTPUT_FILE: reports/cd-report.md
          GHA_BUILD_PUBLISH: ${{ needs.build-and-publish.result }}
          GHA_RELEASE: ${{ needs.release.result }}
          GHA_UPDATE_DESC: ${{ needs.update-description.result }}
          GHA_BRANCH: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_REPO: ${{ github.repository }}
          REPORT_EMOJI: yes
        run: |
          mkdir -p reports
          bash workspace/ci/generate-cd-report.sh

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: cd-report
          path: reports/cd-report.md
          retention-days: 30

  # ==========================================
  # Publish CD report (artifact + summary; no git commits — #1041)
  # ==========================================
  publish-report:
    name: Publish report artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-publish, release, update-description, generate-report]
    if: >
      always()
      && needs.generate-report.result == 'success'
      && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Download Report
        uses: actions/download-artifact@v8
        with:
          name: cd-report
          path: ./reports

      - name: Publish CD report to job summary
        run: |
          REPORT="reports/cd-report.md"
          if [ -f "$REPORT" ]; then
            {
              echo "## CD report"
              echo ""
              cat "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No CD report artifact found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CD report artifact
        uses: actions/upload-artifact@v7
        with:
          name: cd-report-publish
          path: reports/cd-report.md
          retention-days: 30
          if-no-files-found: ignore
