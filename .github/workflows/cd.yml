name: CD - Build & Publish Docker

# Publishes the backend Docker image only AFTER the CI test pipeline has
# succeeded on main (workflow_run gate). Tag pushes and manual dispatch
# also publish.
on:
  workflow_run:
    workflows: ["CI - Build, Test & Security"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish'
        required: false
        type: string

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ==========================================
  # Build and Publish Docker Image
  # ==========================================
  build-and-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On workflow_run, only publish when CI (all tests) succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless (OIDC) signing
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ github.ref_name }}

      # Real SBOM: CycloneDX document listing every package in the image.
      # (Previously this step ran a default Trivy vulnerability scan and
      # mislabeled it "Generate SBOM" — no CycloneDX/SPDX doc was produced.)
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 365

      # Vulnerability scan of the published image — separate concern from the
      # SBOM above. Report-only for now, tracked alongside the fs/image scan
      # blocking-policy decision in #705.
      - name: Scan Published Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'json'
          output: 'published-image-scan.json'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Published Image Scan
        uses: actions/upload-artifact@v7
        with:
          name: published-image-scan
          path: published-image-scan.json
          retention-days: 30

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (keyless/OIDC)
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Image Digest
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # ==========================================
  # Create GitHub Release
  # ==========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Update Docker Hub Description
  # ==========================================
  update-description:
    name: Update Container Registry Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Container Registry Description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ghcr.io/${{ github.repository }}/backend
          short-description: "Notaire Backend API - Spring Boot REST API"

  # ==========================================
  # Generate CD Report
  # ==========================================
  generate-report:
    name: Generate CD Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-publish, release, update-description]
    if: always() && needs.build-and-publish.result != 'skipped'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Generate Markdown Report
        env:
          OUTPUT_FILE: reports/cd-report.md
          GHA_BUILD_PUBLISH: ${{ needs.build-and-publish.result }}
          GHA_RELEASE: ${{ needs.release.result }}
          GHA_UPDATE_DESC: ${{ needs.update-description.result }}
          GHA_BRANCH: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_REPO: ${{ github.repository }}
          REPORT_EMOJI: yes
        run: |
          mkdir -p reports
          bash scripts/generate-cd-report.sh

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: cd-report
          path: reports/cd-report.md
          retention-days: 30

  # ==========================================
  # Publish Reports to docs/wiki/
  # ==========================================
  publish-report:
    name: Publish to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-publish, release, update-description, generate-report]
    if: >
      always()
      && needs.generate-report.result == 'success'
      && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download Report
        uses: actions/download-artifact@v8
        with:
          name: cd-report
          path: ./reports

      - name: Generate CD Report for Wiki
        env:
          OUTPUT_FILE: docs/wiki/cicd-reports/cd-report.md
          GHA_BUILD_PUBLISH: ${{ needs.build-and-publish.result }}
          GHA_RELEASE: ${{ needs.release.result }}
          GHA_UPDATE_DESC: ${{ needs.update-description.result }}
          GHA_BRANCH: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_REPO: ${{ github.repository }}
          WIKI_MODE: yes
        run: |
          mkdir -p docs/wiki/cicd-reports
          bash scripts/generate-cd-report.sh

      - name: Commit and Push Reports
        run: |
          git config --local user.email "ci@notaire.com"
          git config --local user.name "CI Bot"
          git add docs/wiki/cicd-reports/ 2>/dev/null || echo "No reports to add"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: add CD report for $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi
