name: Frontend CI — Build, Typecheck & Test

# Frontend static checks, unit tests (with coverage) and production build.
# Runs on every PR into main and every merge to main, plus manual dispatch.
# Failures FAIL the pipeline. UI E2E tests live in playwright-e2e.yml.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

defaults:
  run:
    working-directory: frontend

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Static checks (TypeScript)
  # ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      # Blocking gate (#1048 / CU76). #701 (FlatCompat circular JSON) is closed.
      - name: ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # JOB 2: Unit tests (Vitest) with coverage
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests with coverage
        run: >
          npx vitest run --coverage
          --reporter=default --reporter=junit
          --outputFile=test-results/junit.xml

      - name: Upload unit test report (JUnit + coverage)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-unit-test-report
          path: |
            frontend/test-results/
            frontend/coverage/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Frontend Unit Tests
          path: frontend/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 3: Build
  # ──────────────────────────────────────────────
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: |
            frontend/.next/
          retention-days: 7
          include-hidden-files: true

  # Suite aggregator for ruleset required check (#1040)
  # Exact check-run name must be "Frontend CI".
  # Override workflow defaults: this job has no checkout, so `frontend/` does not exist.
  suite-frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, unit-tests, build]
    if: ${{ always() && !cancelled() }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require Frontend CI suite jobs success
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "typecheck=${{ needs.typecheck.result }}" \
            "unit-tests=${{ needs.unit-tests.result }}" \
            "build=${{ needs.build.result }}"
          do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}=${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
