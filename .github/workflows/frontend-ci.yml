name: Frontend CI — Build, Lint & Test

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**', 'feat/**' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Install and lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint
        run: npx next lint --dir src
        continue-on-error: true

  # ──────────────────────────────────────────────
  # JOB 2: Unit tests
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile=test-results/junit.xml
        continue-on-error: true

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Frontend Unit Tests
          path: frontend/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 3: Build
  # ──────────────────────────────────────────────
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next/
          retention-days: 7

  # ──────────────────────────────────────────────
  # JOB 4: E2E tests (only on main or PRs)
  # Requires running backend — skipped in CI without services
  # ──────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright) — Smoke
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true  # E2E requires a running backend — expected to skip in CI without services
    # Only run E2E when explicitly triggered or on PRs to main
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
        continue-on-error: true

      - name: Start frontend
        run: npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        continue-on-error: true

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000
        continue-on-error: true

      - name: Run Playwright E2E smoke tests
        run: npx playwright test tests/e2e/login.spec.ts --reporter=junit --output=playwright-results
        continue-on-error: true

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            frontend/playwright-results/
            frontend/playwright-report/
          retention-days: 30
