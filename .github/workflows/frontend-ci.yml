name: Frontend CI — Build, Typecheck & Test

# Frontend static checks, unit tests (with coverage) and production build.
# Runs on every PR into main and every merge to main, plus manual dispatch.
# Failures FAIL the pipeline. UI E2E tests live in playwright-e2e.yml.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

defaults:
  run:
    working-directory: frontend

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Static checks (TypeScript)
  # ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      # Report-only until #701 (eslint-config-next's FlatCompat path crashes with
      # "Converting circular structure to JSON") is fixed — do not add
      # continue-on-error: false here until that's resolved.
      - name: ESLint
        run: npm run lint
        continue-on-error: true

  # ──────────────────────────────────────────────
  # JOB 2: Unit tests (Vitest) with coverage
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests with coverage
        run: >
          npx vitest run --coverage
          --reporter=default --reporter=junit
          --outputFile=test-results/junit.xml

      - name: Upload unit test report (JUnit + coverage)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-unit-test-report
          path: |
            frontend/test-results/
            frontend/coverage/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Frontend Unit Tests
          path: frontend/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────
  # JOB 3: Build
  # ──────────────────────────────────────────────
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: |
            frontend/.next/
          retention-days: 7
          include-hidden-files: true
