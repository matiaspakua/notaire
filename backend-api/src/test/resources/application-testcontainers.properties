# Test configuration for Testcontainers with Flyway
# Uses PostgreSQL container with Flyway migrations

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/notaire_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# JPA Configuration (validate only, let Flyway handle schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration (enabled for tests)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.repair-at-start=true

# Logging
logging.level.org.flywaydb=DEBUG
logging.level.com.licensis.notaire=DEBUG
