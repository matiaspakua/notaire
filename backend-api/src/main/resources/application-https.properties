# HTTPS / TLS profile (#254). Activate with SPRING_PROFILES_ACTIVE=https (or +https).
# Generate a local keystore: bash backend-api/scripts/generate-local-tls-keystore.sh
# Production termination: docs/200-architecture/206-security/HTTPS-TLS-RUNBOOK.md

server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SSL_KEY_STORE:file:./backend-api/target/local-dev-keystore.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-alias=${SSL_KEY_ALIAS:notaire-local}

# HttpOnly cookie must be Secure when the browser talks HTTPS (#1051).
auth.cookie.secure=true
