# Spring Configuration
spring.application.name=notaire-backend
server.port=8080
spring.main.web-application-type=servlet
spring.jmx.enabled=false

# Jackson Configuration for JPA lazy loading
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=always
spring.jackson.serialization-inclusion=always
# Include all properties for DtoUsuario (valido field)
spring.jackson.mapper.default-view-inclusion=true

# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false

# Database Configuration (from persistence.xml and config.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notaire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.connect-retries=3
spring.flyway.repair-at-start=true

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.licensis.notaire=DEBUG
