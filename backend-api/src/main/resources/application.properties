# Spring Configuration
spring.application.name=notaire-backend
server.port=8080
spring.main.web-application-type=servlet
spring.jmx.enabled=false

# Jackson Configuration for JPA lazy loading
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=always
spring.jackson.serialization-inclusion=always
# Include all properties for DtoUsuario (valido field)
spring.jackson.mapper.default-view-inclusion=true

# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false

# Database Configuration (from persistence.xml and config.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notaire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.connect-retries=3
spring.flyway.repair-at-start=true

# ===== OBSERVABILITY CONFIGURATION =====

# Actuator Configuration - Extended endpoints for observability
management.endpoints.web.exposure.include=health,metrics,prometheus,info,threaddump,heapdump
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# Metrics Configuration - Prometheus metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${ENVIRONMENT:development}

# Spring Cloud Sleuth Configuration - Distributed Tracing
spring.sleuth.tracing.mode=bridge
spring.sleuth.propagation.type=w3c
spring.sleuth.sampler.probability=1.0

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.licensis.notaire=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/notaire-backend.log
logging.file.max-size=100MB
logging.file.max-history=30

# ===== SECURITY CONFIGURATION =====

# Password Encryption Configuration
security.password.algorithm=bcrypt
security.password.bcrypt-strength=12

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===== APPLICATION CONFIGURATION =====

# Environment-specific configuration
app.environment=${ENVIRONMENT:development}
app.version=${project.version:1.0-SNAPSHOT}

