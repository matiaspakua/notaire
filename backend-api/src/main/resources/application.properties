# Spring Configuration
spring.application.name=notaire-backend
server.port=8080
spring.main.web-application-type=servlet
spring.jmx.enabled=false

# Jackson Configuration for JPA lazy loading
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=always
spring.jackson.serialization-inclusion=always
# Include all properties for DtoUsuario (valido field)
spring.jackson.mapper.default-view-inclusion=true

# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false

# Database Configuration (from persistence.xml and config.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notaire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=NotaireHikariCP

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
# Flyway is the single source of truth for the database schema. In the Docker
# stack, PostgreSQL starts empty and Flyway applies V1→V11+ sequentially.
# Entity↔schema drift is guarded by FlywaySchemaValidationIntegrationTest.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.connect-retries=3

# ===== OBSERVABILITY & MONITORING CONFIGURATION =====

# Actuator Configuration - Expose endpoints for Prometheus.
# heapdump/env/beans excluded: they leak DB credentials, the JWT secret and
# other in-memory secrets to anyone with the actuator credentials (issue #557).
management.endpoints.web.exposure.include=health,metrics,prometheus,info,threaddump,loggers,mappings,scheduledtasks

# Actuator Basic Auth credentials — no hardcoded/default value, must be
# supplied via ACTUATOR_USER/ACTUATOR_PASSWORD (see .env.example); startup
# fails if they are unset (issue #557).
actuator.security.username=${ACTUATOR_USER}
actuator.security.password=${ACTUATOR_PASSWORD}
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.ping.enabled=true

# Actuator HTTP Tracing
management.httpexchanges.recording.enabled=true

# Metrics Configuration - Prometheus metrics export
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.enable.uptime=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${ENVIRONMENT:development}

# Micrometer Tracing Configuration (Successor to Sleuth in Spring Boot 4+)
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# Spring Security for Actuator endpoints
# Prometheus will use admin/admin for scraping
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ACTUATOR,ADMIN

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
# Default to INFO for production; override locally with LOG_LEVEL_APP=DEBUG etc.
# (DEBUG defaults flooded logs — Spring Security logs every request at DEBUG.)
logging.level.com.licensis.notaire=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/notaire-backend.log
logging.file.max-size=100MB
logging.file.max-history=30

# ===== SECURITY CONFIGURATION =====

# Password Encryption Configuration
security.password.algorithm=bcrypt
security.password.bcrypt-strength=12

# Login rate limiting / account lockout (issue #560)
# Locks a username out for lockout-duration-ms after max-attempts consecutive failed logins.
security.login.max-attempts=${SECURITY_LOGIN_MAX_ATTEMPTS:5}
security.login.lockout-duration-ms=${SECURITY_LOGIN_LOCKOUT_DURATION_MS:900000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:3001,http://localhost:9090}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===== APPLICATION CONFIGURATION =====

# Environment-specific configuration
app.environment=${ENVIRONMENT:development}
app.version=${project.version:1.0-SNAPSHOT}

# Seeded admin user (issue #651) — override in production via env vars
app.admin.username=${APP_ADMIN_USER:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# pgAdmin / Grafana credentials — the backend doesn't use these at runtime,
# they're only wired in so ProductionCredentialsGuard can also catch insecure
# defaults on those services, not just its own (issue #672).
pgadmin.admin.password=${PGADMIN_DEFAULT_PASSWORD:admin}
grafana.admin.username=${GRAFANA_ADMIN_USER:admin}
grafana.admin.password=${GRAFANA_ADMIN_PASSWORD:admin}

# PostgreSQL metrics-exporter role (issue #675) — least-privilege pg_monitor
# grant, created by Flyway migration V12, replacing the previous setup where
# postgres-exporter reused the application's own admin datasource
# credentials. Not used by the backend itself at runtime, wired in so
# ProductionCredentialsGuard can catch an insecure default and so Flyway can
# provision the role with the same value docker-compose gives the exporter.
postgres.exporter.username=${POSTGRES_EXPORTER_USER:notaire_exporter}
postgres.exporter.password=${POSTGRES_EXPORTER_PASSWORD:admin}
spring.flyway.placeholders.exporterUsername=${postgres.exporter.username}
spring.flyway.placeholders.exporterPassword=${postgres.exporter.password}
