          $ref: '#/components/schemas/PersonRef'
        personId:
          format: int32
          type: integer
        propertyAmount:
          type: number
        status:
          description: Budget status (#1346). Accepts any uppercase/lowercase and guarda the código; another valor responde
            400.
          enum:
          - BORRADOR
          - PENDIENTE
          - APROBADO
