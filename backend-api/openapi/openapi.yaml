components:
  responses:
    '400':
      content:
        application/json:
          schema:
            properties:
              error: {}
              message: {}
              path: {}
              timestamp:
                format: date-time
      description: Invalid request — parámetros or cuerpo malformado
    '404':
      content:
        application/json:
          schema:
            properties:
              error: {}
              message: {}
              path: {}
              timestamp:
                format: date-time
      description: Resource not found
    '409':
      content:
        application/json:
          schema:
            properties:
              error: {}
              message: {}
              path: {}
              timestamp:
                format: date-time
      description: Conflicto — the recurso already exists or viola a restricción
    '500':
      content:
        application/json:
          schema:
            properties:
              error: {}
              message: {}
              path: {}
              timestamp:
                format: date-time
      description: Error interno of the server
