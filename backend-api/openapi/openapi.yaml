openapi: 3.1.0
info:
  title: Notaire API
  description: "Sistema de gestión notarial — API REST backend. Todos los recursos\
    \ siguen el prefijo `/api/v1/`. Las respuestas de error siguen el esquema `{error,\
    \ message, timestamp, path}`."
  contact:
    name: Licensis
    url: https://www.licensis.com
    email: info@licensis.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Desarrollo local
- url: http://localhost:8081
  description: Docker local
tags:
- name: Workflow Definition
  description: CU70 - Gestión de workflows de estados
- name: TipoDeDocumento
  description: API para gestionar tipo-de-documento
- name: DocumentoPresentado
  description: API para gestionar documentos presentados
- name: Pago
  description: "API para gestionar pagos (CU15, CU47)"
- name: Gestiones
  description: API para gestionar gestiones de escritura
- name: Roles
  description: API para gestionar roles y permisos de usuario
- name: Folio
  description: API para gestionar folio
- name: MovimientoTestimonio
  description: API para gestionar movimiento-testimonio
- name: Conceptos
  description: API para gestionar conceptos
- name: Historial
  description: API para gestionar historial de gestiones
- name: PlantillaTramite
  description: API para plantillas de tramite (documentos por tipo de tramite)
- name: Workflow Validation
  description: CU72 - Validación de consistencia del workflow
- name: Presupuestos
  description: API para gestionar presupuestos
- name: Testimonio
  description: API para gestionar testimonio
- name: RegistroAuditoria
  description: API para consultar auditoria de usuarios (solo lectura; mutaciones
    denegadas)
- name: Reportes
  description: API para generación de reportes PDF
- name: People
  description: API to manage people
- name: Tipo de Folio
  description: API para tipos de folio
- name: TipoIdentificacion
  description: API para gestionar tipos de identificacion
- name: Copia
  description: API para gestionar copias
- name: Carpetas de Trámite
  description: API para administrar carpetas de trámite
- name: Minutas de Inscripción
  description: API para generar y hacer seguimiento de la minuta de inscripción
- name: Usuarios
  description: API para gestionar usuarios
- name: Workflow Transition
  description: CU71 - Transiciones entre estados de un workflow
- name: Estado de Gestion
  description: API para estados de gestion
- name: Protocolo Auxiliar
  description: API para gestionar trámites en Protocolo Auxiliar
- name: Escrituras
  description: API para gestionar escrituras
- name: Workflow Node
  description: CU70/CU71 - Nodos de workflows de estados
- name: Items
  description: API para gestionar ítems de presupuesto
- name: PlantillaCostosDocumento
  description: API para administrar costos esperados de documentos por tipo de trámite
- name: Inmueble
  description: API para gestionar inmueble
- name: Suplencia
  description: API para gestionar suplencia
- name: Trámites
  description: API para gestionar trámites
- name: PlantillaPresupuesto
  description: API para gestionar plantillas de presupuesto
- name: Tipo de Tramite
  description: API para tipos de tramite
- name: Cuadernos
  description: API para administrar cuadernos de folios
