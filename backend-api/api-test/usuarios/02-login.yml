info:
  name: Login (created usuario)
  type: http
  seq: 2
  description: "## Autenticación — POST /api/v1/usuarios/login"
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios/login"
  body:
    type: json
    data: |-
        { "nombre": "apitest-usuario", "contrasenia": "Test1234!" }
  headers:
    Content-Type: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Login is valido for correct credentials", function () {
            expect(res.getBody().valido).to.equal(true);
          });
