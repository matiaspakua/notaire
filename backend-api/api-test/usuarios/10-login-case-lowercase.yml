info:
  name: Login with lowercase username (case-insensitive)
  type: http
  seq: 10
  description: "## AUTH-001 Gap B-04 — username lookup must be case-insensitive"
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios/login"
  body:
    type: json
    data: |-
        { "nombre": "casetest-usuario", "contrasenia": "Test1234!" }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Lowercase username logs in successfully", function () {
            expect(res.getBody().valido).to.equal(true);
          });
