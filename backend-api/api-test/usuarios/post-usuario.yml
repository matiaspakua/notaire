info:
  name: Create Usuario
  type: http
  description: |-
      ## Create Usuario
      Crea un nuevo usuario en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/usuarios

http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios"
  body:
    type: json
    data: |-
        nombre: "nuevousuario"
        contrasenia: "password123"
        estado: true
        tipo: "gestor"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

