info:
  name: Update Usuario
  type: http
  description: |-
      ## Update Usuario
      Actualiza un usuario existente en el sistema.
      
      **Method:** PUT
      **Path:** /api/v1/usuarios/{id}

http:
  method: PUT
  url: "{{base_url}}/api/v1/usuarios/{{user_id}}"
  body:
    type: json
    data: |-
        nombre: "usuarioactualizado"
        contrasenia: "newpassword123"
        estado: true
        tipo: "admin"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

