info:
  name: Create Tipo de Tramite
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-tramite"
  body:
    type: json
    data: |-
        {"name":"TT E2E","notes":"tramite e2e","isArchived":false,"isRegistered":false}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idProcedureType", function () {
            const b = res.getBody();
            expect(b).to.have.property('idProcedureType');
            bru.setVar('_id', b.idProcedureType);
          });
