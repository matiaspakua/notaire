info:
  name: List Tipo de Tramite
  type: http
  seq: 2
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-tramite"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Response is an array", function () { expect(res.getBody()).to.be.an('array'); });
          test("Created item is in the list", function () {
            const id = Number(bru.getVar('_id'));
            expect(res.getBody().some(x => x.idTipoDeTramite === id)).to.equal(true);
          });
