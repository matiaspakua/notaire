info:
  name: Verify Tipo de Tramite Update
  type: http
  seq: 5
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-tramite/{{_id}}"
  headers:
    Content-Type: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted (nombre)", function () {
            expect(String(res.getBody().nombre)).to.equal('TT E2E Actualizado');
          });
