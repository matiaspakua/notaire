info:
  name: List audit records
  type: http
  seq: 1
  description: |-
      ## List audit records — GET /api/v1/audit-log?page=&size=
      Uses the paged form of the endpoint. The unpaged legacy flat list can grow to
      multi-megabyte JSON after a full Playwright run; Bruno's QuickJS runtime aborts
      when the test script materialises that body (blocks `preflight.sh --full`).
      Traceability: CU73, CU23 (RF #43, #46)

http:
  method: GET
  url: "{{base_url}}/api/v1/audit-log?page=0&size=5"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("Paged body with content array", function () {
            const body = res.getBody();
            expect(body).to.have.property('content').that.is.an('array');
            expect(body).to.have.property('totalElements');
          });

          test("Each entry has expected audit fields", function () {
            const body = res.getBody();
            if (body.content.length > 0) {
              const entry = body.content[0];
              expect(entry).to.have.property('idAuditRecord');
              expect(entry).to.have.property('operationDetail');
              expect(entry).to.have.property('module');
            }
          });
