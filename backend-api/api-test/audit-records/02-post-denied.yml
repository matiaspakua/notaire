info:
  name: Reject POST audit-log
  type: http
  seq: 2
  description: |-
      ## Deny forge — POST /api/v1/audit-log
      Audit rows are written only by AuditAspect. Authenticated clients must
      receive 405 Method Not Allowed (issue #1060 AC).
      Traceability: CU73, CU78, #1060

http:
  method: POST
  url: "{{base_url}}/api/v1/audit-log"
  body:
    type: json
    data: |-
        {
          "module": "Forged",
          "operationDetail": "bruno must not create audit rows",
          "version": 1
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 405 Method Not Allowed", function () {
            expect(res.getStatus()).to.equal(405);
          });
