info:
  name: Audit filter rejects a bad date
  type: http
  seq: 6
  description: |-
      ## GET /api/v1/audit-log with a malformed or inverted range → 400 (issue #1545). CU23

http:
  method: GET
  url: "{{base_url}}/api/v1/audit-log?page=0&size=5&from=2031-05-15&to=2031-05-14"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400 (from after to)", function () {
            expect(res.getStatus()).to.equal(400);
          });
