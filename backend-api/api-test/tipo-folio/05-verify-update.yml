info:
  name: Verify Tipo de Folio Update
  type: http
  seq: 5
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-folio/{{_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted (nombre)", function () {
            expect(String(res.getBody().nombre)).to.equal('TF E2E Actualizado');
          });
