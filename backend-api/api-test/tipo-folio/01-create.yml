info:
  name: Create Tipo de Folio
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-folio"
  body:
    type: json
    data: |-
        {"name":"TF E2E","notes":"folio e2e"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idFolioType", function () {
            const b = res.getBody();
            expect(b).to.have.property('idFolioType');
            bru.setVar('_id', b.idFolioType);
          });
