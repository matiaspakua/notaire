info:
  name: Search deeds by number
  type: http
  seq: 1
  description: |-
      ## Search deeds by number — GET /api/v1/escrituras/buscar?number=<n>
      Traceability: CU62 (RF #27, #28, #30)
http:
  method: GET
  url: "{{base_url}}/api/v1/escrituras/buscar"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
  params:
    - name: number
      value: "1"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns array", function () { expect(res.getBody()).to.be.an('array'); });
