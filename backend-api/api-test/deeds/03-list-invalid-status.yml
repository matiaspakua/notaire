info:
  name: List deeds with an unknown status
  type: http
  seq: 3
  description: |-
      ## List deeds with an unknown status — GET /api/v1/escrituras?status=Signed
      Traceability: CU06, issue #1340. The status is one of Sin Firmar, Firmada, Anulada,
      No Paso, Inscripta (any letter case); anything else answers 400.
http:
  method: GET
  url: "{{base_url}}/api/v1/escrituras"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
  params:
    - name: status
      value: "Signed"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400 Bad Request", function () { expect(res.getStatus()).to.equal(400); });
          test("Names the accepted values", function () {
            expect(res.getBody().message).to.contain("Sin Firmar, Firmada, Anulada, No Paso, Inscripta");
          });
