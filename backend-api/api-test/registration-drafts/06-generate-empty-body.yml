info:
  name: Generate with empty body is rejected
  type: http
  seq: 6
  description: |-
      ## POST /api/v1/minutas-inscripcion with {} — 400 Bad Request
      idDeed is required; a missing id used to reach findById and answer 500.
      Traceability: CU82 (#655)
http:
  method: POST
  url: "{{base_url}}/api/v1/minutas-inscripcion"
  body:
    type: json
    data: |-
        {}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400 Bad Request", function () { expect(res.getStatus()).to.equal(400); });
          test("Standard ErrorResponse naming the required fields", function () {
            const b = res.getBody();
            expect(b.status).to.equal(400);
            expect(b.message).to.include("idDeed");
          });
