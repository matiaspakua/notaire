info:
  name: Teardown - Delete document type (may 409 if linked)
  type: http
  seq: 5
  description: |-
      Traceability: CU27
http:
  method: DELETE
  url: "{{base_url}}/api/v1/tipo-de-documento/{{dct_dt_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status is 200/204/400/409 if linked", function () {
            expect([200,204,400,409]).to.include(res.getStatus());
          });
