info:
  name: Get submitted document by ID
  type: http
  seq: 3
  description: |-
      Traceability: CU72
http:
  method: GET
  url: "{{base_url}}/api/v1/documento-presentado/{{submitted_doc_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns id", function () {
            expect(res.getBody().idSubmittedDocument).to.equal(Number(bru.getVar('submitted_doc_id')));
          });
