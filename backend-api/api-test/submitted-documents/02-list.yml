info:
  name: List submitted documents
  type: http
  seq: 3
  description: |-
      Traceability: CU72
http:
  method: GET
  url: "{{base_url}}/api/v1/documento-presentado"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Created item listed", function () {
            const id = Number(bru.getVar('submitted_doc_id'));
            expect(res.getBody().some(x => x.idSubmittedDocument === id)).to.equal(true);
          });
