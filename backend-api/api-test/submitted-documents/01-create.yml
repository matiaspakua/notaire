info:
  name: Create submitted document
  type: http
  seq: 2
  description: |-
      Traceability: CU04 / CU72 (RF QA Bruno #953). Linked to the trámite from 00-setup-procedure (#655: required on create).
http:
  method: POST
  url: "{{base_url}}/api/v1/documento-presentado"
  body:
    type: json
    data: |-
        {"typeId": 1, "procedureId": {{submitted_doc_procedure_id}}, "date": "2026-09-05", "delivered": false, "name": "Bruno E2E submitted doc"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idSubmittedDocument", function () {
            const b = res.getBody();
            expect(b).to.have.property('idSubmittedDocument');
            bru.setVar('submitted_doc_id', b.idSubmittedDocument);
          });
