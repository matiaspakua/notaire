info:
  name: Reject a create without typeId
  type: http
  seq: 14
  description: |-
      Traceability: CU04 (#655) — the document type is required; nothing is stored
http:
  method: POST
  url: "{{base_url}}/api/v1/documento-presentado"
  body:
    type: json
    data: |-
        {"procedureId": {{submitted_doc_procedure_id}}, "date": "2026-09-05", "delivered": false, "name": "Bruno no type"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400", function () { expect(res.getStatus()).to.equal(400); });
          test("Names the missing field", function () { expect(res.getBody().message).to.contain('typeId'); });
