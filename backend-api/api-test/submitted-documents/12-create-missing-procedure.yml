info:
  name: Reject a create without procedureId
  type: http
  seq: 13
  description: |-
      Traceability: CU04 (#655) — a document is presented for a trámite of a gestión, so the procedure is required; nothing is stored
http:
  method: POST
  url: "{{base_url}}/api/v1/documento-presentado"
  body:
    type: json
    data: |-
        {"typeId": 1, "date": "2026-09-05", "delivered": false, "name": "Bruno no procedure"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400", function () { expect(res.getStatus()).to.equal(400); });
          test("Names the missing field", function () { expect(res.getBody().message).to.contain('procedureId'); });
