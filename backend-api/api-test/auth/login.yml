info:
  name: Login
  type: http
  seq: 1
  description: |-
      ## Login — POST /api/v1/usuarios/login
      Autentica un usuario. Devuelve `valido:true` y los datos del usuario en
      caso de éxito; `valido:false` con credenciales incorrectas.
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios/login"
  body:
    type: json
    data: |-
        { "nombre": "admin", "contrasenia": "admin" }
  headers:
    - name: Content-Type
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Response has valido field", function () {
            expect(res.getBody()).to.have.property('valido');
          });
          test("admin login is valido", function () {
            expect(res.getBody().valido).to.equal(true);
          });
          test("Stores user_id on success", function () {
            const b = res.getBody();
            if (b && b.valido === true && b.idUsuario) {
              bru.setVar('user_id', b.idUsuario);
              expect(b.idUsuario).to.be.a('number');
            }
          });
          test("Stores JWT token on success", function () {
            const b = res.getBody();
            if (b && b.valido === true && b.token) {
              bru.setVar('token', b.token);
              expect(b.token).to.be.a('string');
            }
          });
