info:
  name: Verify document type update
  type: http
  seq: 5
  description: |-
      Traceability: CU32 (RF #55, #57)
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-de-documento/{{document_type_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted (name)", function () {
            expect(String(res.getBody().name)).to.equal('E2E Document Type Updated');
          });
          test("Update persisted (dueDays)", function () {
            expect(res.getBody().dueDays).to.equal(30);
          });
