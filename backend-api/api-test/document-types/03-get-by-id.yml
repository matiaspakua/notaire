info:
  name: Get document type by ID
  type: http
  seq: 3
  description: |-
      Traceability: CU65 (RF #55, #57)
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-de-documento/{{document_type_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the requested item", function () {
            expect(res.getBody().idDocumentType).to.equal(Number(bru.getVar('document_type_id')));
          });
