info:
  name: Create document type
  type: http
  seq: 1
  description: |-
      Traceability: CU27 (RF #55, #57)
http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-de-documento"
  body:
    type: json
    data: |-
        {"name":"E2E Document Type","expires":false,"deliveredBy":"Cliente"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idDocumentType", function () {
            const b = res.getBody();
            expect(b).to.have.property('idDocumentType');
            bru.setVar('document_type_id', b.idDocumentType);
          });
