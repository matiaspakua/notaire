info:
  name: Create with empty body is rejected
  type: http
  seq: 8
  description: |-
      ## POST /api/v1/tipo-de-documento with {} — 400 Bad Request
      The body violates the NOT NULL name constraint. A constraint error is the
      client's fault and answers 400 with the standard ErrorResponse, like
      GlobalExceptionHandler (#579 slice 2), instead of 409. Nothing is stored.
      Traceability: CU27 (#579)
http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-de-documento"
  body:
    type: json
    data: |-
        {}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400 Bad Request", function () { expect(res.getStatus()).to.equal(400); });
          test("Standard ErrorResponse with the constraint message", function () {
            const b = res.getBody();
            expect(b.status).to.equal(400);
            expect(b.message).to.equal("The submitted data violates a database constraint");
          });
