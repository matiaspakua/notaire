info:
  name: List Inmuebles
  type: http
  seq: 2
  description: |-
    ## List Inmuebles — GET /api/v1/inmueble
    Lista todos los inmuebles registrados.
http:
  method: GET
  url: "{{base_url}}/api/v1/inmueble"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Returns array with created inmueble", function () {
          const b = res.getBody();
          expect(b).to.be.an('array');
          const found = b.some(item => item.idInmueble === bru.getVar('inmueble_id'));
          expect(found).to.be.true;
        });
