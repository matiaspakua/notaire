info:
  name: Delete Inmueble
  type: http
  seq: 6
  description: |-
    ## Delete Inmueble — DELETE /api/v1/inmueble/{id}
    Elimina el inmueble creado para pruebas.
http:
  method: DELETE
  url: "{{base_url}}/api/v1/inmueble/{{inmueble_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200 or 204", function () {
          expect([200, 204]).to.include(res.getStatus());
        });
