  type: http
  seq: 7
  description: |-
    ## Verify Delete Inmueble — GET /api/v1/inmueble/{id}
    Verifica que el inmueble ya no existe (404 Not Found).
http:
  method: GET
  url: "{{base_url}}/api/v1/inmueble/{{inmueble_id}}"
  headers:
