info:
  name: Create Pago
  type: http
  description: |-
      ## Create Pago
      Crea un nuevo pago en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/pagos

http:
  method: POST
  url: "{{base_url}}/api/v1/pagos"
  body:
    type: json
    data: |-
        monto: 1000.00
        fecha: "2025-01-15"
        formaPago: "efectivo"
        estado: "pendiente"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

