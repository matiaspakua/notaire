info:
  name: Get Pagos By Presupuesto
  type: http
  seq: 5
  description: "## GET /api/v1/pagos/presupuesto/{idPresupuesto}"
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos/presupuesto/{{_pagos_presupuesto_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
          test("Includes the created pago", function () {
            const b = res.getBody();
            expect(b.some(p => p.idPago === bru.getVar('pago_id'))).to.be.true;
          });
