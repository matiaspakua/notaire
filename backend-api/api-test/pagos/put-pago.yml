info:
  name: Update Pago
  type: http
  description: |-
      ## Update Pago
      Actualiza un pago existente en el sistema.
      
      **Method:** PUT
      **Path:** /api/v1/pagos/{id}

http:
  method: PUT
  url: "{{base_url}}/api/v1/pagos/1"
  body:
    type: json
    data: |-
        monto: 2000.00
        fecha: "2025-02-01"
        formaPago: "transferencia"
        estado: "pagado"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

