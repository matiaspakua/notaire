info:
  name: Verify Pago Update
  type: http
  seq: 10
  description: "## GET /api/v1/pagos/{id} — verifica que el update haya persistido"
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos/{{pago_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
          test("Persists updated monto and metodoPago", function () {
            const b = res.getBody();
            expect(b.monto).to.equal(4500.0);
            expect(b.metodoPago).to.equal('Efectivo');
          });
