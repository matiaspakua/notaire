info:
  name: Get Estado Pago
  type: http
  seq: 7
  description: |-
      ## GET /api/v1/pagos/presupuesto/{idPresupuesto}/estado
      CU47 - Con un pago parcial de 4000 sobre 10000, el estado es PARCIAL.
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos/presupuesto/{{_pagos_presupuesto_id}}/estado"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
          test("Estado is PARCIAL", function () {
            expect(res.getBody()).to.equal('PARCIAL');
          });
