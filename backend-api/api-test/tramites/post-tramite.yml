info:
  name: Create Tramite
  type: http
  description: |-
      ## Create Tramite
      Crea un nuevo trámite en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/tramites

http:
  method: POST
  url: "{{base_url}}/api/v1/tramites"
  body:
    type: json
    data: |-
        nombre: "Trámite de prueba"
        descripcion: "Descripción del trámite"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

