info:
  name: Create Tramite
  type: http
  seq: 1
  description: |-
      ## POST /api/v1/tramites
      Crea un tramite asociado al tipo de tramite sembrado en
      V2__initial_data.sql (id 1).
http:
  method: POST
  url: "{{base_url}}/api/v1/tramites"
  body:
    type: json
    data: |-
        {
          "notes": "Tramite E2E",
          "fkIdProcedureType": { "idProcedureType": 1 }
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () {
            expect(res.getStatus()).to.equal(201);
          });
          test("Stores procedure id", function () {
            const b = res.getBody();
            expect(b.idProcedure).to.be.a('number');
            bru.setVar('tramite_id', b.idProcedure);
          });
          test("Persists notes", function () {
            expect(res.getBody().notes).to.equal('Tramite E2E');
          });
