info:
  name: Get Tramite By Id
  type: http
  seq: 3
  description: "## GET /api/v1/tramites/{id}"
http:
  method: GET
  url: "{{base_url}}/api/v1/tramites/{{tramite_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
          test("Returns the correct tramite", function () {
            expect(res.getBody().idTramite).to.equal(bru.getVar('tramite_id'));
          });
