info:
  name: Verify Estado de Gestion Update
  type: http
  seq: 5
http:
  method: GET
  url: "{{base_url}}/api/v1/estado-gestion/{{_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted (name)", function () {
            expect(String(res.getBody().name)).to.equal('EG E2E Actualizado');
          });
