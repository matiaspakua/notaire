info:
  name: Get All Registros de Auditoria
  type: http
  seq: 1
  description: |-
      ## Get All Registros de Auditoria — GET /api/v1/registro-auditoria
      Obtiene todos los registros de auditoría sin paginación (compatibilidad legacy).
      El endpoint devuelve una lista plana de DTOs cuando no se pasan parámetros
      de paginación. Requiere token JWT válido (corre después del bloque `auth`).

http:
  method: GET
  url: "{{base_url}}/api/v1/registro-auditoria"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("Response is an array (legacy flat list)", function () {
            expect(res.getBody()).to.be.an('array');
          });

          test("Each entry has expected audit fields", function () {
            const body = res.getBody();
            if (body.length > 0) {
              const entry = body[0];
              expect(entry).to.have.property('idRegistroAuditoria');
              expect(entry).to.have.property('detalleOperacion');
              expect(entry).to.have.property('modulo');
            }
          });

