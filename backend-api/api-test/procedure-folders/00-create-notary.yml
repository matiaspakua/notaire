info:
  name: Setup - Create notary
  type: http
  seq: 1
  description: |-
      Traceability: CU85 (RF QA Bruno #953)
http:
  method: POST
  url: "{{base_url}}/api/v1/people"
  body:
    type: json
    data: |-
        {
          "firstName": "Notary",
          "lastName": "Folders E2E",
          "identificationNumber": "{{pf_notary_document}}",
          "isClient": false,
          "fkIdIdentificationType": { "idIdentificationType": 1 },
          "nationality": "Argentina",
          "maritalStatus": "Soltero",
          "sex": "Masculino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
          const now = Date.now();
          bru.setVar('pf_notary_document', String(now).slice(-8));
          bru.setVar('pf_mgmt_number', 300000000 + (now % 600000000));
    - type: tests
      code: |-
          test("Status 201", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores notary id", function () { bru.setVar('pf_notary_id', res.getBody().personId); });
