info:
  name: Report - declaracion jurada rentas PDF
  type: http
  seq: 4
  description: |-
      Traceability: CU50
http:
  method: GET
  url: "{{base_url}}/api/v1/reportes/declaracion-jurada-rentas?anio=2026&mes=9"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 or 500 if template/data unavailable", function () {
            expect([200,500]).to.include(res.getStatus());
          });
          test("If 200, Content-Type is PDF", function () {
            if (res.getStatus() === 200) {
              const ct = res.getHeader('content-type') || '';
              expect(String(ct).toLowerCase()).to.include('pdf');
            }
          });
