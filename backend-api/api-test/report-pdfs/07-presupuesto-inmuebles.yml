info:
  name: Report - presupuesto con inmuebles PDF
  type: http
  seq: 8
  description: |-
      ## GET /api/v1/reportes/presupuesto-inmuebles/{idPresupuesto}
      Rendered in-house from the current schema since #567 (was a broken Jasper template).
      Traceability: CU01
http:
  method: GET
  url: "{{base_url}}/api/v1/reportes/presupuesto-inmuebles/{{report_budget_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Content-Type is PDF", function () {
            expect(String(res.getHeader('content-type') || '').toLowerCase()).to.include('application/pdf');
          });
