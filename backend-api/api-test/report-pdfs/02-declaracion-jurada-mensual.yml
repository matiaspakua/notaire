info:
  name: Report - declaracion jurada mensual PDF
  type: http
  seq: 2
  description: |-
      Traceability: CU25
http:
  method: GET
  url: "{{base_url}}/api/v1/reports/monthly-sworn-statement?anio=2026&mes=9"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Content-Type is PDF", function () {
            expect(String(res.getHeader('content-type') || '').toLowerCase()).to.include('application/pdf');
          });
