info:
  name: Setup - Create Suplente Persona
  type: http
  seq: 1
  description: |-
      ## Setup — POST /api/v1/personas
      Crea la persona suplente requerida por el alta de suplencia, para que la
      suite sea autosuficiente en una base de datos recién migrada.
http:
  method: POST
  url: "{{base_url}}/api/v1/personas"
  body:
    type: json
    data: |-
        {
          "nombre": "Suplente",
          "apellido": "Suplencias E2E",
          "numeroIdentificacion": "30555446",
          "esCliente": false,
          "tipoIdentificacion": { "idTipoIdentificacion": 1 },
          "nacionalidad": "Argentina",
          "estadoCivil": "Soltero",
          "sexo": "Femenino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores suplente id", function () {
            const b = res.getBody();
            expect(b).to.have.property('idPersona');
            bru.setVar('_suplente_id', b.idPersona);
          });
