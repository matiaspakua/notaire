info:
  name: Setup - Create Suplente Persona
  type: http
  seq: 1
  description: |-
      ## Setup — POST /api/v1/people
      Crea la persona suplente requerida por el alta de suplencia, para que la
      suite sea autosuficiente en una base de datos recién migrada.
http:
  method: POST
  url: "{{base_url}}/api/v1/people"
  body:
    type: json
    data: |-
        {
          "firstName": "Suplente",
          "lastName": "Suplencias E2E",
          "identificationNumber": "30555446",
          "isClient": false,
          "fkIdIdentificationType": { "idTipoIdentificacion": 1 },
          "nationality": "Argentina",
          "maritalStatus": "Soltero",
          "sex": "Femenino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created or 409 Conflict", function () {
            expect([200, 201, 409]).to.include(res.getStatus());
          });
          test("Stores suplente id", function () {
            const b = res.getBody();
            const id = b.personId || b.idPersonaExistente;
            expect(id).to.be.a('number');
            bru.setVar('_suplente_id', id);
          });
