info:
  name: Create Suplencia
  type: http
  seq: 3
http:
  method: POST
  url: "{{base_url}}/api/v1/suplencia"
  body:
    type: json
    data: |-
        {"dateStart":"2026-01-01","dateEnd":"2026-01-31","fkIdSubstitute":{"personId":{{_suplente_id}}},"fkIdSubstituted":{"personId":{{_suplantado_id}}}}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idSubstitution", function () {
            const b = res.getBody();
            expect(b).to.have.property('idSubstitution');
            bru.setVar('_suplencia_id', b.idSubstitution);
          });
