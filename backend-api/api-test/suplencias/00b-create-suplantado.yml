info:
  name: Setup - Create Suplantado Persona
  type: http
  seq: 2
  description: |-
      ## Setup — POST /api/v1/personas
      Crea la persona suplantada requerida por el alta de suplencia, para que
      la suite sea autosuficiente en una base de datos recién migrada.
http:
  method: POST
  url: "{{base_url}}/api/v1/personas"
  body:
    type: json
    data: |-
        {
          "nombre": "Suplantado",
          "apellido": "Suplencias E2E",
          "numeroIdentificacion": "30555447",
          "esCliente": false,
          "tipoIdentificacion": { "idTipoIdentificacion": 1 },
          "nacionalidad": "Argentina",
          "estadoCivil": "Casado",
          "sexo": "Masculino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created or 409 Conflict", function () {
            expect([200, 201, 409]).to.include(res.getStatus());
          });
          test("Stores suplantado id", function () {
            const b = res.getBody();
            const id = b.idPersona || b.idPersonaExistente;
            expect(id).to.be.a('number');
            bru.setVar('_suplantado_id', id);
          });
