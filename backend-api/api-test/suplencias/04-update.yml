info:
  name: Update Suplencia
  type: http
  seq: 6
http:
  method: PUT
  url: "{{base_url}}/api/v1/suplencia/{{_suplencia_id}}"
  body:
    type: json
    data: |-
        {"dateStart":"2026-02-01","dateEnd":"2026-02-28","fkIdSubstitute":{"personId":{{_suplente_id}}},"fkIdSubstituted":{"personId":{{_suplantado_id}}}}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 or 204", function () { expect([200,204]).to.include(res.getStatus()); });
