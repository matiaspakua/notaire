info:
  name: Get notebook by ID
  type: http
  seq: 14
  description: |-
      Traceability: CU80
http:
  method: GET
  url: "{{base_url}}/api/v1/cuadernos/{{nb_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns idNotebook", function () {
            expect(res.getBody().idNotebook).to.equal(Number(bru.getVar('nb_id')));
          });
