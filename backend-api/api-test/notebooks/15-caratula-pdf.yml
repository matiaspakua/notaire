info:
  name: Get notebook cover PDF
  type: http
  seq: 15
  description: |-
      Traceability: CU80
http:
  method: GET
  url: "{{base_url}}/api/v1/cuadernos/{{nb_id}}/caratula"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Content-Type is PDF", function () {
            const ct = res.getHeader('content-type') || res.getHeaders()['content-type'] || '';
            expect(String(ct).toLowerCase()).to.include('pdf');
          });
