info:
  name: Get Tipo de Identificacion By ID
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-identificacion/{{_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the requested item", function () {
            expect(res.getBody().idTipoIdentificacion).to.equal(Number(bru.getVar('_id')));
          });
