info:
  name: Create Tipo de Identificacion
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-identificacion"
  body:
    type: json
    data: |-
        {"name":"TI E2E","characters":"8"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idTipoIdentificacion", function () {
            const b = res.getBody();
            expect(b).to.have.property('idTipoIdentificacion');
            bru.setVar('_id', b.idTipoIdentificacion);
          });
