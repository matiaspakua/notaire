info:
  name: Create Presupuesto
  type: http
  seq: 1
  description: "## CU01 Preparar presupuesto — POST /api/v1/presupuestos"
http:
  method: POST
  url: "{{base_url}}/api/v1/presupuestos"
  body:
    type: json
    data: |-
        {
          "person": { "personId": 1 },
          "date": "2026-06-02",
          "encabezado": "Presupuesto E2E",
          "status": "Pendiente",
          "notes": "creado por la suite"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idPresupuesto", function () {
            const b = res.getBody();
            expect(b).to.have.property('idBudget');
            bru.setVar('presupuesto_id', b.idBudget);
          });
