info:
  name: Update Presupuesto
  type: http
  description: |-
      ## Update Presupuesto
      Actualiza un presupuesto existente en el sistema.
      
      **Method:** PUT
      **Path:** /api/v1/presupuestos/{id}

http:
  method: PUT
  url: "{{base_url}}/api/v1/presupuestos/{{presupuesto_id}}"
  body:
    type: json
    data: |-
        numero: 1002
        fecha: "2025-02-01"
        estado: "aprobado"
        observaciones: "Presupuesto actualizado"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

