info:
  name: List Presupuestos
  type: http
  seq: 2
http:
  method: GET
  url: "{{base_url}}/api/v1/presupuestos"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Created presupuesto is listed", function () {
            const id = Number(bru.getVar('presupuesto_id'));
            const page = res.getBody();
            expect(page).to.have.property('content');
            expect(page.content.some(p => p.idPresupuesto === id)).to.equal(true);
          });
