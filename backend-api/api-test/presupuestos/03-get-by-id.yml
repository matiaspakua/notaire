info:
  name: Get Presupuesto By ID
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/api/v1/presupuestos/{{presupuesto_id}}"
  headers:
    Content-Type: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the presupuesto", function () { expect(res.getBody().idPresupuesto).to.equal(Number(bru.getVar('presupuesto_id'))); });
