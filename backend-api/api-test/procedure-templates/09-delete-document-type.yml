info:
  name: Delete the checklist document type
  type: http
  seq: 9
  description: |-
      Issue #1362 teardown: the document type from 03 is no longer referenced.
      Traceability: CU55 (RF #53), CU03 (RF #14, #15)
http:
  method: DELETE
  url: "{{base_url}}/api/v1/document-types/{{procedure_template_document_type_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 204 No Content", function () { expect(res.getStatus()).to.equal(204); });
