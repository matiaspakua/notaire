info:
  name: Add a required document to procedure type 1
  type: http
  seq: 4
  description: |-
      Issue #1362: POST adds a row to the checklist of seeded procedure type 1.
      Traceability: CU55 (RF #53), CU03 (RF #14, #15)
http:
  method: POST
  url: "{{base_url}}/api/v1/procedure-templates"
  body:
    type: json
    data: |-
        {
          "fkIdProcedureType": 1,
          "fkIdDocumentType": {{procedure_template_document_type_id}},
          "notes": "Original"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Echoes the key and notes", function () {
            const b = res.getBody();
            expect(b.fkIdProcedureType).to.equal(1);
            expect(b.fkIdDocumentType).to.equal(Number(bru.getVar("procedure_template_document_type_id")));
            expect(b.notes).to.equal("Original");
          });
