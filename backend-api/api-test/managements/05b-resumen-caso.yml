info:
  name: Get case summary
  type: http
  seq: 7
  description: |-
      A gestión without trámites has no escrituras (#774).
      Traceability: CU07; CU11; CU12; CU70
http:
  method: GET
  url: "{{base_url}}/api/v1/gestiones/{{mgmt_id}}/resumen-caso"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 with the gestión header and no deeds", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().managementId).to.equal(parseInt(bru.getVar('mgmt_id'), 10));
            expect(res.getBody().deeds).to.be.an('array').that.is.empty;
          });
