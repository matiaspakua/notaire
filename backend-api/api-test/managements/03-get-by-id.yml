info:
  name: Get management by ID
  type: http
  seq: 4
  description: |-
      Traceability: CU14
http:
  method: GET
  url: "{{base_url}}/api/v1/gestiones/{{mgmt_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns idManagement", function () {
            expect(res.getBody().idManagement).to.equal(Number(bru.getVar('mgmt_id')));
          });
