info:
  name: Get current status
  type: http
  seq: 6
  description: |-
      After #806, plain create with status writes History (and estado-actual
      also falls back to the entity status when History is empty).
      Traceability: CU14; CU13
http:
  method: GET
  url: "{{base_url}}/api/v1/gestiones/{{mgmt_id}}/estado-actual"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 with current status", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().managementId).to.equal(parseInt(bru.getVar('mgmt_id'), 10));
            expect(res.getBody().statusManagementId).to.be.a('number');
          });
