info:
  name: Get pending balance
  type: http
  seq: 6
  description: |-
      ## Get pending balance — GET /api/v1/pagos/presupuesto/{payments_budget_id}/saldo
      Total 10000 - payment 4000 = balance 6000.
      Traceability: CU47 (RF #20, #22)
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos/presupuesto/{{payments_budget_id}}/saldo"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Pending balance is 6000", function () { expect(res.getBody()).to.equal(6000.0); });
