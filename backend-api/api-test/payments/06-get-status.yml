info:
  name: Get payment status
  type: http
  seq: 7
  description: |-
      ## Get payment status — GET /api/v1/pagos/presupuesto/{payments_budget_id}/estado
      A 4000 partial payment on a 10000 budget yields PARTIAL.
      Traceability: CU47 (RF #20, #22)
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos/presupuesto/{{payments_budget_id}}/estado"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Status is PARTIAL", function () { expect(res.getBody()).to.equal('PARTIAL'); });
