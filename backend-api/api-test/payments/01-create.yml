info:
  name: Create payment
  type: http
  seq: 2
  description: |-
      ## Create payment — POST /api/v1/pagos
      Processes a partial payment (4000 of a 10000 total) against the setup budget.
      Traceability: CU15 (RF #3, #20, #21, #22, #23)
http:
  method: POST
  url: "{{base_url}}/api/v1/pagos"
  body:
    type: json
    data: |-
        {
          "idBudget": {{payments_budget_id}},
          "amount": 4000.0,
          "date": "2026-09-05",
          "notes": "E2E partial payment",
          "paymentMethod": "Transferencia"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores the payment id", function () {
            const b = res.getBody();
            expect(b.idPayment).to.be.a('number');
            bru.setVar('payment_id', b.idPayment);
          });
          test("Persists the amount", function () { expect(res.getBody().amount).to.equal(4000.0); });
