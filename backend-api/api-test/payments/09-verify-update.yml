info:
  name: Verify payment update
  type: http
  seq: 10
  description: |-
      ## Verify payment update — GET /api/v1/pagos/{payment_id}
      Traceability: CU47 (RF #20, #22)
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos/{{payment_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Persists the updated amount and payment method", function () {
            const b = res.getBody();
            expect(b.amount).to.equal(4500.0);
            expect(b.paymentMethod).to.equal('Efectivo');
          });
