info:
  name: Create payment over limit - rejected
  type: http
  seq: 8
  description: |-
      ## Create payment over limit — POST /api/v1/pagos
      A payment exceeding the pending balance (6000) must be rejected with 409 Conflict.
      Traceability: CU15 (RF #3, #20, #21, #22, #23)
http:
  method: POST
  url: "{{base_url}}/api/v1/pagos"
  body:
    type: json
    data: |-
        {
          "idBudget": {{payments_budget_id}},
          "amount": 7000.0,
          "date": "2026-09-05",
          "notes": "Payment exceeding the balance"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 409 Conflict", function () { expect(res.getStatus()).to.equal(409); });
