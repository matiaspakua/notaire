info:
  name: List payments
  type: http
  seq: 3
  description: |-
      ## List payments — GET /api/v1/pagos
      Traceability: CU47 (RF #20, #22)
http:
  method: GET
  url: "{{base_url}}/api/v1/pagos"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Includes the created payment", function () {
            const id = Number(bru.getVar('payment_id'));
            expect(res.getBody().some(p => p.idPayment === id)).to.be.true;
          });
