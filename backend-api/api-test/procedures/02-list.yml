info:
  name: List procedures
  type: http
  seq: 2
  description: |-
      ## List procedures — GET /api/v1/tramites (paginated)
      Traceability: CU02 (RF #3, #10)
http:
  method: GET
  url: "{{base_url}}/api/v1/tramites?size=1000"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Page content includes the created procedure", function () {
            expect(res.getBody().content.some(t => t.idProcedure === bru.getVar('procedure_id'))).to.be.true;
          });
