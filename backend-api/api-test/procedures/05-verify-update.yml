info:
  name: Verify procedure update
  type: http
  seq: 5
  description: |-
      ## Verify procedure update — GET /api/v1/tramites/{procedure_id}
      Traceability: CU53 (RF #3, #13)
http:
  method: GET
  url: "{{base_url}}/api/v1/tramites/{{procedure_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Persists the updated notes", function () {
            expect(res.getBody().notes).to.equal('E2E procedure updated');
          });
