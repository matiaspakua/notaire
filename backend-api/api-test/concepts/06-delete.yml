info:
  name: Delete concept
  type: http
  seq: 6
  description: |-
      ## Delete concept — DELETE /api/v1/conceptos/{id} (204 No Content)
      Traceability: CU37 (RF #55, #60)

http:
  method: DELETE
  url: "{{base_url}}/api/v1/conceptos/{{concept_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 204 No Content", function () { expect(res.getStatus()).to.equal(204); });
