info:
  name: Verify concept update
  type: http
  seq: 5
  description: |-
      ## Verify the update persisted — GET /api/v1/conceptos/{id}
      Traceability: CU34 (RF #55, #60)

http:
  method: GET
  url: "{{base_url}}/api/v1/conceptos/{{concept_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update was persisted", function () {
            const b = res.getBody();
            expect(b.name).to.equal('E2E Concept Updated');
            expect(Number(b.value)).to.equal(2750);
          });
