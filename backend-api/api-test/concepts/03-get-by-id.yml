info:
  name: Get concept by ID
  type: http
  seq: 3
  description: |-
      ## Get Concept by ID — GET /api/v1/conceptos/{id}
      Traceability: CU66 (RF #55, #60)

http:
  method: GET
  url: "{{base_url}}/api/v1/conceptos/{{concept_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the requested concept", function () {
            const b = res.getBody();
            expect(b.idConcept).to.equal(Number(bru.getVar('concept_id')));
            expect(b).to.have.property('name');
          });
