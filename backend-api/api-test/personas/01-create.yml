info:
  name: Create Persona
  type: http
  seq: 1
  description: "## CU17 Dar alta persona — POST /api/v1/people"
http:
  method: POST
  url: "{{base_url}}/api/v1/people"
  body:
    type: json
    data: |-
        {
          "firstName": "Ana",
          "lastName": "Lopez E2E",
          "identificationNumber": "30555444",
          "isClient": true,
          "fkIdIdentificationType": { "idTipoIdentificacion": 1 },
          "nationality": "Argentina",
          "maritalStatus": "Soltero",
          "sex": "Femenino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns personId and is marked cliente", function () {
            const b = res.getBody();
            expect(b).to.have.property('personId');
            expect(b.isClient).to.equal(true);
            bru.setVar('persona_id', b.personId);
          });
