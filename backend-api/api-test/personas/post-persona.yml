info:
  name: Create Persona
  type: http
  description: |-
      ## Create Persona
      Crea una nueva persona en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/personas

http:
  method: POST
  url: "{{base_url}}/api/v1/personas"
  body:
    type: json
    data: |-
        nombre: Juan
        apellido: Perez
        numeroIdentificacion: "12345678"
        esCliente: false
        esActivo: true
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });
           
          test("Response has id", function () {
            const body = res.getBody();
            expect(body).to.have.property('idPersona');
          });

