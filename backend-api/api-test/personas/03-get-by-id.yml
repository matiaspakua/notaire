info:
  name: Get Persona By ID
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/api/v1/personas/{{persona_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns requested persona", function () {
            expect(res.getBody().idPersona).to.equal(Number(bru.getVar('persona_id')));
          });
