info:
  name: Update Persona
  type: http
  seq: 5
http:
  method: PUT
  url: "{{base_url}}/api/v1/personas/{{persona_id}}"
  body:
    type: json
    data: |-
        {
          "nombre": "Ana Maria",
          "apellido": "Lopez Actualizada",
          "numeroIdentificacion": "30999888",
          "esCliente": true,
          "tipoIdentificacion": { "idTipoIdentificacion": 1 },
          "nacionalidad": "Argentina",
          "estadoCivil": "Casado",
          "sexo": "Femenino"
        }
  headers:
    Content-Type: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted", function () { expect(res.getBody().nombre).to.equal('Ana Maria'); });
