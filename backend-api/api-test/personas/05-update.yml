info:
  name: Update Persona
  type: http
  seq: 5
http:
  method: PUT
  url: "{{base_url}}/api/v1/people/{{persona_id}}"
  body:
    type: json
    data: |-
        {
          "firstName": "Ana Maria",
          "lastName": "Lopez Actualizada",
          "identificationNumber": "30999888",
          "isClient": true,
          "fkIdIdentificationType": { "idTipoIdentificacion": 1 },
          "nationality": "Argentina",
          "maritalStatus": "Casado",
          "sex": "Femenino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted", function () { expect(res.getBody().firstName).to.equal('Ana Maria'); });
