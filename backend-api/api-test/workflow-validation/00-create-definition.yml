info:
  name: Setup - Create workflow definition
  type: http
  seq: 1
  description: |-
      Traceability: CU76 / CU83
http:
  method: POST
  url: "{{base_url}}/api/v1/workflow-definition"
  body:
    type: json
    data: |-
        {"name":"{{wf_val_def_name}}","description":"validate fixture","active":true}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
          bru.setVar('wf_val_def_name', 'e2e-wf-val-' + Date.now());
    - type: tests
      code: |-
          test("Status 201", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores id", function () { bru.setVar('wf_val_def_id', res.getBody().id); });
