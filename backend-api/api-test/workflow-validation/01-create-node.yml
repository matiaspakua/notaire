info:
  name: Setup - Create initial node
  type: http
  seq: 2
  description: |-
      Traceability: CU76 / CU83
http:
  method: POST
  url: "{{base_url}}/api/v1/workflow-node"
  body:
    type: json
    data: |-
        {
          "workflowDefinitionId": {{wf_val_def_id}},
          "statusManagementId": 1,
          "type": "INITIAL",
          "positionX": 0,
          "positionY": 0
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores node id", function () { bru.setVar('wf_val_node_id', res.getBody().id); });
