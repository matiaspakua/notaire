info:
  name: Create workflow node
  type: http
  seq: 2
  description: |-
      Traceability: CU76 / CU83
http:
  method: POST
  url: "{{base_url}}/api/v1/workflow-node"
  body:
    type: json
    data: |-
        {
          "workflowDefinitionId": {{wf_nodes_def_id}},
          "statusManagementId": 1,
          "type": "INITIAL",
          "positionX": 10,
          "positionY": 20
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns id", function () {
            const b = res.getBody();
            expect(b).to.have.property('id');
            bru.setVar('wf_node_id', b.id);
          });
