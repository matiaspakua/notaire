info:
  name: Update with nothing to change is rejected
  type: http
  seq: 11
  description: |-
      ## PUT /api/v1/workflow-node/1 with {} — 400 Bad Request
      A node update must carry type, positionX or positionY; an empty body used to answer 200 without changing anything (#655).
      Traceability: CU76 / CU83 (#579, #655)
http:
  method: PUT
  url: "{{base_url}}/api/v1/workflow-node/1"
  body:
    type: json
    data: |-
        {}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400 Bad Request", function () { expect(res.getStatus()).to.equal(400); });
          test("Standard ErrorResponse naming the problem", function () {
            const b = res.getBody();
            expect(b.status).to.equal(400);
            expect(b.message).to.include("indicar al menos un campo");
          });
