info:
  name: Setup - Create workflow definition
  type: http
  seq: 1
  description: |-
      Traceability: CU76 / CU83
http:
  method: POST
  url: "{{base_url}}/api/v1/workflow-definition"
  body:
    type: json
    data: |-
        {
          "name": "{{wf_nodes_def_name}}",
          "description": "nodes fixture",
          "active": true
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
          bru.setVar('wf_nodes_def_name', 'e2e-wf-nodes-' + Date.now());
    - type: tests
      code: |-
          test("Status 201", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores wf_nodes_def_id", function () {
            bru.setVar('wf_nodes_def_id', res.getBody().id);
            expect(bru.getVar('wf_nodes_def_id')).to.be.a('number');
          });
