info:
  name: Update Escritura
  type: http
  description: |-
      ## Update Escritura
      Actualiza una escritura existente en el sistema.
      
      **Method:** PUT
      **Path:** /api/v1/escrituras/{id}

http:
  method: PUT
  url: "{{base_url}}/api/v1/escrituras/{{escritura_id}}"
  body:
    type: json
    data: |-
        numero: 1002
        fecha: "2025-02-01"
        tipo: "escritura"
        estado: "completada"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

