info:
  name: Get Escribanos Disponibles
  type: http
  description: |-
      ## Get Escribanos Disponibles
      Obtiene lista de escribanos disponibles (con registro).
      
      **Method:** GET
      **Path:** /api/v1/escrituras/escribanos-disponibles

http:
  method: GET
  url: "{{base_url}}/api/v1/escrituras/escribanos-disponibles"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });
           
          test("Response is array", function () {
            const body = res.getBody();
            expect(body).to.be.an('array');
          });

