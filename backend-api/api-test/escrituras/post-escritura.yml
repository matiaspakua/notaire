info:
  name: Create Escritura
  type: http
  description: |-
      ## Create Escritura
      Crea una nueva escritura en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/escrituras

http:
  method: POST
  url: "{{base_url}}/api/v1/escrituras"
  body:
    type: json
    data: |-
        numero: 1001
        fecha: "2025-01-15"
        tipo: "escritura"
        estado: "pendiente"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

