info:
  name: List people
  type: http
  seq: 2
  description: |-
      ## List people — GET /api/v1/people (paginated, #596)
      Answers a Spring Data page; newest first with `sort=idPerson,desc`.
      Traceability: CU61 (RF #38, #41)
http:
  method: GET
  url: "{{base_url}}/api/v1/people?size=5&sort=idPerson,desc"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Answers a page bounded by size", function () {
            const b = res.getBody();
            expect(b.size).to.equal(5);
            expect(b.content.length).to.be.at.most(5);
            expect(b.totalElements).to.be.at.least(1);
          });
          test("First page contains the created person", function () {
            const id = Number(bru.getVar('person_id'));
            expect(res.getBody().content.some(p => p.personId === id)).to.equal(true);
          });
