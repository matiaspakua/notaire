info:
  name: List people
  type: http
  seq: 2
  description: |-
      ## List people — GET /api/v1/people
      Traceability: CU61 (RF #38, #41)
http:
  method: GET
  url: "{{base_url}}/api/v1/people"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("List contains the created person", function () {
            const id = Number(bru.getVar('person_id'));
            expect(res.getBody().some(p => p.personId === id)).to.equal(true);
          });
