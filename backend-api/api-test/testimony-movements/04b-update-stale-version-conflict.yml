info:
  name: Update testimony movement with a stale version answers 409
  type: http
  seq: 6
  description: |-
      ## Stale version — PUT /api/v1/movimiento-testimonio/{tm_movement_id}
      Issue #655, Owner decision Oct 9: 04-update moved the stored version to 1, so
      version 0 is an optimistic-lock conflict. It answers 409 (it was a 500 or was
      silently ignored) and 05-verify-update still sees 04's notes.
      Traceability: CU12
http:
  method: PUT
  url: "{{base_url}}/api/v1/movimiento-testimonio/{{tm_movement_id}}"
  body:
    type: json
    data: |-
        {
          "testimony": { "idTestimony": {{tm_testimony_id}} },
          "dateEntry": "2026-09-05",
          "registered": false,
          "notes": "stale write",
          "version": 0
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 409", function () { expect(res.getStatus()).to.equal(409); });
          test("Standard ErrorResponse asks to reload", function () {
            expect(res.getBody().message).to.contain('reload it');
          });
