info:
  name: Get testimony movement by ID
  type: http
  seq: 5
  description: |-
      Traceability: CU12
http:
  method: GET
  url: "{{base_url}}/api/v1/movimiento-testimonio/{{tm_movement_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns id", function () {
            expect(res.getBody().idTestimonyMovement).to.equal(Number(bru.getVar('tm_movement_id')));
          });
