info:
  name: List testimony movements
  type: http
  seq: 3
  description: |-
      Traceability: CU12
http:
  method: GET
  url: "{{base_url}}/api/v1/movimiento-testimonio"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Created movement listed", function () {
            const id = Number(bru.getVar('tm_movement_id'));
            expect(res.getBody().some(x => x.idTestimonyMovement === id)).to.equal(true);
          });
