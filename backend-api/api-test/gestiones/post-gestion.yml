info:
  name: Create Gestion
  type: http
  description: |-
      ## Create Gestion
      Crea una nueva gestión en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/gestiones

http:
  method: POST
  url: "{{base_url}}/api/v1/gestiones"
  body:
    type: json
    data: |-
        numero: 1001
        fechaInicio: "2025-01-15"
        detalle: "Gestión de prueba"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

