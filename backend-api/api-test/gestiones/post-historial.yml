info:
  name: Create Historial
  type: http
  description: |-
      ## Create Historial
      Crea un nuevo historial en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/historial

http:
  method: POST
  url: "{{base_url}}/api/v1/historial"
  body:
    type: json
    data: |-
        fecha: "2025-01-15"
        descripcion: "Historial de prueba"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

