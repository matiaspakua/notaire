info:
  name: Get Historial By Gestion
  type: http
  description: |-
      ## Get Historial By Gestion
      Obtiene el historial de una gestión (CU13).
      
      **Method:** GET
      **Path:** /api/v1/historial/gestion/{idGestion}

http:
  method: GET
  url: "{{base_url}}/api/v1/historial/gestion/{{gestion_id}}"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });
           
          test("Response is array", function () {
            const body = res.getBody();
            expect(body).to.be.an('array');
          });

