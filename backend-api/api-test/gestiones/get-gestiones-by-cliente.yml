info:
  name: Get Gestiones By Cliente
  type: http
  description: |-
      ## Get Gestiones By Cliente
      Obtiene lasgestiones de un cliente (CU19).
      
      **Method:** GET
      **Path:** /api/v1/gestiones/cliente/{idPersona}

http:
  method: GET
  url: "{{base_url}}/api/v1/gestiones/cliente/{{persona_id}}"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });
           
          test("Response is array", function () {
            const body = res.getBody();
            expect(body).to.be.an('array');
          });

