info:
  name: Verify role update
  type: http
  seq: 5
  description: |-
      Traceability: CU76 (RF QA Bruno #953)
http:
  method: GET
  url: "{{base_url}}/api/v1/roles/{{roles_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted", function () {
            expect(String(res.getBody().name)).to.equal(bru.getVar('roles_name') + '-upd');
          });
