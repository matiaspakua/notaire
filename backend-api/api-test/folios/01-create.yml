info:
  name: Create Folio
  type: http
  seq: 2
  description: "## CU28/40 — POST /api/v1/folio"
http:
  method: POST
  url: "{{base_url}}/api/v1/folio"
  body:
    type: json
    data: |-
        {
          "numero": 55777,
          "anio": 2026,
          "estado": "Nuevo",
          "observaciones": "creado por la suite E2E",
          "tipoFolioId": 1,
          "escribanoId": {{_folio_escribano_id}}
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idFolio", function () {
            const b = res.getBody();
            expect(b).to.have.property('idFolio');
            bru.setVar('folio_id', b.idFolio);
          });
