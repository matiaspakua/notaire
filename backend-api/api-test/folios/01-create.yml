info:
  name: Create folio
  type: http
  seq: 2
  description: |-
      ## Create folio — POST /api/v1/folio
      Traceability: CU28 (RF #55, #58, #94, #95, #96)
http:
  method: POST
  url: "{{base_url}}/api/v1/folio"
  body:
    type: json
    data: |-
        {
          "number": {{folio_number}},
          "year": 2026,
          "status": "Nuevo",
          "notes": "created by the E2E suite",
          "typeFolioId": 1,
          "notaryId": {{folio_notary_id}}
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idFolio", function () {
            const b = res.getBody();
            expect(b).to.have.property('idFolio');
            bru.setVar('folio_id', b.idFolio);
          });
