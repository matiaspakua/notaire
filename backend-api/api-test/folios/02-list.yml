info:
  name: List folios
  type: http
  seq: 3
  description: |-
      ## List folios — GET /api/v1/folio
      Regression for #416 — raw entity serialization must not 500.
      Traceability: CU63 (RF #55, #58, #94, #95, #96, #99)
http:
  method: GET
  url: "{{base_url}}/api/v1/folio"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 (no lazy-proxy serialization 500)", function () { expect(res.getStatus()).to.equal(200); });
          test("Response is an array", function () { expect(res.getBody()).to.be.an('array'); });
          test("Created folio is in the list", function () {
            const id = Number(bru.getVar('folio_id'));
            expect(res.getBody().some(f => f.idFolio === id)).to.equal(true);
          });
