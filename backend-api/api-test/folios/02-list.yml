info:
  name: List Folios
  type: http
  seq: 2
  description: "## Regression for #416 — raw entity serialization must not 500"
http:
  method: GET
  url: "{{base_url}}/api/v1/folio"
  headers:
    Content-Type: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 (no lazy-proxy serialization 500)", function () { expect(res.getStatus()).to.equal(200); });
          test("Response is an array", function () { expect(res.getBody()).to.be.an('array'); });
