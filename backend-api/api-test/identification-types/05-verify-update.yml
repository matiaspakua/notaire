info:
  name: Verify identification type update
  type: http
  seq: 5
  description: |-
      Traceability: CU17 (RF #12, #38, #39)
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-identificacion/{{identification_type_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted (name)", function () {
            expect(String(res.getBody().name)).to.equal('E2E Identification Type Updated');
          });
