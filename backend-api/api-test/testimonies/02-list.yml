info:
  name: List testimonies
  type: http
  seq: 3
  description: |-
      Traceability: CU07
http:
  method: GET
  url: "{{base_url}}/api/v1/testimonio"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Created testimony listed", function () {
            const id = Number(bru.getVar('testimony_id'));
            expect(res.getBody().some(x => x.idTestimony === id)).to.equal(true);
          });
