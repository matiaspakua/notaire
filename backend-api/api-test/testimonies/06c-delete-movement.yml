  url: "{{base_url}}/api/v1/testimony-movements/{{testimony_movement_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 204 No Content", function () { expect(res.getStatus()).to.equal(204); });
