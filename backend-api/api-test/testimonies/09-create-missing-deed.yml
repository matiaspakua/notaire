info:
  name: Reject a create without deed
  type: http
  seq: 10
  description: |-
      Traceability: CU07 (#655) — a testimony is a copy of a deed; a bare create
      without one is rejected and nothing is stored
http:
  method: POST
  url: "{{base_url}}/api/v1/testimonio"
  body:
    type: json
    data: |-
        {"number": 1, "flagged": false, "verified": false, "notes": "Bruno no deed"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400", function () { expect(res.getStatus()).to.equal(400); });
          test("Names the missing field", function () { expect(res.getBody().message).to.contain('deed'); });
