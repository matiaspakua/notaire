info:
  name: Get testimony by ID
  type: http
  seq: 3
  description: |-
      Traceability: CU08
http:
  method: GET
  url: "{{base_url}}/api/v1/testimonio/{{testimony_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns id", function () {
            expect(res.getBody().idTestimony).to.equal(Number(bru.getVar('testimony_id')));
          });
          test("Returns version", function () {
            expect(res.getBody()).to.have.property('version');
            bru.setVar('testimony_version', res.getBody().version);
          });
