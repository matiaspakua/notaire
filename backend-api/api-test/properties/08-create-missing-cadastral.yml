info:
  name: Reject a create without cadastral designation
  type: http
  seq: 8
  description: |-
      ## Reject — POST /api/v1/inmueble without cadastralDesignation
      A property is identified by its nomenclatura catastral; a create
      without it is rejected and nothing is stored (#655).
      Traceability: CU69 (#655)
http:
  method: POST
  url: "{{base_url}}/api/v1/inmueble"
  body:
    type: json
    data: |-
        {"cadastralDesignation": "  ", "address": "Bruno sin nomenclatura"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400", function () { expect(res.getStatus()).to.equal(400); });
          test("Names the missing field", function () { expect(res.getBody().message).to.contain('cadastralDesignation'); });
