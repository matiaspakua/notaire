info:
  name: List properties
  type: http
  seq: 2
  description: |-
      ## List properties — GET /api/v1/inmueble
      Traceability: CU69 (RF #117)
http:
  method: GET
  url: "{{base_url}}/api/v1/inmueble"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Array includes the created property", function () {
            const b = res.getBody();
            expect(b).to.be.an('array');
            expect(b.some(p => p.idProperty === Number(bru.getVar('property_id')))).to.be.true;
          });
