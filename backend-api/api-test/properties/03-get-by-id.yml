info:
  name: Get property by ID
  type: http
  seq: 3
  description: |-
      ## Get property by ID — GET /api/v1/inmueble/{property_id}
      Traceability: CU69 (RF #117)
http:
  method: GET
  url: "{{base_url}}/api/v1/inmueble/{{property_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the created property", function () {
            expect(res.getBody().idProperty).to.equal(Number(bru.getVar('property_id')));
          });
