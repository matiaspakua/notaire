info:
  name: Create Folio
  type: http
  description: |-
      ## Create Folio
      Crea un nuevo folio en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/folio

http:
  method: POST
  url: "{{base_url}}/api/v1/folio"
  body:
    type: json
    data: |-
        numero: 1
        anno: 2025
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

