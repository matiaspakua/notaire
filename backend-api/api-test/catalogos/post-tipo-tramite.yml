info:
  name: Create Tipo Tramite
  type: http
  description: |-
      ## Create Tipo Tramite
      Crea un nuevo tipo de trámite en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/tipo-tramite

http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-tramite"
  body:
    type: json
    data: |-
        nombre: "Tipo de trámite de prueba"
        descripcion: "Descripción del tipo de trámite"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

