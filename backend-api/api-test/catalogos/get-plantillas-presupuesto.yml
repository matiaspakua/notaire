info:
  name: Get All Plantillas Presupuesto
  type: http
  description: |-
      ## Get All Plantillas Presupuesto
      Obtiene todas las plantillas de presupuesto.
      
      **Method:** GET
      **Path:** /api/v1/plantilla-presupuestos

http:
  method: GET
  url: "{{base_url}}/api/v1/plantilla-presupuestos"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
