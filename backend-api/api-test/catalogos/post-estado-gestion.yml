info:
  name: Create Estado Gestion
  type: http
  description: |-
      ## Create Estado Gestion
      Crea un nuevo estado de gestión en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/estado-gestion

http:
  method: POST
  url: "{{base_url}}/api/v1/estado-gestion"
  body:
    type: json
    data: |-
        nombre: "Estado de gestión de prueba"
        descripcion: "Descripción del estado de gestión"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

