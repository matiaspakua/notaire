      ## Get All Tipos de Documento
      Obtiene todos los tipos de documento.
      
      **Method:** GET
      **Path:** /api/v1/tipo-de-documento

http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-de-documento"
  headers:
