info:
  name: Create Tipo Folio
  type: http
  description: |-
      ## Create Tipo Folio
      Crea un nuevo tipo de folio en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/tipo-folio

http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-folio"
  body:
    type: json
    data: |-
        nombre: "Tipo de folio de prueba"
        descripcion: "Descripción del tipo de folio"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

