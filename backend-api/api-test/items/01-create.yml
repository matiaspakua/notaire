info:
  name: Create item
  type: http
  seq: 2
  description: |-
      ## Create item — POST /api/v1/items
      Creates a RECARGO (surcharge) item, which requires a reason, on the setup budget.
      Traceability: CU71, CU45 (RF #4, #7, #8, #9)
http:
  method: POST
  url: "{{base_url}}/api/v1/items"
  body:
    type: json
    data: |-
        {
          "name": "Urgency surcharge",
          "value": 500.0,
          "percentage": 10,
          "type": "RECARGO",
          "reason": "Urgent procedure requested by the client",
          "fixedConcept": false,
          "fkIdBudget": { "idBudget": {{items_budget_id}} }
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores the item id", function () {
            const b = res.getBody();
            expect(b.idItem).to.be.a('number');
            bru.setVar('item_id', b.idItem);
          });
          test("Persists name and type", function () {
            const b = res.getBody();
            expect(b.name).to.equal('Urgency surcharge');
            expect(b.type).to.equal('RECARGO');
          });
