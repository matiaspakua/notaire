info:
  name: Get Item By Id
  type: http
  seq: 5
  description: "## GET /api/v1/items/{id}"
http:
  method: GET
  url: "{{base_url}}/api/v1/items/{{item_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
          test("Returns the correct item", function () {
            expect(res.getBody().idItem).to.equal(bru.getVar('item_id'));
          });
