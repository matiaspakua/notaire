info:
  name: Update Item
  type: http
  seq: 7
  description: "## PUT /api/v1/items/{id}"
http:
  method: PUT
  url: "{{base_url}}/api/v1/items/{{item_id}}"
  body:
    type: json
    data: |-
        {
          "nombre": "Recargo urgencia actualizado",
          "valor": 750.0,
          "porcentaje": 15,
          "tipo": "RECARGO",
          "motivo": "Tramite urgente solicitado por el cliente",
          "conceptoFijo": false,
          "fkIdPresupuesto": { "idPresupuesto": {{_items_presupuesto_id}} }
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
