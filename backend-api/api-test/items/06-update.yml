info:
  name: Update Item
  type: http
  seq: 7
  description: "## PUT /api/v1/items/{id}"
http:
  method: PUT
  url: "{{base_url}}/api/v1/items/{{item_id}}"
  body:
    type: json
    data: |-
        {
          "name": "Recargo urgencia actualizado",
          "value": 750.0,
          "percentage": 15,
          "tipo": "RECARGO",
          "motivo": "Tramite urgente solicitado por el cliente",
          "fixedConcept": false,
          "fkIdBudget": { "idBudget": {{_items_presupuesto_id}} }
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
