info:
  name: Update item
  type: http
  seq: 7
  description: |-
      ## Update item — PUT /api/v1/items/{item_id}
      Traceability: CU71, CU45 (RF #4, #7, #8, #9)
http:
  method: PUT
  url: "{{base_url}}/api/v1/items/{{item_id}}"
  body:
    type: json
    data: |-
        {
          "name": "Urgency surcharge updated",
          "value": 750.0,
          "percentage": 15,
          "type": "RECARGO",
          "reason": "Urgent procedure requested by the client",
          "fixedConcept": false,
          "fkIdBudget": { "idBudget": {{items_budget_id}} }
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
