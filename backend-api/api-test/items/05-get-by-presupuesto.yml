info:
  name: Get Items By Presupuesto
  type: http
  seq: 6
  description: "## GET /api/v1/items/presupuesto/{idPresupuesto}"
http:
  method: GET
  url: "{{base_url}}/api/v1/items/presupuesto/{{_items_presupuesto_id}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
          });
          test("Includes the created item", function () {
            const b = res.getBody();
            expect(b.some(i => i.idItem === bru.getVar('item_id'))).to.be.true;
          });
