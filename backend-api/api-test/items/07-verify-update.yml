info:
  name: Verify item update
  type: http
  seq: 8
  description: |-
      ## Verify item update — GET /api/v1/items/{item_id}
      Traceability: CU71, CU45 (RF #4, #7, #8, #9)
http:
  method: GET
  url: "{{base_url}}/api/v1/items/{{item_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Persists the updated value and name", function () {
            const b = res.getBody();
            expect(b.name).to.equal('Urgency surcharge updated');
            expect(b.value).to.equal(750.0);
          });
