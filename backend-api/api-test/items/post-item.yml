info:
  name: Create Item
  type: http
  description: |-
      ## Create Item
      Crea un nuevo item en el sistema.
      
      **Method:** POST
      **Path:** /api/v1/items

http:
  method: POST
  url: "{{base_url}}/api/v1/items"
  body:
    type: json
    data: |-
        nombre: "Item de prueba"
        valor: 1000.00
        porcentaje: 0
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 or 200", function () {
            expect([200, 201]).to.include(res.getStatus());
          });

