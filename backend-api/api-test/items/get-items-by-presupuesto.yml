info:
  name: Get Items By Presupuesto
  type: http
  description: |-
      ## Get Items By Presupuesto
      Obtiene los items de un presupuesto.
      
      **Method:** GET
      **Path:** /api/v1/items/presupuesto/{idPresupuesto}

http:
  method: GET
  url: "{{base_url}}/api/v1/items/presupuesto/{{presupuesto_id}}"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });
           
          test("Response is array", function () {
            const body = res.getBody();
            expect(body).to.be.an('array');
          });

