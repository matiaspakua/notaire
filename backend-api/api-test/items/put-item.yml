info:
  name: Update Item
  type: http
  description: |-
      ## Update Item
      Actualiza un item existente en el sistema.
      
      **Method:** PUT
      **Path:** /api/v1/items/{id}

http:
  method: PUT
  url: "{{base_url}}/api/v1/items/1"
  body:
    type: json
    data: |-
        nombre: "Item actualizado"
        valor: 2000.00
        porcentaje: 10
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

