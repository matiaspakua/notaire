info:
  name: Login invalid credentials
  type: http
  seq: 2
  description: |-
      ## Negative login — wrong password (issue #686)
      The backend never returns 401 for a bad password on this endpoint — see
      `UsuarioController.login()`, which always responds 200 with
      `valido:false` (or 429 once locked out) so the client can distinguish
      "wrong credentials" from a network/server failure. `JwtAuthIntegrationTest
      .shouldRejectLoginWithWrongPassword` asserts the same contract.
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios/login"
  body:
    type: json
    data: |-
        { "nombre": "admin", "contrasenia": "definitely-wrong" }
  headers:
    - name: Content-Type
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("valido is false", function () { expect(res.getBody().valido).to.equal(false); });
          test("No JWT token is issued", function () {
            expect(res.getBody()).to.not.have.property('token');
          });
