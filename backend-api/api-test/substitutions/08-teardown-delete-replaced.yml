info:
  name: Teardown - Delete replaced person
  type: http
  seq: 10
  description: |-
      ## Teardown — DELETE /api/v1/people/{id}
      Traceability: CU48 (RF #43, #113, #114)
http:
  method: DELETE
  url: "{{base_url}}/api/v1/people/{{replaced_person_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 204 No Content", function () { expect(res.getStatus()).to.equal(204); });
