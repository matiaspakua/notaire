info:
  name: Setup - Create substitute person
  type: http
  seq: 1
  description: |-
      ## Setup — POST /api/v1/people
      Creates the substitute person required by the substitution. The identification
      number is unique per run and the person is deleted by the teardown
      requests at the end of the folder, so repeated runs never collide.
      Traceability: CU48 (RF #43, #113, #114)
http:
  method: POST
  url: "{{base_url}}/api/v1/people"
  body:
    type: json
    data: |-
        {
          "firstName": "Substitute",
          "lastName": "Substitutions E2E",
          "identificationNumber": "{{substitute_document}}",
          "isClient": false,
          "fkIdIdentificationType": { "idIdentificationType": 1 },
          "nationality": "Argentina",
          "maritalStatus": "Soltero",
          "sex": "Femenino"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
          const base = Date.now() % 100000000;
          bru.setVar('substitute_document', String(base).padStart(8, '0'));
          bru.setVar('replaced_document', String((base + 1) % 100000000).padStart(8, '0'));
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Stores the substitute person id", function () {
            const id = res.getBody().personId;
            expect(id).to.be.a('number');
            bru.setVar('substitute_person_id', id);
          });
