info:
  name: Create Concepto
  type: http
  seq: 1
  description: |-
      ## Create Concepto (CU29)
      Crea un nuevo concepto de precio. Captura `concepto_id` para el resto del ciclo.

http:
  method: POST
  url: "{{base_url}}/api/v1/conceptos"
  body:
    type: json
    data: |-
        {
          "nombre": "Concepto E2E",
          "descripcion": "Concepto creado por la suite de API",
          "valor": 1500.50
        }
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status is 201 Created", function () {
            expect(res.getStatus()).to.equal(201);
          });
          test("Body returns the created concepto with idConcepto", function () {
            const b = res.getBody();
            expect(b).to.have.property('idConcepto');
            expect(b.nombre).to.equal('Concepto E2E');
            bru.setVar('concepto_id', b.idConcepto);
          });
          test("Default habilitado is true on create", function () {
            expect(res.getBody().habilitado).to.equal(true);
          });
