info:
  name: Create Concepto
  type: http
  seq: 1
  description: |-
      ## Create Concepto (CU29)
      Crea un nuevo concepto de precio. Captura `concepto_id` para el resto del ciclo.

http:
  method: POST
  url: "{{base_url}}/api/v1/conceptos"
  body:
    type: json
    data: |-
        {
          "name": "Concepto E2E",
                    "value": 1500.50
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status is 201 Created", function () {
            expect(res.getStatus()).to.equal(201);
          });
          test("Body returns the created concepto with idConcept", function () {
            const b = res.getBody();
            expect(b).to.have.property('idConcept');
            expect(b.name).to.equal('Concepto E2E');
            bru.setVar('concepto_id', b.idConcept);
          });
          test("Default enabled is true on create", function () {
            expect(res.getBody().enabled).to.equal(true);
          });
