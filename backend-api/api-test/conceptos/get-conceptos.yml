info:
  name: List Conceptos
  type: http
  seq: 2
  description: "## List Conceptos (CU29) — GET /api/v1/conceptos"

http:
  method: GET
  url: "{{base_url}}/api/v1/conceptos"
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Response is an array", function () { expect(res.getBody()).to.be.an('array'); });
          test("Created concepto is present in the list", function () {
            const id = Number(bru.getVar('concepto_id'));
            const found = res.getBody().some(c => c.idConcepto === id);
            expect(found, 'created concepto should be listed').to.equal(true);
          });
