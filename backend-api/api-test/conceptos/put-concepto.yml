info:
  name: Update Concepto
  type: http
  seq: 4
  description: |-
      ## Update Concepto — PUT /api/v1/conceptos/{id}
      Regression guard for issue #415: payload omits `habilitado` and must not 500.

http:
  method: PUT
  url: "{{base_url}}/api/v1/conceptos/{{concepto_id}}"
  body:
    type: json
    data: |-
        {
          "name": "Concepto E2E Actualizado",
                    "value": 2750.00
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 (no NPE when enabled omitted)", function () {
            expect(res.getStatus()).to.equal(200);
          });
