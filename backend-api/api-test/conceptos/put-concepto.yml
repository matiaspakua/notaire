info:
  name: Update Concepto
  type: http
  description: |-
      ## Update Concepto
      Actualiza un concepto existente en el sistema.
      
      **Method:** PUT
      **Path:** /api/v1/conceptos/{id}

http:
  method: PUT
  url: "{{base_url}}/api/v1/conceptos/1"
  body:
    type: json
    data: |-
        nombre: "Concepto actualizado"
        descripcion: "Descripción actualizada"
        valor: 200.00
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

