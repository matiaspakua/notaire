info:
  name: Update Concepto
  type: http
  seq: 4
  description: |-
      ## Update Concepto — PUT /api/v1/conceptos/{id}
      Regression guard for issue #415: payload omits `habilitado` and must not 500.

http:
  method: PUT
  url: "{{base_url}}/api/v1/conceptos/{{concepto_id}}"
  body:
    type: json
    data: |-
        {
          "nombre": "Concepto E2E Actualizado",
          "descripcion": "Actualizado por la suite",
          "valor": 2750.00
        }
  headers:
    Content-Type: application/json

runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 (no NPE when habilitado omitted)", function () {
            expect(res.getStatus()).to.equal(200);
          });
