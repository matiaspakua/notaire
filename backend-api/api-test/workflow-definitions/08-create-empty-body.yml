info:
  name: Create with empty body is rejected
  type: http
  seq: 8
  description: |-
      ## POST /api/v1/workflow-definition with {} — 400 Bad Request
      The body violates the NOT NULL name constraint, which answers 400 (#579 slice 3) instead of 409. Nothing is stored.
      Traceability: CU76 / CU83 (#579, #655)
http:
  method: POST
  url: "{{base_url}}/api/v1/workflow-definition"
  body:
    type: json
    data: |-
        {}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 400 Bad Request", function () { expect(res.getStatus()).to.equal(400); });
          test("Standard ErrorResponse naming the problem", function () {
            const b = res.getBody();
            expect(b.status).to.equal(400);
            expect(b.message).to.equal("The submitted data violates a database constraint");
          });
