info:
  name: List workflow definitions
  type: http
  seq: 2
  description: |-
      Traceability: CU76 / CU83
http:
  method: GET
  url: "{{base_url}}/api/v1/workflow-definition"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Created definition is listed", function () {
            const id = Number(bru.getVar('wf_def_id'));
            expect(res.getBody().some(x => x.id === id)).to.equal(true);
          });
