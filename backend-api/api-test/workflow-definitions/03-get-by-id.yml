info:
  name: Get workflow definition by ID
  type: http
  seq: 3
  description: |-
      Traceability: CU76 / CU83
http:
  method: GET
  url: "{{base_url}}/api/v1/workflow-definition/{{wf_def_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns requested id", function () {
            expect(res.getBody().id).to.equal(Number(bru.getVar('wf_def_id')));
          });
