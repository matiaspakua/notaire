info:
  name: Verify workflow definition update
  type: http
  seq: 5
  description: |-
      Traceability: CU76 / CU83
http:
  method: GET
  url: "{{base_url}}/api/v1/workflow-definition/{{wf_def_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Name updated", function () {
            expect(String(res.getBody().name)).to.equal(bru.getVar('wf_def_name') + '-upd');
          });
