info:
  name: Create Plantilla Presupuesto
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/api/v1/plantilla-presupuestos"
  body:
    type: json
    data: |-
        {"plantillaPresupuestoPK":{"fkIdTipoTramite":1,"fkIdConcepto":1},"tipoDeTramite":{"idTipoTramite":1},"concepto":{"idConcepto":1},"observaciones":"Test plantilla E2E"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201, 200 or 409", function () { expect([200,201,409]).to.include(res.getStatus()); });
          test("Saves tipo-tramite and concepto IDs", function () {
            bru.setVar('_pp_tipo_tramite', 1);
            bru.setVar('_pp_concepto', 1);
          });
