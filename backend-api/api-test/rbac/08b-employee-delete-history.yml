info:
  name: Employee cannot delete history
  type: http
  seq: 10
  description: |-
      ## Employee changing the audit trail is forbidden — DELETE /api/v1/historial/{id}
      Only an administrator may rewrite or delete a history row (CU13).
      The id does not exist, so nothing changes even if the rule regressed.
      Traceability: CU78 (issue #1250)
http:
  method: DELETE
  url: "{{base_url}}/api/v1/historial/999999999"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{employee_token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 403 Forbidden", function () { expect(res.getStatus()).to.equal(403); });
