info:
  name: Employee cannot read the audit log
  type: http
  seq: 6
  description: |-
      ## Employee reads the audit log is forbidden — GET /api/v1/audit-log
      Traceability: CU78 (issue #559)
http:
  method: GET
  url: "{{base_url}}/api/v1/audit-log"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{employee_token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 403 Forbidden", function () { expect(res.getStatus()).to.equal(403); });
