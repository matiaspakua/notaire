info:
  name: Search budgets by status
  type: http
  seq: 5
  description: |-
      ## Search budgets by status — GET /api/v1/presupuestos/buscar?status=Pendiente
      Traceability: CU60 (RF #4, #5, #7)
http:
  method: GET
  url: "{{base_url}}/api/v1/presupuestos/buscar?status=Pendiente"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Finds the created budget by its status", function () {
            const id = Number(bru.getVar('budget_id'));
            expect(res.getBody().some(p => p.idBudget === id)).to.equal(true);
          });
