info:
  name: Create budget
  type: http
  seq: 1
  description: |-
      ## Create budget — POST /api/v1/presupuestos
      Uses seeded person 1 (referenced only, never modified).
      Traceability: CU01 (RF #4, #5, #7, #9)
http:
  method: POST
  url: "{{base_url}}/api/v1/presupuestos"
  body:
    type: json
    data: |-
        {
          "person": { "personId": 1 },
          "date": "2026-06-02",
          "encabezado": "E2E Budget",
          "status": "Pendiente",
          "notes": "created by the E2E suite"
        }
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idBudget", function () {
            const b = res.getBody();
            expect(b).to.have.property('idBudget');
            bru.setVar('budget_id', b.idBudget);
          });
