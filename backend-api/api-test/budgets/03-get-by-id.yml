info:
  name: Get budget by ID
  type: http
  seq: 3
  description: |-
      ## Get budget by ID — GET /api/v1/presupuestos/{budget_id}
      Traceability: CU60 (RF #4, #5, #7)
http:
  method: GET
  url: "{{base_url}}/api/v1/presupuestos/{{budget_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the budget", function () { expect(res.getBody().idBudget).to.equal(Number(bru.getVar('budget_id'))); });
