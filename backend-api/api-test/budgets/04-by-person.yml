info:
  name: List budgets by person
  type: http
  seq: 4
  description: |-
      ## List budgets by person — GET /api/v1/presupuestos/persona/1
      Traceability: CU60 (RF #4, #5, #7)
http:
  method: GET
  url: "{{base_url}}/api/v1/presupuestos/persona/1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 OK", function () { expect(res.getStatus()).to.equal(200); });
          test("Contains the created budget", function () {
            const id = Number(bru.getVar('budget_id'));
            expect(res.getBody().some(p => p.idBudget === id)).to.equal(true);
          });
