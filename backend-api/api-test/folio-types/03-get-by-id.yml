info:
  name: Get folio type by ID
  type: http
  seq: 3
  description: |-
      Traceability: CU68 (RF #55, #94, #119)
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-folio/{{folio_type_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Returns the requested item", function () {
            expect(res.getBody().idFolioType).to.equal(Number(bru.getVar('folio_type_id')));
          });
