info:
  name: List folio types
  type: http
  seq: 2
  description: |-
      Traceability: CU68 (RF #55, #94, #119)
http:
  method: GET
  url: "{{base_url}}/api/v1/tipo-folio"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Response is an array", function () { expect(res.getBody()).to.be.an('array'); });
          test("Created item is in the list", function () {
            const id = Number(bru.getVar('folio_type_id'));
            expect(res.getBody().some(x => x.idFolioType === id)).to.equal(true);
          });
