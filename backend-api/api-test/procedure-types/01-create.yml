info:
  name: Create procedure type
  type: http
  seq: 1
  description: |-
      Traceability: CU26 (RF #55, #56)
http:
  method: POST
  url: "{{base_url}}/api/v1/tipo-tramite"
  body:
    type: json
    data: |-
        {"name":"E2E Procedure Type","notes":"e2e procedure","isArchived":false,"isRegistered":false}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idProcedureType", function () {
            const b = res.getBody();
            expect(b).to.have.property('idProcedureType');
            bru.setVar('procedure_type_id', b.idProcedureType);
          });
