info:
  name: Verify management status update
  type: http
  seq: 5
  description: |-
      Traceability: CU35 (RF #55, #59, #107, #108, #109)
http:
  method: GET
  url: "{{base_url}}/api/v1/estado-gestion/{{management_status_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Update persisted (name)", function () {
            expect(String(res.getBody().name)).to.equal('E2E Management Status Updated');
          });
