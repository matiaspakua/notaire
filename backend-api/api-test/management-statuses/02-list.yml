info:
  name: List management statuses
  type: http
  seq: 2
  description: |-
      Traceability: CU67 (RF #55, #59, #107, #108)
http:
  method: GET
  url: "{{base_url}}/api/v1/estado-gestion"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Response is an array", function () { expect(res.getBody()).to.be.an('array'); });
          test("Created item is in the list", function () {
            const id = Number(bru.getVar('management_status_id'));
            expect(res.getBody().some(x => x.idManagementStatus === id)).to.equal(true);
          });
