info:
  name: Update management status
  type: http
  seq: 4
  description: |-
      Traceability: CU35 (RF #55, #59, #107, #108, #109)
http:
  method: PUT
  url: "{{base_url}}/api/v1/estado-gestion/{{management_status_id}}"
  body:
    type: json
    data: |-
        {"name":"E2E Management Status Updated","notes":"upd"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 or 204", function () { expect([200,204]).to.include(res.getStatus()); });
