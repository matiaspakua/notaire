info:
  name: Update user
  type: http
  seq: 7
  description: |-
      ## Update user — PUT /api/v1/usuarios/{api_user_id}
      Traceability: CU21 (RF #43, #47, #82, #83)
http:
  method: PUT
  url: "{{base_url}}/api/v1/usuarios/{{api_user_id}}"
  body:
    type: json
    data: |-
        {"name": "{{api_user_name}}", "type": "ADMIN", "active": true}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
