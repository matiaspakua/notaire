info:
  name: List users
  type: http
  seq: 4
  description: |-
      ## List users — GET /api/v1/usuarios
      Traceability: CU20 (RF #43, #44, #45, #82, #83)
http:
  method: GET
  url: "{{base_url}}/api/v1/usuarios"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Created user is listed", function () {
            const id = Number(bru.getVar('api_user_id'));
            expect(res.getBody().some(u => u.idUser === id)).to.equal(true);
          });
