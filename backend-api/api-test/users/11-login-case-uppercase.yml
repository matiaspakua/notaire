info:
  name: Login with uppercase username (case-insensitive)
  type: http
  seq: 11
  description: |-
      ## Login with uppercase username (case-insensitive) — POST /api/v1/usuarios/login
      Traceability: CU78 (RF #81, #82, #83, #84, #85)
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios/login"
  body:
    type: json
    data: |-
        {"name": "{{case_user_login}}", "password": "Test1234!"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
          bru.setVar('case_user_login', bru.getVar('case_user_name').toUpperCase());
    - type: tests
      code: |-
          test("Status 200", function () { expect(res.getStatus()).to.equal(200); });
          test("Uppercase username logs in", function () { expect(res.getBody().valido).to.equal(true); });
