info:
  name: Create user
  type: http
  seq: 1
  description: |-
      ## Create user — POST /api/v1/usuarios
      Username is unique per run; deleted by `08-delete.yml`.
      Traceability: CU20 (RF #43, #44, #45, #82, #83)
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios"
  body:
    type: json
    data: |-
        {"name": "{{api_user_name}}", "password": "Test1234!", "type": "EMPLEADO", "active": true}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
          bru.setVar('api_user_name', 'apitest-user-' + Date.now());
    - type: tests
      code: |-
          test("Status 201 Created", function () { expect(res.getStatus()).to.equal(201); });
          test("Returns idUser", function () {
            const b = res.getBody();
            expect(b).to.have.property('idUser');
            bru.setVar('api_user_id', b.idUser);
          });
          test("Password is not stored in plain text", function () {
            expect(res.getBody().password).to.not.equal('Test1234!');
          });
