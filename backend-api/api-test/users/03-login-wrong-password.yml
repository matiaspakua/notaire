info:
  name: Login with wrong password
  type: http
  seq: 3
  description: |-
      ## Login with wrong password — POST /api/v1/usuarios/login
      Traceability: CU78 (RF #81, #82, #83, #84, #85)
http:
  method: POST
  url: "{{base_url}}/api/v1/usuarios/login"
  body:
    type: json
    data: |-
        {"name": "{{api_user_name}}", "password": "WRONG"}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
          test("Status 200 or 400", function () { expect([200, 400]).to.include(res.getStatus()); });
          test("valido is false for wrong credentials", function () {
            const b = res.getBody();
            if (b && b.valido !== undefined) expect(b.valido).to.equal(false);
          });
