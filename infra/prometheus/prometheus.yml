global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files to load
rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          app: 'prometheus'

  # --- Notaire Backend API (Spring Boot Actuator + Micrometer) ---
  - job_name: 'notaire-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    scheme: http
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'notaire'
          app: 'backend-api'
          environment: 'development'
          module: 'backend-api'

  # --- Notaire PostgreSQL Database ---
  - job_name: 'notaire-postgres'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'notaire'
          app: 'postgresql'
          environment: 'development'
          module: 'database'

  # --- Notaire Shared Module Metrics ---
  - job_name: 'notaire-shared'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    scrape_timeout: 5s
    scheme: http
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'notaire'
          app: 'shared-module'
          environment: 'development'
          module: 'notaire-shared'

  # --- Docker Engine Metrics ---
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          service: 'infrastructure'
          app: 'docker'

  # --- All Notaire Services via Docker labels (auto-discovery) ---
  - job_name: 'notaire-docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'notaire-(.+)'
        target_label: 'container'
        replacement: 'notaire-$1'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '(.+)'
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_network_mode']
        regex: '(.+)'
        target_label: 'network'
