global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files to load
rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          app: 'prometheus'

  # --- Notaire Backend API (Spring Boot Actuator + Micrometer) ---
  - job_name: 'notaire-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    scheme: http
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['notary-backend:8080']
        labels:
          service: 'notaire'
          app: 'backend-api'
          environment: 'development'
          module: 'backend-api'

  # --- Notaire PostgreSQL Database ---
  - job_name: 'notaire-postgres'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'notaire'
          app: 'postgresql'
          environment: 'development'
          module: 'database'

  # --- Observability self-metrics (Grafana + Loki expose /metrics) ---
  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['devsecops-grafana:3000']
        labels:
          service: 'monitoring'
          app: 'grafana'

  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['devsecops-loki:3100']
        labels:
          service: 'monitoring'
          app: 'loki'
