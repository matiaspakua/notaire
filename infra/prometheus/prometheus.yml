global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'notary-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'notary-postgres'
    static_configs:
      - targets: ['postgres:5432'] # Requires postgres-exporter to be fully useful, but we'll leave it for now
