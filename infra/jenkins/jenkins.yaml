jenkins:
  systemMessage: "Notaire CI/CD Pipeline - Managed by Jenkins Configuration as Code\n"
  numExecutors: 2
  scmCheckoutRetryCount: 3
  mode: NORMAL

  # Security Configuration
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "admin"
          password: "admin"
          name: "Admin User"
          description: "Notaire Jenkins Administrator"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # Global Environment Variables
  globalNodeProperties:
    - envVars:
        env:
          - key: "JAVA_HOME"
            value: "/opt/java/openjdk"
          - key: "SONAR_HOST_URL"
            value: "http://sonarqube:9000"
          - key: "NEXUS_URL"
            value: "http://nexus:8081"
          - key: "NOTAIRE_DB_URL"
            value: "jdbc:postgresql://notary-postgres:5432/notaire"
          - key: "NOTAIRE_DB_USER"
            value: "admin"
          - key: "NOTAIRE_DB_PASSWORD"
            value: "admin"
          - key: "BACKEND_API_URL"
            value: "http://notary-backend:8080"
          - key: "PROMETHEUS_URL"
            value: "http://prometheus:9090"
          - key: "GRAFANA_URL"
            value: "http://grafana:3000"
          - key: "LOKI_URL"
            value: "http://loki:3100"

  # Views
  views:
    - list:
        name: "Notaire"
        description: "Notaire Project Pipelines"
        filterExecutors: true
        filterQueue: true
        includeRegex: "notaire-.*"

  slaveAgentPort: 50000

tool:
  git:
    installations:
      - name: "Default"
        home: "/usr/bin/git"
  maven:
    installations:
      - name: "Maven 3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"
  jdk:
    installations:
      - name: "JDK21"
        home: "/opt/java/openjdk"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "changeme-sonar-token"
              description: "SonarQube authentication token"
          - string:
              scope: GLOBAL
              id: "docker-hub-token"
              secret: "changeme-docker-hub-token"
              description: "Docker Hub access token"
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-credentials"
              username: "admin"
              password: "admin123"
              description: "Nexus Repository credentials"
          - usernamePassword:
              scope: GLOBAL
              id: "notaire-db-credentials"
              username: "admin"
              password: "admin"
              description: "Notaire database credentials"

unclassified:
  location:
    url: "http://localhost:8082/"
  buildDiscarders:
    configuredBuildDiscarders:
      - "jobBuildDiscarder"
