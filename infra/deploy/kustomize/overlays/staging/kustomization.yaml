# Staging overlay (#901) — GHCR semver image tags for backend/frontend.
# Tags move with release-please on the same cut as Maven and npm.
#
#   kubectl apply -k infra/deploy/kustomize/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notaire

resources:
  - ../../base

images:
  - name: notaire-backend
    newName: ghcr.io/matiaspakua/notaire/backend
    newTag: 0.2.1 # x-release-please-version
  - name: notaire-frontend
    newName: ghcr.io/matiaspakua/notaire/frontend
    newTag: 0.2.1 # x-release-please-version

labels:
  - pairs:
      environment: staging
      app.kubernetes.io/version: 0.2.1 # x-release-please-version
    includeSelectors: false
    includeTemplates: true

patches:
  - target:
      kind: Namespace
      name: notaire
    patch: |-
      - op: add
        path: /metadata/labels/environment
        value: staging
