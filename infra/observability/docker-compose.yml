# Project name is pinned so volumes and networks keep their historical
# infra_* names regardless of this file's directory.
name: infra

services:
  # --- CENTRALIZED DASHBOARD ---
  dashboard:
    image: b4bz/homer:v26.08.3
    container_name: devsecops-dashboard
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./dashboard/config.yml:/www/assets/config.yml
    networks:
      - devsecops-network
      - notaire-app-network

  # Local security case reports (issue #1506). The catalog runner writes
  # reports/security/latest; this server only publishes that directory.
  security-reports:
    image: nginx:1.27.5-alpine
    container_name: devsecops-security-reports
    restart: unless-stopped
    ports:
      - "8890:80"
    volumes:
      - ./security-reports/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-reports/index.html:/usr/share/nginx/html/index.html:ro
      - ../../reports/security:/usr/share/nginx/html/reports:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      service: "security-reports"
      app: "devsecops"
    networks:
      - devsecops-network

  # --- SECURITY & QUALITY ---
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: devsecops-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      service: "sonarqube"
      app: "devsecops"
    networks:
      - devsecops-network

  sonar-db:
    image: postgres:15.19
    container_name: devsecops-sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=${SONAR_DB_USER:-sonar}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    labels:
      service: "sonarqube-db"
      app: "devsecops"
    networks:
      - devsecops-network

  # --- OBSERVABILITY ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: devsecops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - ./prometheus/alert-rules-stack.yml:/etc/prometheus/alert-rules-stack.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - postgres-exporter
      - blackbox-exporter
      - otel-collector
      - alertmanager
    labels:
      service: "prometheus"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  # --- PostgreSQL Exporter for Database Metrics ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: devsecops-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      # Least-privilege role (pg_monitor only), created by Flyway migration
      # V12 — NOT the app's own admin datasource credentials (issue #675).
      # sslmode is still "disable": the notary-postgres container has no TLS
      # configured yet, tracked separately by issue #684.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_USER:-notaire_exporter}:${POSTGRES_EXPORTER_PASSWORD:-admin}@notary-postgres:5432/${POSTGRES_DB:-notaire}?sslmode=disable"
    volumes:
      - ./prometheus/postgres_exporter.yml:/etc/postgres_exporter/queries.yml
    labels:
      service: "postgres-exporter"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  # --- Availability probes (HTTP/TCP) for every stack service ---
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: devsecops-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    labels:
      service: "blackbox-exporter"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  # --- OpenTelemetry Collector: single OTLP ingress; Prometheus scrapes :8889 ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: devsecops-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yml']
    depends_on:
      - tempo
    volumes:
      - ./otel/collector.yml:/etc/otelcol/config.yml:ro
    labels:
      service: "otel-collector"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  # --- Alert routing (local only; no external notification channel) ---
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: devsecops-alertmanager
    restart: unless-stopped
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager']
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    labels:
      service: "alertmanager"
      app: "monitoring"
    networks:
      - devsecops-network

  # --- Trace store (receives OTLP from the collector) ---
  tempo:
    image: grafana/tempo:2.10.8
    container_name: devsecops-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yml']
    user: root
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    labels:
      service: "tempo"
      app: "monitoring"
    networks:
      - devsecops-network

  # --- Host (Docker VM) metrics ---
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: devsecops-node-exporter
    restart: unless-stopped
    command: ['--path.rootfs=/host']
    volumes:
      - /:/host:ro
    labels:
      service: "node-exporter"
      app: "monitoring"
    networks:
      - devsecops-network

  # --- Container metrics (read-only host mounts, no Docker socket) ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: devsecops-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    labels:
      service: "cadvisor"
      app: "monitoring"
    networks:
      - devsecops-network

  grafana:
    image: grafana/grafana:12.3.11
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      service: "grafana"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  loki:
    image: grafana/loki:3.7.8
    container_name: devsecops-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      service: "loki"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  promtail:
    image: grafana/promtail:3.6.11
    container_name: devsecops-promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    depends_on:
      - loki
    labels:
      service: "promtail"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

networks:
  devsecops-network:
    driver: bridge
  notaire-app-network:
    external: true
    name: notaire_notary-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:
