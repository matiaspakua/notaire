# Local-only routing: alerts are grouped and visible in the Alertmanager UI and Grafana.
# No external channel is configured (that needs credentials: an owner decision).
route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['service']
