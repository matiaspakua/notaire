[server]
http_port = 3000
domain = localhost
root_url = http://localhost:3001
enable_gzip = true

[security]
# admin_user / admin_password are intentionally NOT set here — they are
# injected at container start via GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
# (see infra/observability/docker-compose.yml), sourced from GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD
# in .env (issue #672). Do not hardcode credentials in this file.
secret_key = SW2YcwTIb9zpOOhoPsMm

[auth]
# Local stack only (#1413): anonymous Admin opens dashboards without a login form.
# Ports are bound to 127.0.0.1 in observability/docker-compose.yml.
disable_login_form = true
disable_signout_menu = false
login_cookie_name = grafana_session

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[users]
default_theme = dark
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Admin

[metrics]
enabled = true
interval_seconds = 10

[analytics]
check_for_updates = false
reporting_enabled = false

[log]
mode = console file
level = info

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
