# Custom queries for postgres-exporter (--extend.query-path / PG_EXPORTER_EXTEND_QUERY_PATH).
# Format: metric-group key -> query + metrics (see prometheus-community/postgres_exporter queries.yaml).
# Built-in collectors (pg_stat_database, settings, …) stay enabled by default; this file only adds Notaire business and connection-state gauges.

deeds_total:
  query: |
    SELECT status::text AS status, COUNT(*)::float AS deeds_total
    FROM deeds
    GROUP BY status
  metrics:
    - status:
        usage: "LABEL"
        description: "Deed status"
    - deeds_total:
        usage: "GAUGE"
        description: "Total number of deeds by status"

budgets_total:
  query: |
    SELECT COUNT(*)::float AS budgets_total FROM budgets
  metrics:
    - budgets_total:
        usage: "GAUGE"
        description: "Total number of budgets"

users_total:
  query: |
    SELECT COUNT(*)::float AS users_total FROM users
  metrics:
    - users_total:
        usage: "GAUGE"
        description: "Total number of users"

people_total:
  query: |
    SELECT COUNT(*)::float AS people_total FROM people
  metrics:
    - people_total:
        usage: "GAUGE"
        description: "Total number of people"

pg_connections_total:
  query: |
    SELECT COALESCE(state, 'unknown')::text AS state, COUNT(*)::float AS pg_connections_total
    FROM pg_stat_activity
    WHERE datname = current_database()
    GROUP BY state
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - pg_connections_total:
        usage: "GAUGE"
        description: "Number of connections by state"
