# Custom queries for postgres-exporter (--extend.query-path / PG_EXPORTER_EXTEND_QUERY_PATH).
# Format: metric-group key -> query + metrics (see prometheus-community/postgres_exporter queries.yaml).
# Built-in collectors (pg_stat_database, settings, …) stay enabled by default; this file only adds Notaire business and connection-state gauges.
#
# Naming (#1746): scraped series = {group}_{gauge_column}. Use group without `_total` and
# gauge column `total` so Grafana PromQL (`deeds_total`, `pg_connections_total`, …) matches
# without the double-prefix (`deeds_total_deeds_total`) that empty panels saw on Mac smoke.

deeds:
  query: |
    SELECT COALESCE(status::text, 'unknown') AS status, COUNT(*)::float AS total
    FROM deeds
    GROUP BY status
  metrics:
    - status:
        usage: "LABEL"
        description: "Deed status"
    - total:
        usage: "GAUGE"
        description: "Total number of deeds by status"

budgets:
  query: |
    SELECT COUNT(*)::float AS total FROM budgets
  metrics:
    - total:
        usage: "GAUGE"
        description: "Total number of budgets"

users:
  query: |
    SELECT COUNT(*)::float AS total FROM users
  metrics:
    - total:
        usage: "GAUGE"
        description: "Total number of users"

people:
  query: |
    SELECT COUNT(*)::float AS total FROM people
  metrics:
    - total:
        usage: "GAUGE"
        description: "Total number of people"

pg_connections:
  query: |
    SELECT COALESCE(state, 'unknown')::text AS state, COUNT(*)::float AS total
    FROM pg_stat_activity
    WHERE datname = current_database()
    GROUP BY state
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - total:
        usage: "GAUGE"
        description: "Number of connections by state"
