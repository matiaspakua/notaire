global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files to load
rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          app: 'prometheus'

  # --- Notaire Backend API (Spring Boot Actuator + Micrometer) ---
  - job_name: 'notaire-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    scheme: http
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['notary-backend:8080']
        labels:
          service: 'notaire'
          app: 'backend-api'
          environment: 'development'
          module: 'backend-api'

  # --- Notaire PostgreSQL Database ---
  - job_name: 'notaire-postgres'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'notaire'
          app: 'postgresql'
          environment: 'development'
          module: 'database'

  # --- Observability self-metrics (Grafana + Loki expose /metrics) ---
  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['devsecops-grafana:3000']
        labels:
          service: 'monitoring'
          app: 'grafana'

  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['devsecops-loki:3100']
        labels:
          service: 'monitoring'
          app: 'loki'

  # --- Availability probes (blackbox exporter): one probe_success series per
  # service, labelled with a stable `service` name. No credentials: only
  # unauthenticated readiness endpoints or bare TCP ports are probed.
  - job_name: 'probe-frontend'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://notaire-frontend:3000/']
        labels:
          service: 'frontend'
          scope: 'notaire'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'frontend'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-backend'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://notary-backend:8080/actuator/health/liveness']
        labels:
          service: 'backend'
          scope: 'notaire'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'backend'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-postgres'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['notary-postgres:5432']
        labels:
          service: 'postgres'
          scope: 'notaire'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'postgres'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-pgadmin'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://notary-pgadmin:80/']
        labels:
          service: 'pgadmin'
          scope: 'notaire'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'pgadmin'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-prometheus'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://prometheus:9090/-/healthy']
        labels:
          service: 'prometheus'
          scope: 'stack'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'prometheus'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-grafana'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://devsecops-grafana:3000/api/health']
        labels:
          service: 'grafana'
          scope: 'stack'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'grafana'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-loki'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://devsecops-loki:3100/ready']
        labels:
          service: 'loki'
          scope: 'stack'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'loki'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-promtail'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://promtail:9080/ready']
        labels:
          service: 'promtail'
          scope: 'stack'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'promtail'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-sonarqube'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://devsecops-sonarqube:9000/api/system/status']
        labels:
          service: 'sonarqube'
          scope: 'stack'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'sonarqube'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-sonar-db'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['devsecops-sonar-db:5432']
        labels:
          service: 'sonar-db'
          scope: 'stack'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: 'sonar-db'
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: 'probe-homer'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://dashboard:8080/']
        labels:
