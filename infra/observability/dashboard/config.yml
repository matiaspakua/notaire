    icon: "fas fa-file-signature"
    items:
      - name: "Frontend"
        logo: "https://nextjs.org/favicon.ico"
        subtitle: "Next.js Web Application"
        tag: "App"
        url: "http://localhost:3000"
      - name: "Backend API"
        logo: "https://spring.io/favicon.ico"
        subtitle: "Spring Boot REST API (Swagger UI)"
        tag: "App"
        url: "http://localhost:8080/swagger-ui.html"
      - name: "Audit Module"
        logo: "https://spring.io/favicon.ico"
        subtitle: "Business operation audit log (UI)"
        tag: "App"
        url: "http://localhost:3000/dashboard/audit"
      - name: "pgAdmin"
        logo: "https://www.pgadmin.org/static/COMPILED/assets/img/favicon.ico"
        subtitle: "Database Management"
        tag: "Database"
        url: "http://localhost:5050"
      - name: "Health Check"
        logo: "https://spring.io/favicon.ico"
        subtitle: "System Health Status"
        tag: "Health"
        url: "http://localhost:8080/actuator/health"

