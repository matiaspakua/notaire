# Homer Configuration
# See https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md

title: "Notaire DevSecOps Hub"
subtitle: "Infrastructure Control Center"
logo: "https://raw.githubusercontent.com/matiaspakua/notaire/main/images/logoRojoLetraMediano.png"

header: true
footer: '<p>Built with love for Notaire S-SDLC | Credentials live in the local <b>.env</b> file</p>'

columns: "3"

connectivity_test: true

links:
  - name: "Project Repo"
    icon: "fab fa-github"
    url: "https://github.com/matiaspakua/notaire"
  - name: "Documentation"
    icon: "fas fa-book"
    url: "https://github.com/matiaspakua/notaire/tree/main/docs"
  - name: "Monitoring Guide"
    icon: "fas fa-chart-line"
    url: "http://localhost:3001"

services:
  - name: "Notaire Application"
    icon: "fas fa-file-signature"
    items:
      - name: "Frontend"
        logo: "https://nextjs.org/favicon.ico"
        subtitle: "Next.js Web Application"
        tag: "UI"
        url: "http://localhost:3000"
      - name: "Backend API"
        logo: "https://spring.io/favicon.ico"
        subtitle: "Spring Boot REST API"
        tag: "API"
        url: "http://localhost:8080/swagger-ui.html"
      - name: "Audit Module"
        logo: "https://nextjs.org/favicon.ico"
        subtitle: "Business operation audit log (UI)"
        tag: "Audit"
        url: "http://localhost:3000/dashboard/auditoria"
      - name: "pgAdmin"
        logo: "https://www.pgadmin.org/favicon.ico"
        subtitle: "Database Management"
        tag: "Admin"
        url: "http://localhost:5050"

  - name: "Security & Quality"
    icon: "fas fa-shield-alt"
    items:
      - name: "SonarQube"
        logo: "https://www.sonarqube.org/favicon.ico"
        subtitle: "SAST & Code Quality"
        tag: "Static"
        url: "http://localhost:9000"

  - name: "Observability"
    icon: "fas fa-chart-line"
    items:
      - name: "Grafana"
        logo: "https://grafana.com/favicon.ico"
        subtitle: "Dashboards & Logs"
        tag: "Metrics"
        url: "http://localhost:3001"
      - name: "Prometheus"
        logo: "https://prometheus.io/favicon.ico"
        subtitle: "Metrics Scraper"
        tag: "Database"
        url: "http://localhost:9090"
      - name: "Loki"
        logo: "https://grafana.com/favicon.ico"
        subtitle: "Log Aggregator"
        tag: "Logs"
        url: "http://localhost:3100"

  - name: "Notaire Monitoring"
    icon: "fas fa-heartbeat"
    items:
      - name: "Backend Dashboard"
        logo: "https://grafana.com/favicon.ico"
        subtitle: "Spring Boot Metrics"
        tag: "Grafana"
        url: "http://localhost:3001/d/notaire-backend"
      - name: "DB Dashboard"
        logo: "https://grafana.com/favicon.ico"
        subtitle: "PostgreSQL Metrics"
        tag: "Grafana"
        url: "http://localhost:3001/d/notaire-postgres"
      - name: "Logs Dashboard"
        logo: "https://grafana.com/favicon.ico"
        subtitle: "Backend & Frontend Logs (Loki)"
        tag: "Grafana"
        url: "http://localhost:3001/d/notaire-logs"
      - name: "Health Check"
        logo: "https://spring.io/favicon.ico"
        subtitle: "System Health Status"
        tag: "Status"
        url: "http://localhost:8080/actuator/health"
