server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape container logs via Docker socket (works on macOS Docker Desktop)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - notaire
              - notary
              - devsecops
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_service']
        regex: '(.+)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_app']
        regex: '(.+)'
        target_label: 'app'
      - action: replace
        source_labels: ['__meta_docker_container_name']
        target_label: 'container_name'
        regex: '/(.+)'
        replacement: '$1'
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
      - labels:
          level:
      - output:
          source: message

  # System logs inside the promtail container itself (not host logs on macOS)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/**/*.log
