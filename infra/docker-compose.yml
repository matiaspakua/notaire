services:
  # --- CENTRALIZED DASHBOARD ---
  dashboard:
    image: b4bz/homer:latest
    container_name: devsecops-dashboard
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./dashboard/config.yml:/www/assets/config.yml
    networks:
      - devsecops-network

  # --- SECURITY & QUALITY ---
  sonarqube:
    image: sonarqube:community
    container_name: devsecops-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - devsecops-network

  sonar-db:
    image: postgres:15
    container_name: devsecops-sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - devsecops-network

  dependency-track-api:
    image: dependencytrack/apiserver
    container_name: devsecops-dtrack-api
    restart: unless-stopped
    ports:
      - "8083:8081"
    volumes:
      - dtrack_data:/data
    networks:
      - devsecops-network

  dependency-track-frontend:
    image: dependencytrack/frontend
    container_name: devsecops-dtrack-frontend
    restart: unless-stopped
    depends_on:
      - dependency-track-api
    environment:
      - API_BASE_URL=http://localhost:8083
    ports:
      - "8085:8080"
    networks:
      - devsecops-network

  # --- CI/CD & ARTIFACTS ---
  jenkins:
    image: jenkins/jenkins:lts
    container_name: devsecops-jenkins
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root # Needed to access docker socket
    networks:
      - devsecops-network
      - notary-network

  nexus:
    image: sonatype/nexus3
    container_name: devsecops-nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - devsecops-network

  # --- OBSERVABILITY ---
  prometheus:
    image: prom/prometheus:latest
    container_name: devsecops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - devsecops-network
      - notary-network

  grafana:
    image: grafana/grafana:latest
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - devsecops-network

  loki:
    image: grafana/loki:latest
    container_name: devsecops-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
    networks:
      - devsecops-network

  promtail:
    image: grafana/promtail:latest
    container_name: devsecops-promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - devsecops-network

networks:
  devsecops-network:
    driver: bridge
  notary-network:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  jenkins_data:
  nexus_data:
  prometheus_data:
  grafana_data:
  dtrack_data:
