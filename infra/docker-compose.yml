services:
  # --- CENTRALIZED DASHBOARD ---
  dashboard:
    image: b4bz/homer:latest
    container_name: devsecops-dashboard
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./dashboard/config.yml:/www/assets/config.yml
    networks:
      - devsecops-network
      - notaire-app-network

  # --- SECURITY & QUALITY ---
  sonarqube:
    image: sonarqube:community
    container_name: devsecops-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
    labels:
      service: "sonarqube"
      app: "devsecops"
    networks:
      - devsecops-network

  sonar-db:
    image: postgres:15
    container_name: devsecops-sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    labels:
      service: "sonarqube-db"
      app: "devsecops"
    networks:
      - devsecops-network

  dependency-track-api:
    image: dependencytrack/apiserver
    container_name: devsecops-dtrack-api
    restart: unless-stopped
    ports:
      - "8083:8081"
    volumes:
      - dtrack_data:/data
    labels:
      service: "dependency-track-api"
      app: "devsecops"
    networks:
      - devsecops-network

  dependency-track-frontend:
    image: dependencytrack/frontend
    container_name: devsecops-dtrack-frontend
    restart: unless-stopped
    depends_on:
      - dependency-track-api
    environment:
      - API_BASE_URL=http://localhost:8083
    ports:
      - "8085:8080"
    labels:
      service: "dependency-track"
      app: "devsecops"
    networks:
      - devsecops-network

  # --- CI/CD & ARTIFACTS ---
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: devsecops-jenkins:local
    container_name: devsecops-jenkins
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace/notaire:cached
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/usr/share/jenkins/ref/jenkins.yaml
      - SONAR_TOKEN=
      - DOCKER_HUB_TOKEN=
    user: root
    labels:
      service: "jenkins"
      app: "devsecops"
    networks:
      - devsecops-network
      - notaire-app-network

  nexus:
    image: sonatype/nexus3
    container_name: devsecops-nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    labels:
      service: "nexus"
      app: "devsecops"
    networks:
      - devsecops-network

  # --- OBSERVABILITY ---
  prometheus:
    image: prom/prometheus:latest
    container_name: devsecops-prometheus
    restart: unless-stopped
    user: root
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - postgres-exporter
    labels:
      service: "prometheus"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  # --- PostgreSQL Exporter for Database Metrics ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: devsecops-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin@notary-postgres:5432/notaire?sslmode=disable"
    volumes:
      - ./prometheus/postgres_exporter.yml:/etc/postgres_exporter/queries.yml
    labels:
      service: "postgres-exporter"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  grafana:
    image: grafana/grafana:latest
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
      - loki
    labels:
      service: "grafana"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  loki:
    image: grafana/loki:latest
    container_name: devsecops-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      service: "loki"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  promtail:
    image: grafana/promtail:latest
    container_name: devsecops-promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    depends_on:
      - loki
    labels:
      service: "promtail"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

networks:
  devsecops-network:
    driver: bridge
  notaire-app-network:
    external: true
    name: notaire_notary-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  jenkins_data:
  nexus_data:
  prometheus_data:
  grafana_data:
  dtrack_data:
  loki_data:
