services:
  # --- CENTRALIZED DASHBOARD ---
  dashboard:
    image: b4bz/homer:latest
    container_name: devsecops-dashboard
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./dashboard/config.yml:/www/assets/config.yml
    networks:
      - devsecops-network
      - notaire-app-network

  # --- SECURITY & QUALITY ---
  sonarqube:
    image: sonarqube:community
    container_name: devsecops-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      service: "sonarqube"
      app: "devsecops"
    networks:
      - devsecops-network

  sonar-db:
    image: postgres:15
    container_name: devsecops-sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=${SONAR_DB_USER:-sonar}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    labels:
      service: "sonarqube-db"
      app: "devsecops"
    networks:
      - devsecops-network

  # --- OBSERVABILITY ---
  prometheus:
    image: prom/prometheus:latest
    container_name: devsecops-prometheus
    restart: unless-stopped
    user: root
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - postgres-exporter
    labels:
      service: "prometheus"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  # --- PostgreSQL Exporter for Database Metrics ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: devsecops-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@notary-postgres:5432/${POSTGRES_DB:-notaire}?sslmode=disable"
    volumes:
      - ./prometheus/postgres_exporter.yml:/etc/postgres_exporter/queries.yml
    labels:
      service: "postgres-exporter"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  grafana:
    image: grafana/grafana:latest
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      service: "grafana"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  loki:
    image: grafana/loki:latest
    container_name: devsecops-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      service: "loki"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

  promtail:
    image: grafana/promtail:latest
    container_name: devsecops-promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    depends_on:
      - loki
    labels:
      service: "promtail"
      app: "monitoring"
    networks:
      - devsecops-network
      - notaire-app-network

networks:
  devsecops-network:
    driver: bridge
  notaire-app-network:
    external: true
    name: notaire_notary-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  prometheus_data:
  grafana_data:
  loki_data:
