# Model configurations and presets for Local AI in Notaire.
# Supports dynamic downloading of ANY HuggingFace model repo or URL.
# Custom configurations can be specified here or generated dynamically.

defaults:
  context_window: 32768
  sampling:
    temperature: 0.3
    top_p: 0.8
    top_k: 20
    repetition_penalty: 1.0
    turboquant_kv_enabled: false
  reasoning: ""
  memory_guard_tier: custom
  memory_ceiling_gb: 20.0
  wired_limit_mb: 20480
  opencode:
    tool_call: true
    reasoning: false
    limit:
      context: 32768
      output: 4096

presets:
  qwen3-coder:
    repo: "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"
    aliases:
      - "qwen"
      - "qwen3"
      - "https://huggingface.co/mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"
    name: "Qwen3-Coder-30B-A3B-Instruct-4bit"
    display_name: "Qwen3-Coder-30B-A3B (oMLX)"
    summary: "MoE 30B / 3B activos, ~17 GB, tools XML"
    context_window: 32768
    sampling:
      temperature: 0.3
      top_p: 0.8
      top_k: 20
      repetition_penalty: 1.0
      turboquant_kv_enabled: false
    reasoning: ""
    codex_profile: "omlx"
    codex_instructions: ""
    omlx_patch: false
    is_default: true
    opencode:
      tool_call: true
      reasoning: false
      limit:
        context: 32768
        output: 4096

  gpt-oss:
    repo: "mlx-community/gpt-oss-20b-MXFP4-Q8"
    aliases:
      - "gptoss"
      - "gpt-oss-20b"
      - "https://huggingface.co/mlx-community/gpt-oss-20b-MXFP4-Q8"
    name: "gpt-oss-20b-MXFP4-Q8"
    display_name: "gpt-oss-20b (oMLX)"
    summary: "MoE 21B / 3.6B activos, ~12 GB, harmony"
    context_window: 65536
    sampling:
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      repetition_penalty: 1.0
      turboquant_kv_enabled: false
    reasoning: "medium"
    codex_profile: "omlx-gptoss"
    codex_instructions: "local-ai/codex-local-instructions-gpt-oss.md"
    omlx_patch: true
    is_default: false
    opencode:
      tool_call: true
      reasoning: true
      limit:
        context: 65536
        output: 4096

  ternary-bonsai:
    repo: "prism-ml/Ternary-Bonsai-2-27B-mlx-2bit"
    aliases:
      - "bonsai"
      - "ternary-bonsai-2-27b"
      - "https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-mlx-2bit"
    name: "Ternary-Bonsai-2-27B-mlx-2bit"
    display_name: "Ternary-Bonsai-2-27B (2-bit MLX)"
    summary: "Dense/Hybrid 27B, ternary 2-bit, ~8.6 GB, on-device reasoning"
    context_window: 65536
    sampling:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      repetition_penalty: 1.0
      turboquant_kv_enabled: false
    reasoning: ""
    codex_profile: "omlx-bonsai"
    codex_instructions: ""
    omlx_patch: false
    is_default: false
    opencode:
      tool_call: true
      reasoning: false
      limit:
        context: 65536
        output: 4096
