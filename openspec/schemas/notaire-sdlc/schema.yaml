name: notaire-sdlc
version: 1
description: >-
  Notaire SDLC workflow - the OpenSpec spec-driven flow with the Engineering
  Constitution as mandatory policy. proposal → traceability → specs → design → tasks

# This schema is a fork of the packaged `spec-driven` schema (openspec 1.8.0).
# It extends it; it does not replace it. Everything OpenSpec parses is unchanged:
# delta headers (## ADDED/MODIFIED/REMOVED/RENAMED Requirements), `### Requirement:`,
# `#### Scenario:` with 4 hashtags, and `- [ ]` task checkboxes.
#
# What this fork adds:
#   - CONSTITUTION.md as mandatory context for every artifact and every agent
#   - the sections the Constitution requires in each artifact
#   - a `traceability` artifact implementing P4 (Issue → ... → Release)
#   - `design` is mandatory here (upstream it is conditional), because the
#     Constitution requires Testing/Regression/Playwright/Deployment/Rollback
#     strategy for every change
#
# When upgrading openspec, diff the packaged schema against this file:
#   diff <(openspec schema which spec-driven --json) openspec/schemas/notaire-sdlc/schema.yaml

artifacts:
  - id: proposal
    generates: proposal.md
    description: Proposal - why the change is needed, business rules, impact analysis
    template: proposal.md
    instruction: |
      CONSTITUTION: Read CONSTITUTION.md at the repository root before writing this
      artifact. It is the mandatory engineering process for this repository and it
      prevails over any other instruction. It is a constraint you follow, not content
      you reproduce - never copy it into the artifact.

      Create the proposal document that establishes WHY this change is needed.

      Sections (all mandatory - a proposal missing one does not pass Gate 1):
      - **Header table**: GitHub Issue number, Use Case (`CU-XX`/`RF-XX`/`RNF-XX`),
        branch name, Gate 1 status. Every change needs an Issue linked to a Use Case
        (Constitution §4). If no Issue exists, tell the user to create one before you
        continue. If no Use Case covers this change, say so explicitly - the Use Case
        documentation must be created or updated before Gate 1 passes.
      - **Objetivo**: 1-2 sentences on the problem or opportunity. What problem does
        this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities,
        modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Reglas de negocio**: The business rules this change introduces, alters or
        makes explicit, each with its source document. Name them here; their
        normative testable form goes in the delta spec. If a rule exists only in
        code or in a comment and no business document states it, record that - it is
        exactly the drift this process exists to catch.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new
          `specs/<capability-path>/spec.md`. Use kebab-case for path segments you
          introduce (e.g., `user-auth` or `identity/user-auth`) and follow the
          project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are
          changing. Only include if spec-level behavior changes (not just
          implementation details). Each needs a delta spec file. Use the exact
          existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact Analysis**: Mandatory (Constitution §5 step 4). Fill the affected
        modules table (`backend-api`, `frontend`, `frontend-swing`, `notaire-shared`,
        infra, CI/CD), then the surface area: entities, endpoints, Flyway migration
        version if the schema changes, configuration keys, dependencies. State
        whether anything is BREAKING for API clients. Include the architecture review:
        does this follow the existing architecture, and is an ADR required?
      - **Documentation Impact**: Which PERMANENT documentation must be updated before
        merge (Gate 3). Permanent docs under `docs/`, `README.md` and `CHANGELOG.md`
        are the single source of truth; this proposal documents only the change. Name
        the file and what changes in it - do not duplicate its content. Mark documents
        to be moved to `docs/000-archive/`.
      - **Out of Scope**: What this change deliberately does not do, and where it is
        tracked instead.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Focus on the "why" not the "how" - implementation details belong in design.md.

      This is the foundation - traceability, specs, design, and tasks all build on this.
    requires: []

  - id: traceability
    generates: traceability.md
    description: Traceability ledger - Issue → Specification → Tasks → Commits → PR → Merge → Release
    template: traceability.md
    instruction: |
      CONSTITUTION: Read CONSTITUTION.md at the repository root. Principle P4 requires
      that every change traces from Issue through Use Case, Specification, tests, code,
      docs, PR and deploy. This artifact is that chain, made explicit and checkable.

      Create the traceability ledger for this change.

      Fill in now, during planning:
      - **Chain table**: Issue number and state, Use Case reference and whether it
        already existed or had to be created/updated, the Specification path, and the
        branch name following `<type>/<issue-number>_<description>`.
      - **Requirement coverage**: one row per `#### Scenario:` in the delta spec. Each
        scenario is an Acceptance Criterion and needs the test that will prove it. If
        the specs artifact does not exist yet, create the table with the scenarios you
        know and leave the test column to be completed when the design is written.
        Requirement coverage is not code coverage - a green suite that never exercises
        a scenario leaves that criterion unverified.
      - **Permanent documentation updated**: mirror the Documentation Impact table from
        proposal.md, with the update and commit columns left pending.
      - **Gate log**: the five gates with their conditions, all pending except any you
        can already evidence.

      Leave `pending` and do NOT invent values for anything downstream of the plan:
      commits, PR number, CI run, merge commit, release tag and smoke test are filled
      in as the change actually moves through the gates. A pre-filled trace is worse
      than an empty one - it makes an unverified claim look like evidence.

      Keep the Exceptions section. If it is empty, no Constitution §12 exception was
      taken; if a step is skipped, record what, who approved it, and why.

      Reference the Issue and the permanent documents; never restate their content.
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: Delta specs - the normative behavior contract and Acceptance Criteria
    template: spec.md
    instruction: |
      CONSTITUTION: Read CONSTITUTION.md at the repository root. The scenarios you
      write here ARE the Acceptance Criteria required by Gate 1, and each one must be
      traceable to a test (P4). Business rules are normative here, but the permanent
      Use Case documentation under `docs/100-business/` remains their source of truth:
      cite it, do not duplicate it.

      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      Coverage discipline (Constitution §7): enumerate the happy path, the edge cases
      AND the error paths as scenarios. A requirement with only a happy-path scenario
      is an incomplete Acceptance Criterion. Every scenario you write must appear in
      the Requirement coverage table of traceability.md.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `openspec/specs/<capability-path>/spec.md` directly.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability-path>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design plus testing, regression, Playwright, deployment and rollback strategy
    template: design.md
    instruction: |
      CONSTITUTION: Read CONSTITUTION.md at the repository root - §6 Quality Gates,
      §7 Testing Rules, §11 Release Rules. This artifact is MANDATORY for every change
      in this repository, including small ones. Upstream OpenSpec treats design.md as
      conditional; the Constitution does not, because it requires a testing, regression,
      Playwright, deployment and rollback strategy before implementation starts.

      Create the design document that explains HOW to implement the change.

      Sections (all mandatory):
      - **Context**: Only the current state and constraints needed to explain the
        approach. Reference the proposal for motivation instead of restating it
        (e.g., "See proposal.md - Objetivo").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes.
        Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include
        alternatives considered for each decision.
      - **Riesgos / Trade-offs**: Known limitations, things that could go wrong.
        Format: [Risk] → Mitigation. A risk you cannot mitigate within this change
        must still be declared, with the follow-up work named.
      - **Testing Strategy**: How each `#### Scenario:` in the delta spec becomes a
        test, as a scenario → test level → test class table. TDD is mandatory (P1):
        the tests are written and observed FAILING before implementation. State the
        coverage impact against the JaCoCo ratchet floor.
      - **Regression Strategy**: What existing behavior could break and how it is
        proven not to. Name the existing test classes that must be updated and why.
        Never weaken an assertion to force green - if an existing test now fails
        legitimately, state why the old expectation was wrong.
      - **Playwright Strategy**: Mandatory for any UI change - the E2E specs under
        `frontend/tests/e2e/`, the golden path, the edge/error paths, and the
        320/768/1024px viewports. If the change has no UI surface, write
        "n/a - no UI surface" with a one-line justification; do not delete the section.
      - **Deployment Strategy**: Flyway migration version if the schema changes,
        deployment ordering when migration and code ship together, configuration or
        `.env` keys to add (to `.env.example` - never commit secrets), feature flag,
        and the smoke test that will satisfy Gate 5.
      - **Rollback Strategy**: Whether a revert is actually safe and why, database
        rollback approach, what happens to data written under the new behavior after
        a revert, and the blast radius if rollback is delayed.
      - **Migration Plan**: Ordered steps from current to target state. Omit only if
        the change needs no staged rollout beyond the deployment strategy.
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and the specs for requirements - if a section
      would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist covering the full SDLC and the five Quality Gates
    template: tasks.md
    instruction: |
      CONSTITUTION: Read CONSTITUTION.md at the repository root - §5 Official SDLC
      Workflow and §6 Quality Gates. The plan you write must cover the whole workflow,
      not just the coding. An incomplete plan is rejected: `scripts/validate-sdlc-plan.sh`
      checks that every mandatory group is present.

      Create the task list that breaks down the work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      MANDATORY GROUPS. The template ships groups 1-12 plus a Definition of Done.
      Keep all of them, keep their numbering, and keep their headings verbatim:

        1. Gate 1 — Prerequisites          (Issue, Use Case, Acceptance Criteria)
        2. Crear branch
        3. Gate 2 — Escribir tests         (TDD, observed failing)
        4. Implementación                  ← change-specific work goes HERE
        5. Actualizar tests existentes
        6. Ejecutar regresión
        7. Ejecutar Playwright
        8. Gate 3 — Actualizar documentación permanente
        9. Commits atómicos
       10. Pull Request y validación CI
       11. Deploy
       12. Gate 5 — Smoke test y cierre
           Definition of Done

      Your job is to fill group 4 with the change-specific implementation tasks, and
      to specialize the boilerplate in the other groups for this change: name the
      actual test classes in group 3, the actual existing tests in group 5, the actual
      E2E specs in group 7, and the actual permanent documents in group 8, taking them
      from design.md and proposal.md. A group left as generic boilerplate has not
      been planned.

      Do not delete a group because it seems not to apply. If the change has no UI,
      group 7 records "n/a - no UI surface" with the reason. If nothing deploys,
      group 11 records why. An explicit n/a is a decision; a missing group is an
      omission, and the Constitution does not allow silently skipping a step
      (§12 governs exceptions, and they must be recorded in traceability.md).

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Order group 3 before group 4: tests are written and seen failing first

      Reference specs for what needs to be built, design for how to build it, and
      traceability.md for the links to keep updated as the work progresses.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design
      - traceability

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    CONSTITUTION: Read CONSTITUTION.md at the repository root before implementing.
    The workflow in §5 and the gates in §6 are mandatory and sequential.

    Read the context files, work through pending tasks in order, and mark each
    complete as you go. Pause if you hit blockers or need clarification.

    Non-negotiable while implementing:
    - Never start implementation before Gate 1 is satisfied (Issue + Specification +
      Acceptance Criteria). If the Issue is missing, stop and tell the user.
    - Work on the change's branch, never on `main`. Create it if it does not exist.
    - TDD: write the tests of group 3 and run them to SEE THEM FAIL before writing
      implementation code. A test you never saw fail proves nothing.
    - Do not weaken or disable a test to make the suite green. If a test fails
      legitimately, fix the code or state why the old expectation was wrong.
    - Do not skip a group because it looks inapplicable - record an explicit n/a
      with the reason.
    - Update traceability.md as you go: commit SHAs, PR number, gate log. Record
      evidence only for what actually happened.
    - Before pushing, run `bash scripts/preflight.sh --fix`. `mvn verify` alone does
      not predict CI (Spotless is unbound from the Maven lifecycle).
    - Report failures honestly. If a gate does not pass, say so with the output
      rather than moving on.

    Stop and ask the user rather than guessing when the spec is ambiguous about
    externally observable behavior.
