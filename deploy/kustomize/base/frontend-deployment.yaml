apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: notaire
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Base image name; staging overlay pins GHCR SHA tag (#901 / #1043).
          image: notaire-frontend:local
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: BACKEND_URL
              value: http://backend:8080/api/v1
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
