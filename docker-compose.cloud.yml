# Cursor Cloud / nested-Docker override.
# Bridge networking between containers fails in nested Docker VMs;
# host networking + 127.0.0.1 keeps Postgres ↔ backend ↔ frontend working.
services:
  postgres:
    network_mode: host
    networks: !reset []

  backend:
    network_mode: host
    networks: !reset []
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:-notaire}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health/liveness || exit 1"]

  frontend:
    network_mode: host
    networks: !reset []
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
      BACKEND_URL: http://127.0.0.1:8080/api/v1

  pgadmin:
    network_mode: host
    networks: !reset []
