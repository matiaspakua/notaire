sonar.projectKey=notaire-frontend
sonar.projectName=Notaire Frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/tests/**
sonar.exclusions=src/**/*.d.ts,src/types/api.generated.ts
sonar.coverage.exclusions=src/tests/**,src/**/*.test.ts,src/**/*.test.tsx,src/app/layout.tsx,src/app/providers.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=coverage/eslint-report.json
sonar.sourceEncoding=UTF-8
