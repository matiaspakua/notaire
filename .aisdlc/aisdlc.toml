# Notaire's profile for the stack-agnostic AI SDLC framework (framework/ai-sdlc, #1958).
# Notaire is the framework's first adopter: the stages map onto the scripts that already
# implement CONSTITUTION.md (P10: adapt, do not replace). The kit adds what was prose only:
# baselines that may only shrink against main, and a linted skills catalog.
#
#   python3 framework/ai-sdlc/bin/aisdlc --profile .aisdlc/aisdlc.toml doctor
#   python3 framework/ai-sdlc/bin/aisdlc --profile .aisdlc/aisdlc.toml gate --list
#
# The local-AI harness keeps its own adapter (.aisdlc/project.yml); the Cursor Cloud fleet keeps
# docs/300-development/304-ai-sdlc-cloud/fleet-manifest.yaml.

[project]
name = "notaire"
policy = "CONSTITUTION.md"
level = 3                        # fleet: Owner + Foreman + Workers, Foreman merge rule (#1624)
base = "origin/main"

[tracker]
issue_pattern = '#(\d+)'
verify = "gh issue view {issue} --repo matiaspakua/notaire --json number"

[spec]
# Notaire uses OpenSpec (schema notaire-sdlc); the plan gate calls its validator.
dir = "docs/openspec/changes"

[tdd]
production = ["backend-api/src/main/**", "frontend/src/**"]
tests = ["backend-api/src/test/**", "frontend/src/**/*.test.ts", "frontend/src/**/*.test.tsx",
         "frontend/src/tests/**", "testing/**"]

[skills]
dir = ".claude/skills"
generic = [
  "api-contract-testing", "architecture-decision-design", "ci-cd-quality-gates",
  "delivery-maturity-roadmap", "devsecops-traceability", "operations-observability-readiness",
  "qa-automation-strategy", "secure-threat-modeling", "ui-design", "motion-design",
]
forbid_in_generic = ['notaire', 'backend-api', 'workspace/sdlc', 'docs/openspec', '\bCU-?\d{2}\b']

[evidence]
dir = ".aisdlc/evidence"     # hash-chained; `aisdlc evidence verify` (cross-repo assessment 2026-11)

# Owner-only paths: the policy, the gates, the merge path and the harness. Agents may propose a
# change to them; the Owner merges it (CONSTITUTION §5 step 21, §10 Roles). The merge gate below
# turns that sentence into an exit code (agentic-os C14-004; factory-control protectedPaths).
[protected]
owner = "the Owner (CODEOWNERS)"
paths = [
  "CONSTITUTION.md", "CONSTITUTION-AGENT-CARD.md", "AGENTS.md", "CLAUDE.md",
  ".aisdlc/**", "framework/ai-sdlc/**",
  ".claude/settings.json", ".claude/hooks/**", ".claude/agents/cloud-foreman.md", ".githooks/**",
  ".github/CODEOWNERS", ".github/workflows/sdlc-process.yml",
  "workspace/sdlc/preflight.sh", "workspace/sdlc/run_pipeline.sh", "workspace/sdlc/check-heavy-ci.sh",
  "workspace/sdlc/check-sdlc-exception.sh", "workspace/sdlc/validate-sdlc-plan.sh",
  "workspace/ci/agent-context-budget.py", "workspace/ci/enforce-quality-ratchet.py",
  "security/apply-protect-main-ruleset.sh", "security/assert-protect-main-ruleset.sh",
  "security/rulesets/**",
  "docs/openspec/schemas/**", "docs/openspec/config.yaml",
  "docs/300-development/304-ai-sdlc-cloud/CI-MERGE-GATE.md",
  "docs/300-development/304-ai-sdlc-cloud/fleet-manifest.yaml",
  "local-ai/sdlc/foreman.sh",
]

# Review budget (gentle-ai pr-size-policy): a reviewer reads ≤400 changed lines in one sitting.
# OpenSpec ceremony, lockfiles and generated files do not count. Advisory: domain-sized hex
# slices (#1693) may exceed it; the PR body then says why it could not be split.
[size]
limit = 400
exclude = [
  "docs/openspec/**", "CHANGELOG.md", "**/package-lock.json", "**/pnpm-lock.yaml",
  "**/*.snap", "frontend/src/**/generated/**", "**/src/test/resources/architecture/*.txt",
  "frontend/eslint-suppressions.json",
]

# Write set (Notaire audit S2; agentic-os C15-006): the proposal's "### Write set" lists the paths
# the change may touch. The archive folds deltas into docs/openspec/specs/, so those always pass.
[scope]
heading = "Write set"
always = ["CHANGELOG.md", "docs/openspec/specs/**"]

[roles.owner]
tier = "human"
may_merge = true

[roles.cloud-foreman]
tier = "mid"
model = "claude-sonnet-5-5"
may_merge = true                 # only under the Foreman merge rule (CONSTITUTION §5 step 21)

[roles.openspec-planner]
tier = "mid"
model = "claude-sonnet-5-5"

[roles.backend-implementer]
tier = "mid"

[roles.frontend-design]
tier = "mid"

[roles.testing-qa]
tier = "mid"

[roles.code-reviewer]
tier = "top"
model = "claude-opus-5-5"

# ── G1 specified ─────────────────────────────────────────────────────────────
[[gates]]
name = "OpenSpec plans conform (live issue check)"
stage = "plan"
run = "bash workspace/sdlc/validate-sdlc-plan.sh"

# ── G2 tests fail first (pass --var test=<Class or file>) ────────────────────
[[gates]]
name = "backend test fails"
stage = "red"
run = "mvn -q -B test -pl backend-api -Dtest={test}"
expect = "fail"
paths = ["backend-api/src/test/**"]

[[gates]]
name = "frontend test fails"
stage = "red"
run = "cd frontend && npx vitest run {test}"
expect = "fail"
paths = ["frontend/src/**/*.test.ts", "frontend/src/**/*.test.tsx"]

# ── G3 verified ──────────────────────────────────────────────────────────────
# preflight.sh mirrors every blocking CI gate, including the ratchet and skills lint below.
[[gates]]
name = "preflight (local mirror of CI)"
stage = "pre-push"
run = "bash workspace/sdlc/preflight.sh"
timeout = 3600

[[gates]]
name = "always-loaded context ≤ 8k tokens"
stage = "pre-push"
run = "python3 workspace/ci/agent-context-budget.py --max-tokens 8000"

[[gates]]
name = "dashboarded pipeline (stack, security cases, E2E)"
stage = "pre-pr"
run = "bash workspace/sdlc/run_pipeline.sh"
timeout = 7200

[[gates]]
name = "changed paths inside the write set"
stage = "pre-pr"
run = "aisdlc scope --base {base}"
required = false               # advisory until every proposal carries a Write set

[[gates]]
name = "review budget (≤400 changed lines)"
stage = "pre-pr"
run = "aisdlc size --base {base}"
required = false               # advisory: split into chained PRs, or say why not in the PR body

# ── G4 reviewed (pass --var pr=<number>) ─────────────────────────────────────
[[gates]]
name = "owner-only paths untouched (else the Owner merges)"
stage = "merge"
run = "aisdlc protected --base {base}"

[[gates]]
name = "evidence ledger chain intact"
stage = "merge"
run = "aisdlc evidence verify"

[[gates]]
name = "heavy CI green on the PR head"
stage = "merge"
run = "bash workspace/sdlc/check-heavy-ci.sh {pr}"

[[gates]]
name = "OpenSpec archived in the PR"
stage = "merge"
run = "python3 workspace/sdlc/check-openspec-archive-hygiene.py origin/main"

# ── G5 shipped ───────────────────────────────────────────────────────────────
[[gates]]
name = "product version coherence"
stage = "release"
run = "python3 workspace/sdlc/check-product-version-coherence.py"

[[gates]]
name = "smoke: API health (pass --var health_url=…)"
stage = "release"
run = "curl -fsS {health_url}"

# ── Ratchets: known violations may only disappear (ADR-030, #1695, #1696, #1725) ─────
[[ratchets]]
name = "ArchUnit hexagon baseline (R1–R6)"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/hexagon-baseline.txt"

[[ratchets]]
name = "use-case slice cycles (R7)"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/usecase-cycle-baseline.txt"

[[ratchets]]
name = "controller loose returns"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/controller-loose-returns.txt"

[[ratchets]]
name = "entity to DTO mapping debt"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/entity-dto-mapping.txt"

[[ratchets]]
name = "frontend hexagon ESLint suppressions"
kind = "baseline"
file = "frontend/eslint-suppressions.json"
