# Notaire's profile for the stack-agnostic AI SDLC framework (framework/ai-sdlc, #1958).
# Notaire is the framework's first adopter: the stages map onto the scripts that already
# implement CONSTITUTION.md (P10: adapt, do not replace). The kit adds what was prose only:
# baselines that may only shrink against main, and a linted skills catalog.
#
#   python3 framework/ai-sdlc/bin/aisdlc --profile .aisdlc/aisdlc.toml doctor
#   python3 framework/ai-sdlc/bin/aisdlc --profile .aisdlc/aisdlc.toml gate --list
#
# The local-AI harness keeps its own adapter (.aisdlc/project.yml); the Cursor Cloud fleet keeps
# docs/300-development/304-ai-sdlc-cloud/fleet-manifest.yaml.

[project]
name = "notaire"
policy = "CONSTITUTION.md"
level = 3                        # fleet: Owner + Foreman + Workers, Foreman merge rule (#1624)
base = "origin/main"

[tracker]
issue_pattern = '#(\d+)'
verify = "gh issue view {issue} --repo matiaspakua/notaire --json number"

[spec]
# Notaire uses OpenSpec (schema notaire-sdlc); the plan gate calls its validator.
dir = "docs/openspec/changes"

[tdd]
production = ["backend-api/src/main/**", "frontend/src/**"]
tests = ["backend-api/src/test/**", "frontend/src/**/*.test.ts", "frontend/src/**/*.test.tsx",
         "frontend/src/tests/**", "testing/**"]

[skills]
dir = ".claude/skills"
generic = [
  "api-contract-testing", "architecture-decision-design", "ci-cd-quality-gates",
  "delivery-maturity-roadmap", "devsecops-traceability", "operations-observability-readiness",
  "qa-automation-strategy", "secure-threat-modeling", "ui-design", "motion-design",
]
forbid_in_generic = ['notaire', 'backend-api', 'workspace/sdlc', 'docs/openspec', '\bCU-?\d{2}\b']

[evidence]
dir = ".aisdlc/evidence"     # hash-chained; `aisdlc evidence verify` (cross-repo assessment 2026-11)

# Sole-committer dry-run (#2167/#2169/#2175): axiom 2 policy evidence — NOT an OS Isolator.
# Owner runtime_* makes the check evaluable. required=false keeps it advisory (exit 0 on fail);
# Owner may flip required=true in a follow-up when fail-closed is desired. Never claims sandbox.
[committer]
required = false
runtime_names = ["Matias Miguez"]
runtime_emails = ["matiaspakua@gmail.com"]
# Agent deny patterns (active once runtime_* is set).
agent_names = ["cursor[bot]", "Cursor Agent", "github-actions[bot]", "dependabot[bot]"]
agent_emails = [
  "41898282+github-actions[bot]@users.noreply.github.com",
  "49699333+dependabot[bot]@users.noreply.github.com",
  "*+cursor[bot]@users.noreply.github.com",
]
agent_trailers = ["Made-with: Cursor", "Co-authored-by: Cursor"]

# TelemetryPort (#2125): off by default. Optional OTel NoOp path when enabled; no exporter.
[telemetry]
enabled = false
exporter = "none"

# FeatureFlagPort (#2137): off by default; JSON/flagd file when enabled.
[catalogs]
dir = ".aisdlc/catalogs"

# Always-loaded context budget (#1259/#2186): memory pack ids resolve against
# [catalogs] memory entries; aisdlc budget measures files ∪ pack refs (dedupe).
# List/validate/budget never execute packs. Coexists with
# workspace/ci/agent-context-budget.py (same ALWAYS_LOADED set).
[context]
max_tokens = 8000
files = [
  "CLAUDE.md",
  "AGENTS.md",
  "CONSTITUTION-AGENT-CARD.md",
  ".claude/rules/ai-agent-workflow.md",
]
memory = ["agent-card"]

[flags]
enabled = false
file = ".aisdlc/flags.json"

# Owner-only paths: the policy, the gates, the merge path and the harness. Agents may propose a
# change to them; the Owner merges it (CONSTITUTION §5 step 21, §10 Roles). The merge gate below
# turns that sentence into an exit code (agentic-os C14-004; factory-control protectedPaths).
[protected]
owner = "the Owner (CODEOWNERS)"
paths = [
  "CONSTITUTION.md", "CONSTITUTION-AGENT-CARD.md", "AGENTS.md", "CLAUDE.md",
  ".aisdlc/**", "framework/ai-sdlc/**",
  ".claude/settings.json", ".claude/hooks/**", ".claude/agents/cloud-foreman.md", ".githooks/**",
  ".github/CODEOWNERS", ".github/workflows/sdlc-process.yml",
  "workspace/sdlc/preflight.sh", "workspace/sdlc/run_pipeline.sh", "workspace/sdlc/check-heavy-ci.sh",
  "workspace/sdlc/check-sdlc-exception.sh", "workspace/sdlc/validate-sdlc-plan.sh",
  "workspace/ci/agent-context-budget.py", "workspace/ci/enforce-quality-ratchet.py",
  "security/apply-protect-main-ruleset.sh", "security/assert-protect-main-ruleset.sh",
  "security/rulesets/**",
  "docs/openspec/schemas/**", "docs/openspec/config.yaml",
  "docs/300-development/304-ai-sdlc-cloud/CI-MERGE-GATE.md",
  "docs/300-development/304-ai-sdlc-cloud/fleet-manifest.yaml",
  "local-ai/sdlc/foreman.sh",
]

# Review budget (gentle-ai pr-size-policy): a reviewer reads ≤400 changed lines in one sitting.
# OpenSpec ceremony, lockfiles and generated files do not count. Advisory: domain-sized hex
# slices (#1693) may exceed it; the PR body then says why it could not be split.
[size]
limit = 400
exclude = [
  "docs/openspec/**", "CHANGELOG.md", "**/package-lock.json", "**/pnpm-lock.yaml",
  "**/*.snap", "frontend/src/**/generated/**", "**/src/test/resources/architecture/*.txt",
  "frontend/eslint-suppressions.json",
]

# Write set (Notaire audit S2; agentic-os C15-006): the proposal's "### Write set" lists the paths
# the change may touch. The archive folds deltas into docs/openspec/specs/, so those always pass.
[scope]
heading = "Write set"
always = ["CHANGELOG.md", "docs/openspec/specs/**"]

[roles.owner]
tier = "human"
may_merge = true

[roles.cloud-foreman]
tier = "mid"
model = "claude-sonnet-5-5"
may_merge = true                 # only under the Foreman merge rule (CONSTITUTION §5 step 21)

[roles.openspec-planner]
tier = "mid"
model = "claude-sonnet-5-5"

[roles.backend-implementer]
tier = "mid"

[roles.frontend-design]
tier = "mid"

[roles.testing-qa]
tier = "mid"

[roles.code-reviewer]
tier = "top"
model = "claude-opus-5-5"

# Per-stage knobs (#2182): Foreman routing hints by catalog / skills-dir reference.
# Resolve dispatch plan with `aisdlc foreman plan|route [--json]` (#2196) before
# dispatch — read-only; never executes MCP or agents; no Isolator / sandbox claim.
# Effort units: tokens (prompt+completion), time_seconds (wall clock),
# questions (clarification budget), review_lines (changed-line review size).
[[stages]]
id = "plan"
agents = ["openspec-planner"]
skills = [
  "openspec-propose",
  "openspec-update-change",
  "openspec-triage",
  "software-functional-analyst",
]
model = "claude-sonnet-5-5-high"
effort = { tokens = 200000, time_seconds = 3600, questions = 20, review_lines = 400 }

# Grant profile data (#2192 / V1 axiom 5) + write-set policy dry-run (#2194) +
# optional expire kill-switch (#2198): worktree + write set + required checks + budget.
# `aisdlc grant check` is policy-only (pass/fail/no-evaluable) — expire fails closed when
# past. NOT a sandbox claim by itself. Isolator OS probe/run is separate (`aisdlc isolator`);
# Notaire CI/agent hosts often lack bwrap → expect sandbox=false / no-evaluable there (ADR-004).
# Optional expire sample (comment only — do not enable a past deadline that breaks CI):
#   expires_at = "2099-01-01T00:00:00Z"
#   ttl_seconds = 86400
[[grants]]
id = "plan-sample"
stage = "plan"
worktree = "."
write_set = [
  "docs/openspec/**",
  "docs/300-development/306-ai-sdlc-framework/**",
  "framework/ai-sdlc/**",
  ".aisdlc/**",
]
required_checks = ["OpenSpec plans conform (live issue check)"]
budget = { tokens = 200000, time_seconds = 3600, questions = 20, review_lines = 400 }

# ── G1 specified ─────────────────────────────────────────────────────────────
[[gates]]
name = "OpenSpec plans conform (live issue check)"
stage = "plan"
run = "bash workspace/sdlc/validate-sdlc-plan.sh"

# ── G2 tests fail first (pass --var test=<Class or file>) ────────────────────
[[gates]]
name = "backend test fails"
stage = "red"
run = "mvn -q -B test -pl backend-api -Dtest={test}"
expect = "fail"
paths = ["backend-api/src/test/**"]

[[gates]]
name = "frontend test fails"
stage = "red"
run = "cd frontend && npx vitest run {test}"
expect = "fail"
paths = ["frontend/src/**/*.test.ts", "frontend/src/**/*.test.tsx"]

# ── Local signal (#2159): same ratchet+skills work as preflight, recorded via gate ─
# Cheap custom stage so report/HTML/improve see ledger rows. Not part of pre-push
# (would recurse through preflight). CI process.yml still calls ratchet/skills directly.
[[gates]]
name = "baseline ratchet (shrink-only)"
stage = "signal"
run = "aisdlc ratchet --base {base}"

[[gates]]
name = "skills catalog lint"
stage = "signal"
run = "aisdlc skills"

# ── G3 verified ──────────────────────────────────────────────────────────────
# preflight.sh mirrors every blocking CI gate, including the ratchet and skills lint below.
[[gates]]
name = "preflight (local mirror of CI)"
stage = "pre-push"
run = "bash workspace/sdlc/preflight.sh"
timeout = 3600

[[gates]]
name = "always-loaded context ≤ 8k tokens"
stage = "pre-push"
run = "python3 workspace/ci/agent-context-budget.py --max-tokens 8000"

[[gates]]
name = "dashboarded pipeline (stack, security cases, E2E)"
stage = "pre-pr"
run = "bash workspace/sdlc/run_pipeline.sh"
timeout = 7200

[[gates]]
name = "changed paths inside the write set"
stage = "pre-pr"
run = "aisdlc scope --base {base}"
required = false               # advisory until every proposal carries a Write set

[[gates]]
name = "review budget (≤400 changed lines)"
stage = "pre-pr"
run = "aisdlc size --base {base}"
required = false               # advisory: split into chained PRs, or say why not in the PR body

[[gates]]
name = "sole-committer dry-run (axiom 2 policy, not isolation)"
stage = "pre-pr"
run = "aisdlc committer --base {base}"
required = false               # advisory even with Owner runtime_* (#2175); flip true to fail-closed

# ── G4 reviewed (pass --var pr=<number>) ─────────────────────────────────────
[[gates]]
name = "owner-only paths untouched (else the Owner merges)"
stage = "merge"
run = "aisdlc protected --base {base}"

[[gates]]
name = "evidence ledger chain intact"
stage = "merge"
run = "aisdlc evidence verify"

[[gates]]
name = "heavy CI green on the PR head"
stage = "merge"
run = "bash workspace/sdlc/check-heavy-ci.sh {pr}"

[[gates]]
name = "OpenSpec archived in the PR"
stage = "merge"
run = "python3 workspace/sdlc/check-openspec-archive-hygiene.py origin/main"

# ── G5 shipped ───────────────────────────────────────────────────────────────
[[gates]]
name = "product version coherence"
stage = "release"
run = "python3 workspace/sdlc/check-product-version-coherence.py"

[[gates]]
name = "smoke: API health (pass --var health_url=…)"
stage = "release"
run = "curl -fsS {health_url}"

# ── Ratchets: known violations may only disappear (ADR-030, #1695, #1696, #1725) ─────
[[ratchets]]
name = "ArchUnit hexagon baseline (R1–R6)"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/hexagon-baseline.txt"

[[ratchets]]
name = "use-case slice cycles (R7)"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/usecase-cycle-baseline.txt"

[[ratchets]]
name = "controller loose returns"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/controller-loose-returns.txt"

[[ratchets]]
name = "entity to DTO mapping debt"
kind = "baseline"
file = "backend-api/src/test/resources/architecture/entity-dto-mapping.txt"

[[ratchets]]
name = "frontend hexagon ESLint suppressions"
kind = "baseline"
file = "frontend/eslint-suppressions.json"

# Factory core (#2121). The profile ceiling on open pull requests cannot be raised by env or flags.
[factory]
max_open_prs = 3
concurrency = 1
timeout_seconds = 1800
retry = 2
backoff_seconds = 2
inventory = ".aisdlc/migration-inventory.toml"

[plugins]
allow = ["openspec", "example-method"]

[[plugins.entries]]
id = "openspec"
kind = "method"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/openspec/plugin.toml"
trusted = true

[[plugins.entries]]
id = "example-method"
kind = "method"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/example-method/plugin.toml"
trusted = true

# Spec Kit (#2123). Declared but out of [plugins] allow until Owner opts in after dry plan.
[[plugins.entries]]
id = "github-spec-kit"
kind = "method"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/spec-kit/plugin.toml"
trusted = false

# AWS AI-DLC (#2124). Boundary design only; never auto-trust hooks; not available.
[[plugins.entries]]
id = "aws-ai-dlc"
kind = "method"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/aws-ai-dlc/plugin.toml"
trusted = false

# Extra HarnessPort stubs (#2188). Inventory + dry plan only; out of allow until Owner opts in
# (Spec Kit pattern). sandbox=false forever until a real Isolator. Never launch runtimes.
[[plugins.entries]]
id = "claude-code"
kind = "harness"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/claude-code/plugin.toml"
trusted = false

[[plugins.entries]]
id = "openai-codex"
kind = "harness"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/openai-codex/plugin.toml"
trusted = false

[[plugins.entries]]
id = "agent-client-protocol"
kind = "harness"
version = "1.0.0"
manifest = "framework/ai-sdlc/plugins/acp/plugin.toml"
trusted = false

# Harness port (#2122). Files stay at their discoverability paths. A listed permission is not a sandbox.
[[harness.adapters]]
id = "cursor-cloud"
runtime = "cursor-cloud"
source = "docs/300-development/304-ai-sdlc-cloud/fleet-manifest.yaml"

[[harness.adapters]]
id = "local-foreman"
runtime = "local-omlx"
source = ".aisdlc/project.yml"
