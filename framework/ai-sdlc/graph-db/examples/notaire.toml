# repolens profile for the Notaire monorepo (paths are relative to this file).
[index]
db = "../.repolens/notaire.db"

[[source]]
name = "notaire"
path = "../../../.."

[embed]
backend = "fastembed"            # fastembed | lsa | none | auto
model = "BAAI/bge-small-en-v1.5"

[git]
commits = 3000
max_files_per_commit = 30
min_count = 2

[tags]
usecase = '\bCU-?(\d{2,3})\b'

[routes]
prefixes = ["/api/v1", "/api"]

[ranking]
# Retired code and archived docs stay indexed (complete) but rank lower.
demote = ["deprecated/**", "docs/000-archive/**", "**/archive/**", "github-page/**"]
