[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisdlc"
dynamic = ["version"]
description = "Stack-agnostic AI SDLC kit: stage gates, ratchets, evidence and catalogs driven by one profile."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aisdlc = "aisdlc.cli:main"

[tool.setuptools]
packages = ["aisdlc"]

[tool.setuptools.dynamic]
version = { attr = "aisdlc.__version__" }
