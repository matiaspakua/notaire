openapi: 3.1.0
info:
  title: AI SDLC factory control surface
  version: 1.8.0
  description: |
    Contract for factory control operations shared by the `aisdlc` CLI JSON payloads
    and the `aisdlc serve` HTTP adapter (#2253 / ADR-003). Separate from any adopter
    application API description. One OpenAPI tree only.
    Phase A (#2239) adds immutable entity revisions and workflow governance.
    Phase A.2 (#2253) hosts declared GET paths on loopback with Bearer token scopes.
    Phase A.3 (#2254) enables opt-in writes (`aisdlc serve --write`) with If-Match,
    CSRF, schema_version, workflow body v2 pins, and server-derived created_by.
    Phase A.4 (#2255) adds Project, Run, RunRequest schemas with evidence-derived
    status and harness reporting; cancel returns 501 while runner is false.
    Phase B (#2240) kit backoffice HTML/serve is an adapter over the same catalog and
    workflow paths — not a second schema set or config truth.
    Phase C (#2241) extends that HTML adapter for mcp/providers/memory/rules/integrations
    and an evidence-backed runs monitor (`aisdlc report`/cost); it does not add a competing
    OpenAPI write tree (A.2/A.3 own `aisdlc serve` / If-Match).
    Phase D (#2242) kit runtime HTML/serve (`aisdlc runtime`) adapts the same Project/Run
    paths (`/factory/projects`, `/factory/runs`) and approved-workflow filter — not a second
    schema set or config truth. Agent never commits or approves from that surface.
    1.2.0 (#2384) adds named tokens (`.aisdlc/serve.tokens`, one identity and scope per person,
    recorded as the actor) and the owner-only coach report (`/factory/coach`): local harness
    session counts and anti-patterns, never prompt or response text.
    1.3.0 (#2394) adds the factory store (SQLite mirror of the evidence ledger) and the
    read-only telemetry endpoint (`/factory/telemetry`): aggregated time, cost, and failure
    counts grouped by intent, stage, agent, skill, or tool.
    1.3.0 (#2395) adds Intent (submit, list, show), run-intent binding, and the MCP stdio
    server (`aisdlc mcp`) with tools `intent_submit`, `intent_show`, `factory_status`.
    1.3.0 (#2397) adds live factory status (`/factory/status`) derived from the evidence
    ledger and the store, and a Server-Sent Events stream (`/factory/events`) of ledger
    rows with Last-Event-ID replay and keep-alive.
    1.3.0 (#2398) adds configuration-as-code: config file tree and read with redaction
    and confinement, plus catalog DELETE with If-Match, CSRF, write scope, and evidence.
    1.4.0 (#2404) makes every LineStage always carry `agents`, `skills`, `mcp`, `tools`,
    `model`, `effort`, `guardrails` — with empty defaults when nothing is configured —
    and adds per-stage guardrails (grants tagged with `kind: grant`).
servers:
  - url: http://127.0.0.1:8765
    description: Default `aisdlc serve` loopback (CLI remains the system of record)
tags:
  - name: capabilities
  - name: config
  - name: plugins
  - name: harness
  - name: evidence
  - name: catalogs
  - name: workflows
  - name: projects
  - name: runs
  - name: coach
  - name: telemetry
  - name: intents
  - name: line
  - name: status
  - name: events
paths:
  /factory/capabilities:
    get:
      tags: [capabilities]
      operationId: getFactoryCapabilities
      summary: Honest live-port capabilities (approvals, runner, forge write, isolator)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Port truth as reported by kit ports (false when not proven)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryCapabilities"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/config:
    get:
      tags: [config]
      operationId: getFactoryConfig
      summary: Resolved factory config (CLI `config show --json --redacted`)
      responses:
        "200":
          description: Redacted factory config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryConfig"
  /factory/config/files:
    get:
      tags: [config]
      operationId: listConfigFiles
      summary: Config file tree — profile, policy, context, catalogs, projects, skills (#2398)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of ConfigFile rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigFile"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/config/files/{path}:
    get:
      tags: [config]
      operationId: getConfigFile
      summary: Read a config file with secret redaction; paths confined to config roots (#2398)
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Relative path from the repository root
      responses:
        "200":
          description: File content with redaction metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFileContent"
        "400":
          description: Invalid path (traversal or encoded separator)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: File not found or outside config roots
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/plugins:
    get:
      tags: [plugins]
      operationId: listFactoryPlugins
      summary: Trusted plugin listing (CLI `plugin list --json`)
      responses:
        "200":
          description: Plugin rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PluginRow"
  /factory/harness:
    get:
      tags: [harness]
      operationId: listFactoryHarness
      summary: Harness adapters (CLI `harness list --json`)
      responses:
        "200":
          description: Adapter rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HarnessRow"
  /factory/report:
    get:
      tags: [evidence]
      operationId: getFactoryReport
      summary: Evidence and cost summary (CLI `report --json`)
      responses:
        "200":
          description: Report payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceReport"
  /factory/metrics/factory:
    get:
      tags: [evidence]
      operationId: getFactoryMetrics
      summary: Time, tokens, money and RepoLens effect per intent, per run and overall (CLI `metrics factory --json`, #2447)
      responses:
        "200":
          description: Factory metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryMetrics"
  /factory/session:
    get:
      tags: [capabilities]
      operationId: getFactorySession
      summary: The caller's identity, scope and actor, so clients show read-only states up front
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
  /factory/coach:
    get:
      tags: [coach]
      operationId: getFactoryCoach
      summary: How agent sessions of this project are run on the host (CLI `coach --json`); owner scope
      description: |
        Reads the harness session stores under the host user's home read-only (Claude Code, Codex,
        OpenCode, Antigravity) and reports counts, model and tool names, and anti-patterns. Prompt and
        response text never leave the process. Requires the `owner` scope: it describes the host's user.
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Coach report for sessions run inside this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReport"
        "403":
          description: Token scope below owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/telemetry:
    get:
      tags: [telemetry]
      operationId: getFactoryTelemetry
      summary: Aggregated telemetry report from the factory store (CLI `telemetry report --json`)
      description: |
        Reads the SQLite store (`.aisdlc/factory.db`) and returns aggregated time, cost,
        and failure counts grouped by the requested dimension. RepoLens query text and files
        are never stored. Requires the `read` scope.
      security:
        - bearerAuth: []
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [intent, stage, agent, skill, tool]
            default: stage
      responses:
        "200":
          description: Telemetry report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryReport"
        "400":
          description: Invalid group parameter (`invalid_group`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/status:
    get:
      tags: [status]
      operationId: getFactoryStatus
      summary: Live factory status derived from the evidence ledger and the store
      description: |
        Returns the current intent, run, stage/step, previous steps (outcome, duration,
        cost), and next steps from the workflow and profile line. Never invents a running
        state — a step is "current" only when step.started has no matching step.finished
        in a run whose derived status is running. Requires the `read` scope.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Factory status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryStatus"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/events:
    get:
      tags: [events]
      operationId: streamFactoryEvents
      summary: Server-Sent Events stream of ledger rows
      description: |
        Streams evidence ledger rows as SSE frames. Each frame:
        `id: <n>\nevent: <kind>\ndata: <json>\n\n` where `id` is the 1-based ledger
        line number, `kind` is the sanitized event kind, and `data` is compact JSON
        with secrets redacted. Keep-alive comment `: keep-alive` every 15 seconds.
        Ledger is polled every second. Supports replay via `Last-Event-ID` header
        (wins) or `?after=` query parameter. Requires the `read` scope.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Skip ledger lines up to this number (overridden by Last-Event-ID header)
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
          description: Replay from this ledger line number (takes precedence over ?after=)
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: run.request
                data: {"kind":"run.request","run_id":"abc123"}

                id: 2
                event: step.started
                data: {"kind":"step.started","run_id":"abc123","step":"plan"}

                : keep-alive

        "400":
          description: Invalid Last-Event-ID or after parameter (`invalid_body`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/catalogs/{kind}:
    get:
      tags: [catalogs]
      operationId: listCatalog
      summary: Catalog entries by kind (CLI `catalog list --json`)
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogKind"
      responses:
        "200":
          description: Catalog list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogList"
    post:
      tags: [catalogs]
      operationId: createCatalogEntry
      summary: Create catalog entry version 1 (CLI `catalog add`)
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactoryEntityWrite"
      responses:
        "200":
          description: Created entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryEntity"
        "400":
          description: Literal secret in fields (`literal_secret`) or invalid body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Entry already exists (`already_exists`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/catalogs/{kind}/{id}:
    get:
      tags: [catalogs]
      operationId: getCatalogEntry
      summary: Show current entity (CLI `catalog show --json`)
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogKind"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current FactoryEntity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryEntity"
    put:
      tags: [catalogs]
      operationId: updateCatalogEntry
      summary: Allocate a new immutable revision (CLI `catalog update` / serve --write)
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogKind"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: Expected current entity version; mismatch yields 409
          schema:
            type: string
        - name: X-AISDLC-CSRF
          in: header
          required: true
          description: Must equal the Bearer token value (double-submit CSRF)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactoryEntityWrite"
      responses:
        "200":
          description: New current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryEntity"
        "409":
          description: Version conflict (If-Match mismatch)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Literal secret in fields (`literal_secret`) or invalid body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [catalogs]
      operationId: deleteCatalogEntry
      summary: Delete a catalog entry with optimistic concurrency, CSRF, and evidence (#2398)
      security:
        - bearerAuth: [write]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogKind"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: Expected current entity version; mismatch yields 409
          schema:
            type: string
        - name: X-AISDLC-CSRF
          in: header
          required: true
          description: Must equal the Bearer token value (double-submit CSRF)
          schema:
            type: string
      responses:
        "200":
          description: Deleted entry confirmed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, kind, version]
                properties:
                  id: { type: string }
                  kind:
                    $ref: "#/components/schemas/CatalogKind"
                  version: { type: integer, minimum: 1 }
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Insufficient scope or CSRF mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Entry not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          description: Write not enabled on this host
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Version conflict (If-Match mismatch)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/catalogs/{kind}/{id}/versions:
    get:
      tags: [catalogs]
      operationId: listCatalogVersions
      summary: Immutable revision history (CLI `catalog history --json`)
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogKind"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityVersionList"
  /factory/workflows:
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: List workflows (CLI `workflow list --json`); optional approved filter
      parameters:
        - name: approved
          in: query
          required: false
          schema:
            type: boolean
          description: When true, only governance=approved (runtime selection)
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
    post:
      tags: [workflows]
      operationId: createWorkflow
      summary: Create draft workflow (CLI `workflow create --json`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowWrite"
      responses:
        "200":
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /factory/workflows/{id}:
    get:
      tags: [workflows]
      operationId: getWorkflow
      summary: Show workflow (CLI `workflow show --json`)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
    put:
      tags: [workflows]
      operationId: editWorkflow
      summary: Replace a draft workflow's v2 steps, each with its line stage; returns it to draft (#2410)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: Expected current workflow version; mismatch yields 409
          schema:
            type: string
        - name: X-AISDLC-CSRF
          in: header
          required: true
          description: Must equal the Bearer token value (double-submit CSRF)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStepsEdit"
      responses:
        "200":
          description: New current revision, governance draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          description: Invalid steps (`invalid_body`) or approved workflow (`immutable_approved`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Version conflict (If-Match mismatch)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/workflows/{id}/transitions:
    post:
      tags: [workflows]
      operationId: transitionWorkflow
      summary: Apply governance transition (CLI `workflow transition --json`)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTransition"
      responses:
        "200":
          description: Updated workflow after transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /factory/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List factory projects (CLI `project list --json`)
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (repos default mode=dry_run)
      parameters:
        - name: X-AISDLC-CSRF
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /factory/projects/{id}:
    get:
      tags: [projects]
      operationId: getProject
      summary: Show a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /factory/projects/{id}/repos:
    post:
      tags: [projects]
      operationId: addProjectRepo
      summary: Bind a repository (mode defaults dry_run)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-AISDLC-CSRF
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRepo"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /factory/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs with evidence-derived status
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
    post:
      tags: [runs]
      operationId: startRun
      summary: Start a run (appends RunRequest evidence for an approved workflow)
      parameters:
        - name: X-AISDLC-CSRF
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunWrite"
      responses:
        "200":
          description: Created run (status queued/requested — never running from request alone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Token scope below write
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Intent not found (when `intent` is present but unknown)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Workflow not approved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Show a run (status derived from evidence)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
  /factory/runs/{id}/events:
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: Evidence events for a run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventList"
  /factory/runs/{id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a run (501 while runner capability is false)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-AISDLC-CSRF
          in: header
          required: true
          schema: { type: string }
      responses:
        "501":
          description: Runner port not proven — honest refuse
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/intents:
    get:
      tags: [intents]
      operationId: listIntents
      summary: List all factory intents
      responses:
        "200":
          description: Intent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentList"
    post:
      tags: [intents]
      operationId: submitIntent
      summary: Submit a new intent (prompt, reference, or spec)
      security:
        - bearerAuth: []
      parameters:
        - name: X-AISDLC-CSRF
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentSubmit"
      responses:
        "201":
          description: Intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          description: Bad request (e.g. literal secret detected)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/line:
    get:
      tags: [line]
      operationId: getProductionLine
      summary: Production line model (CLI `aisdlc line --json`); ordered stages with gates, agents, skills, tools/MCP, guardrails
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Production line model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLine"
        "401":
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Token scope below write
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /factory/intents/{id}:
    get:
      tags: [intents]
      operationId: getIntent
      summary: Show an intent by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Intent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "404":
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from `.aisdlc/serve.token` or a named one in `.aisdlc/serve.tokens` (scopes read < write < owner)
  schemas:
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    ConfigFile:
      type: object
      additionalProperties: false
      required: [path, kind, size, media_type]
      properties:
        path: { type: string, description: "Relative path from the repository root" }
        kind:
          type: string
          enum: [profile, policy, context, catalog, project, skill]
        size: { type: integer, minimum: 0 }
        media_type: { type: string }
        read_only: { type: boolean, default: false }
    ConfigFileContent:
      type: object
      additionalProperties: false
      required: [path, content, redacted, media_type, size]
      properties:
        path: { type: string }
        content: { type: string, description: "File text with secrets redacted" }
        redacted: { type: boolean, description: "True when at least one secret was replaced" }
        media_type: { type: string }
        size: { type: integer, minimum: 0, description: "Original byte size before redaction" }
    FactoryCapabilities:
      type: object
      additionalProperties: true
      required: [approvals_live, runner, forge_write, isolator]
      properties:
        approvals_live: { type: boolean }
        runner:
          type: boolean
          description: True only when an executable runner port is proven (never from stubs)
        forge_write:
          type: boolean
          description: True only after Approval verify + scoped write (default false)
        isolator:
          type: object
          additionalProperties: true
          required: [sandbox, enforces_committer]
          properties:
            sandbox: { type: boolean }
            enforces_committer: { type: boolean }
            backend: { type: [string, "null"] }
            status: { type: string }
        detail:
          type: object
          additionalProperties: true
    CatalogKind:
      type: string
      enum: [skills, mcp, agents, memory, workflows, providers, integrations, rules]
    FactoryConfig:
      type: object
      additionalProperties: true
      required: [schema, project, max_open_prs, concurrency, timeout_seconds, retry, backoff_seconds, plugin_allow]
      properties:
        schema: { type: integer }
        project: { type: string }
        max_open_prs: { type: integer, minimum: 0 }
        concurrency: { type: integer, minimum: 1 }
        timeout_seconds: { type: integer, minimum: 1 }
        retry: { type: integer, minimum: 0 }
        backoff_seconds: { type: number, minimum: 0 }
        plugin_allow:
          type: array
          items: { type: string }
        inventory:
          type: [string, "null"]
        distributed_claim_lock: { type: string }
        stages:
          type: array
          description: >
            Optional per-stage knobs (#2182): agents/skills/mcp catalog ids, model,
            and effort budgets (tokens, time_seconds, questions, review_lines).
            List/show never execute MCP or agents.
          items:
            type: object
            additionalProperties: true
            required: [id]
            properties:
              id: { type: string }
              agents:
                type: array
                items: { type: string }
              skills:
                type: array
                items: { type: string }
              mcp:
                type: array
                items: { type: string }
              model:
                type: [string, "null"]
              effort:
                type: object
                additionalProperties: true
        grants:
          type: array
          description: >
            Optional Grant profile data (#2192 / V1 axiom 5): worktree, write_set,
            required_checks (gate names), and budget. Validate/list/show only —
            never Isolator OS, never sandbox, never grant enforcement (ADR-004).
          items:
            type: object
            additionalProperties: true
            required: [id]
            properties:
              id: { type: string }
              stage:
                type: [string, "null"]
              worktree: { type: string }
              write_set:
                type: array
                items: { type: string }
              required_checks:
                type: array
                items: { type: string }
              budget:
                type: object
                additionalProperties: true
        context:
          type: object
          description: >
            Always-loaded context budget (#2186): max_tokens, files, and optional
            memory catalog pack ids. Validate/budget never execute packs.
          additionalProperties: true
          properties:
            max_tokens:
              type: [integer, "null"]
            files:
              type: array
              items: { type: string }
            memory:
              type: array
              items: { type: string }
              description: Memory catalog pack ids referenced by the budget
    PluginRow:
      type: object
      additionalProperties: true
      required: [id, kind, version, available, capabilities, status]
      properties:
        id: { type: string }
        kind: { type: string }
        version: { type: string }
        available: { type: boolean }
        reason:
          type: [string, "null"]
        capabilities:
          type: array
          items: { type: string }
        status: { type: string }
    HarnessRow:
      type: object
      additionalProperties: true
      required: [id, runtime, source]
      properties:
        id: { type: string }
        runtime: { type: string }
        source: { type: string }
    EvidenceReport:
      type: object
      additionalProperties: true
      required: [runs, failed_runs, gates, stages, cost]
      properties:
        runs: { type: integer }
        failed_runs: { type: integer }
        gates: { type: array, items: { type: object, additionalProperties: true } }
        stages: { type: array, items: { type: object, additionalProperties: true } }
        cost: { type: object, additionalProperties: true }
        lead_time_event_pair: { type: object, additionalProperties: true }
    CoachReport:
      type: object
      additionalProperties: false
      required: [schema, scope, thresholds, totals, harnesses, anti_patterns, hours]
      properties:
        schema: { type: string, const: aisdlc.coach/v1 }
        scope:
          type: object
          properties:
            project_only: { type: boolean }
            days: { type: [integer, "null"] }
        thresholds: { type: object, additionalProperties: { type: integer } }
        totals:
          type: object
          required: [sessions, healthy_sessions, user_turns, tool_calls]
          properties:
            sessions: { type: integer }
            healthy_sessions: { type: integer }
            user_turns: { type: integer }
            tool_calls: { type: integer }
        harnesses:
          type: array
          items:
            type: object
            required: [harness, sessions, user_turns, tool_calls, models, tools, first, last]
            properties:
              harness: { type: string, enum: [claude-code, codex, opencode, agy, junie] }
              sessions: { type: integer }
              user_turns: { type: integer }
              tool_calls: { type: [integer, "null"], description: null when the harness store does not record tool calls }
              models: { type: object, additionalProperties: { type: integer } }
              tools: { type: object, additionalProperties: { type: integer } }
              first: { type: [string, "null"], format: date-time }
              last: { type: [string, "null"], format: date-time }
        anti_patterns:
          type: array
          items:
            type: object
            required: [id, severity, occurrences, sessions, recommendation]
            properties:
              id:
                type: string
                enum: [repeated_prompt, runaway_loop, unguarded_autonomy, mega_session, prompt_bloat, no_plan]
              severity: { type: string, enum: [high, medium, low] }
              occurrences: { type: integer }
              sessions: { type: integer }
              recommendation: { type: string }
        hours:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: integer }
    CatalogList:
      type: object
      additionalProperties: false
      required: [kind, entries]
      properties:
        kind:
          $ref: "#/components/schemas/CatalogKind"
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id]
            properties:
              id: { type: string }
              version: { type: integer }
              governance:
                $ref: "#/components/schemas/WorkflowGovernanceState"
    FactoryEntity:
      type: object
      additionalProperties: true
      required: [id, kind, version, digest, schema_version]
      properties:
        id: { type: string }
        kind:
          $ref: "#/components/schemas/CatalogKind"
        version: { type: integer, minimum: 1 }
        schema_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        created_by:
          type: string
          description: Server-derived `{channel}:{identity}`; never from request body
        ref:
          type: [string, "null"]
          description: Path or credential ref (`env:…`); never secret values
        summary: { type: string }
        digest: { type: string }
        governance:
          $ref: "#/components/schemas/WorkflowGovernanceState"
        body:
          type: object
          additionalProperties: true
    FactoryEntityWrite:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
        ref:
          type: [string, "null"]
        summary: { type: string }
        body:
          type: object
          additionalProperties: true
        fields:
          type: object
          additionalProperties: true
          description: |
            Kind-specific fields merged into the entity (for a provider: model, endpoint, api_key).
            A credential is only ever `env:NAME`; a literal secret is refused with `literal_secret` (400).
    SessionView:
      type: object
      additionalProperties: false
      required: [identity, scope, actor, write_enabled]
      properties:
        identity: { type: string }
        scope: { type: string, enum: [read, write, owner] }
        actor: { type: string, description: "Recorded as created_by on writes (channel:identity)" }
        write_enabled: { type: boolean, description: "Host runs with --write and the scope allows writes" }
    EntityVersion:
      type: object
      additionalProperties: true
      required: [version, digest]
      properties:
        version: { type: integer, minimum: 1 }
        digest: { type: string }
        summary: { type: string }
        governance:
          $ref: "#/components/schemas/WorkflowGovernanceState"
    EntityVersionList:
      type: object
      additionalProperties: false
      required: [id, kind, versions]
      properties:
        id: { type: string }
        kind:
          $ref: "#/components/schemas/CatalogKind"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/EntityVersion"
    WorkflowGovernanceState:
      type: string
      enum: [draft, defined, validated, approved]
    Workflow:
      allOf:
        - $ref: "#/components/schemas/FactoryEntity"
        - type: object
          required: [governance]
          properties:
            kind:
              type: string
              enum: [workflows]
            governance:
              $ref: "#/components/schemas/WorkflowGovernanceState"
            body:
              oneOf:
                - $ref: "#/components/schemas/WorkflowBodyV1"
                - $ref: "#/components/schemas/WorkflowBodyV2"
    WorkflowBodyV1:
      type: object
      additionalProperties: true
      description: Legacy id-list body (schema_version 1); readable until migrate
      properties:
        agents:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        mcp:
          type: array
          items: { type: string }
        providers:
          type: array
          items: { type: string }
    WorkflowStepV2:
      type: object
      additionalProperties: true
      required: [id, stage]
      properties:
        id: { type: string }
        stage: { type: string }
        agent:
          type: [string, "null"]
          description: Pinned ref `agents:<id>@<version>`
        skills:
          type: array
          items: { type: string }
        mcp:
          type: array
          items: { type: string }
        provider:
          type: [string, "null"]
        gates:
          type: array
          items: { type: string }
        budget:
          type: object
          additionalProperties: true
          properties:
            tokens: { type: [integer, "null"] }
            time_seconds: { type: [number, "null"] }
            usd: { type: [number, "null"] }
        on_fail: { type: string }
    WorkflowBodyV2:
      type: object
      additionalProperties: true
      required: [steps, inputs, outputs]
      description: schema_version 2 body with pinned refs
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStepV2"
        inputs:
          type: array
          items: {}
        outputs:
          type: array
          items: {}
    WorkflowWrite:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
        summary: { type: string }
        agents:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        mcp:
          type: array
          items: { type: string }
        providers:
          type: array
          items: { type: string }
    WorkflowList:
      type: object
      additionalProperties: true
      required: [kind, entries]
      properties:
        kind:
          type: string
          enum: [workflows]
        approved_only: { type: boolean }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
    WorkflowTransition:
      type: object
      additionalProperties: true
      required: [action]
      properties:
        action:
          type: string
          enum:
            - define
            - request_validation
            - approve
            - reopen
            - demote_validated
            - demote_approved
        signature:
          type: [string, "null"]
          description: Path to ApprovalPort signature for approve
        owner_override: { type: boolean }
        reason:
          type: [string, "null"]
        waive_reason:
          type: [string, "null"]
          description: Required for request_validation in Phase A
    ProjectRepo:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
        forge: { type: string }
        url: { type: string }
        default_branch: { type: string }
        mode:
          type: string
          enum: [dry_run, live]
          default: dry_run
          description: Defaults to dry_run when omitted
    Project:
      type: object
      additionalProperties: true
      required: [id, profile_ref, repos]
      properties:
        id: { type: string }
        profile_ref: { type: string }
        repos:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRepo"
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    ProjectWrite:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
        profile_ref: { type: string }
        repos:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRepo"
    ProjectList:
      type: object
      additionalProperties: true
      required: [kind, entries]
      properties:
        kind:
          type: string
          enum: [projects]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    RunWorkflowRef:
      type: object
      additionalProperties: false
      required: [id, version, digest]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        digest: { type: string }
    RunStep:
      type: object
      additionalProperties: true
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          description: pending|running|pass|fail|skip|todo — skip is never pass
        stage:
          type: string
          description: Production-line stage of the step, from the workflow (#2410)
        inputs:
          $ref: "#/components/schemas/StepIO"
        outputs:
          $ref: "#/components/schemas/StepIO"
    FactoryMetrics:
      type: object
      additionalProperties: true
      required: [generated_at, intents, runs, overall, repolens_effect]
      description: >-
        Per intent and per run: time (wall_s, active_s, by_stage, corrections), tokens (input, output,
        cache_read, cache_write), cost (usd — null when nothing is recorded — fully_priced, rows,
        reported_rows, by_source) and repolens (calls, tokens_served, p50_ms, zero_result_rate) in the
        run's window. overall adds totals and per-intent medians. repolens_effect holds the agent
        benchmark comparison (bench) and the live paired runs (live_ab) with their sample sizes.
      properties:
        generated_at: { type: string, format: date-time }
        intents: { type: array, items: { type: object, additionalProperties: true } }
        runs: { type: array, items: { type: object, additionalProperties: true } }
        overall: { type: object, additionalProperties: true }
        repolens_effect:
          type: object
          additionalProperties: true
          properties:
            bench: { type: array, items: { type: object, additionalProperties: true } }
            live_ab: { type: object, additionalProperties: true }
    StepIO:
      type: object
      additionalProperties: false
      description: >-
        What a step received (inputs) or produced (outputs), recorded by `aisdlc harness report --io-file`
        on step events and merged per step (#2435). Validated before it reaches the evidence ledger.
      properties:
        request: { type: string, maxLength: 4000 }
        prompt: { type: string, maxLength: 20000 }
        summary: { type: string, maxLength: 4000 }
        files:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 512, description: Repository-relative path, no `..` }
        commits:
          type: array
          maxItems: 200
          items: { type: string, pattern: "^[0-9a-f]{7,40}$" }
        links:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              label: { type: string, maxLength: 200 }
              url: { type: string, format: uri, pattern: "^https?://" }
    Run:
      type: object
      additionalProperties: true
      required: [id, project, workflow, status, requested_by, evidence_head, steps]
      properties:
        id: { type: string }
        project: { type: string }
        workflow:
          $ref: "#/components/schemas/RunWorkflowRef"
        status:
          type: string
          enum: [requested, queued, running, succeeded, failed, cancelled, blocked]
          description: Derived from evidence only; never running from RunRequest alone
        requested_by: { type: string }
        requested_at: { type: string, format: date-time }
        evidence_head: { type: string }
        intent:
          type: string
          description: Optional intent id bound to this run (set when POST /factory/runs body includes `intent`)
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStep"
    RunRequest:
      type: object
      additionalProperties: true
      required: [kind, run_id, project, workflow, requested_by]
      description: Evidence ledger event written on start-run
      properties:
        kind:
          type: string
          enum: [run.request]
        run_id: { type: string }
        project: { type: string }
        workflow:
          $ref: "#/components/schemas/RunWorkflowRef"
        requested_by: { type: string }
        ts: { type: string, format: date-time }
        ok: { type: boolean }
        prev: { type: string }
    RunWrite:
      type: object
      additionalProperties: true
      required: [project, workflow]
      properties:
        id: { type: string }
        project: { type: string }
        workflow:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/RunWorkflowRef"
        intent:
          type: string
          description: Optional intent id to bind to this run; 404 if the intent does not exist
    RunList:
      type: object
      additionalProperties: true
      required: [kind, entries]
      properties:
        kind:
          type: string
          enum: [runs]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    RunEventList:
      type: object
      additionalProperties: true
      required: [run_id, events]
      properties:
        run_id: { type: string }
        events:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [kind, run_id]
            properties:
              kind: { type: string }
              run_id: { type: string }
              ts: { type: string, format: date-time }
              prev: { type: string }
    TelemetryReport:
      type: object
      additionalProperties: true
      required: [group, rows, total_runs, total_duration_s, total_usd, total_failures]
      properties:
        group:
          type: string
          enum: [intent, stage, agent, skill, tool]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryRow"
        total_runs: { type: integer }
        total_duration_s: { type: number }
        total_usd: { type: number }
        total_failures: { type: integer }
        failures_by_integration:
          type: object
          additionalProperties: { type: integer }
          description: Maps integration name (tool/adapter id) to failure count
        repolens:
          $ref: "#/components/schemas/TelemetryRepolens"
    TelemetryRow:
      type: object
      additionalProperties: true
      required: [key, runs, duration_s, usd, failures]
      properties:
        key: { type: string }
        runs: { type: integer }
        duration_s: { type: number }
        usd: { type: number }
        failures: { type: integer }
    TelemetryRepolens:
      type: object
      additionalProperties: true
      required: [calls, total_ms, avg_ms, by_tool]
      properties:
        calls: { type: integer }
        total_ms: { type: number }
        avg_ms: { type: number }
        by_tool:
          type: object
          additionalProperties: { type: integer }
          description: Maps tool name to call count
    IntentSource:
      type: object
      additionalProperties: true
      required: [system, ref]
      properties:
        system:
          type: string
          enum: [github, jira, url, file, ""]
          description: >-
            The external system the intent references. Empty string ("") for prompt
            intents that have no external reference. Values: github, jira, url, file.
        ref: { type: string }
    IntentReference:
      type: object
      additionalProperties: true
      required: [label, url, kind]
      properties:
        label: { type: string }
        url: { type: string }
        kind:
          type: string
          enum: [architecture, security, adr, standard, other]
    Intent:
      type: object
      additionalProperties: true
      required: [id, kind, title, text, source, acceptance, references, status, created_by, created_at, run_ids]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [prompt, reference, spec]
        title: { type: string }
        text: { type: string }
        source:
          $ref: "#/components/schemas/IntentSource"
        acceptance:
          type: array
          items: { type: string }
        references:
          type: array
          items:
            $ref: "#/components/schemas/IntentReference"
        status: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        run_ids:
          type: array
          items: { type: string }
        version: { type: integer }
    IntentSubmit:
      type: object
      additionalProperties: true
      properties:
        text: { type: string }
        ref: { type: string }
        spec: { type: string }
        title: { type: string }
    IntentList:
      type: object
      additionalProperties: true
      required: [kind, entries]
      properties:
        kind:
          type: string
          enum: [intents]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
    LineGate:
      type: object
      additionalProperties: true
      required: [id, name, command, required, mode, expect, paths]
      properties:
        id: { type: string }
        name: { type: string }
        command: { type: string }
        required: { type: boolean }
        mode: { type: string, enum: [required, advisory] }
        expect: { type: string, enum: [pass, fail] }
        paths:
          type: array
          items: { type: string }
    WorkflowStepsEdit:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        summary: { type: string }
        steps:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, stage]
            properties:
              id: { type: string }
              stage: { type: string, description: Line stage this step runs at }
              agent: { type: [string, "null"], description: "Pinned ref, e.g. agents:implementer@1" }
              skills: { type: array, items: { type: string } }
              mcp: { type: array, items: { type: string } }
              provider: { type: [string, "null"] }
              gates: { type: array, items: { type: string } }
              budget:
                type: object
                properties:
                  tokens: { type: [integer, "null"] }
                  time_seconds: { type: [integer, "null"] }
                  usd: { type: [number, "null"] }
              on_fail: { type: string, enum: [stop, continue] }
    LineStage:
      type: object
      additionalProperties: true
      required: [id, gates, agents, skills, mcp, tools, model, effort, guardrails, inputs, outputs, io_source, kind]
      properties:
        id: { type: string }
        title: { type: [string, "null"] }
        kind:
          type: string
          enum: [agent, deterministic, human]
          description: Declared in [[stages]]; otherwise agent when the stage lists agents, human for merge, else deterministic (#2411).
        gates:
          type: array
          items:
            $ref: "#/components/schemas/LineGate"
        agents:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        mcp:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { type: string }
          description: Equals the mcp ids; the profile has no other tool source
        model:
          type: [string, "null"]
          description: Model id for the stage, or null when not configured
        effort:
          type: object
          additionalProperties: true
          description: "{} when none declared; keys among tokens, time_seconds, questions, review_lines"
        guardrails:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              kind:
                type: string
                enum: [grant]
              id: { type: string }
              stage: { type: string }
              worktree: { type: string }
              write_set:
                type: array
                items: { type: string }
              required_checks:
                type: array
                items: { type: string }
              budget:
                type: object
                additionalProperties: true
        inputs:
          type: array
          items: { type: string }
        outputs:
          type: array
          items: { type: string }
        io_source: { type: string }
    LineGuardrails:
      type: object
      additionalProperties: true
      required: [protected, hooks, rules, isolator]
      properties:
        protected:
          type: object
          additionalProperties: true
          required: [owner, paths]
          properties:
            owner: { type: string }
            paths:
              type: array
              items: { type: string }
        hooks:
          type: array
          items: { type: string }
        rules:
          type: array
          items: { type: string }
        isolator:
          type: object
          additionalProperties: true
          required: [status, sandbox, backend, enforces_committer]
          properties:
            status: { type: string }
            sandbox: { type: boolean }
            backend: { type: [string, "null"] }
            enforces_committer: { type: boolean }
            detail: { type: [string, "null"] }
    ProductionLine:
      type: object
      additionalProperties: true
      required: [schema_version, stages, guardrails]
      properties:
        schema_version: { type: integer }
        stages:
          type: array
          items:
            $ref: "#/components/schemas/LineStage"
        guardrails:
          $ref: "#/components/schemas/LineGuardrails"
    FactoryStatus:
      type: object
      additionalProperties: true
      required: [intent, run, workflow, run_status, stage, step, previous, next, updated_at]
      properties:
        intent:
          type: [string, "null"]
          description: Current intent id, or null when no run
        run:
          type: [string, "null"]
          description: Current run id, or null when no run
        workflow:
          type: [object, "null"]
          description: Workflow reference (id, version, digest), or null when no run
        run_status:
          type: [string, "null"]
          description: Derived run status (requested/queued/running/blocked/succeeded/failed/cancelled), or null
        stage:
          type: [string, "null"]
          description: Stage of the step currently running, or null
        step:
          type: [string, "null"]
          description: Step id currently running, or null
        previous:
          type: array
          description: Completed steps in ledger order
          items:
            $ref: "#/components/schemas/FactoryStatusStep"
        next:
          type: array
          description: Upcoming steps from the workflow and profile line
          items:
            $ref: "#/components/schemas/FactoryStatusNext"
        updated_at:
          type: [string, "null"]
          description: ISO timestamp of the last ledger row used, or null when no run
    FactoryStatusStep:
      type: object
      additionalProperties: true
      required: [step, stage, status, started_at, finished_at, duration_s, usd]
      properties:
        step: { type: string }
        stage:
          type: [string, "null"]
        status:
          type: string
          enum: [pass, fail, skip]
        started_at:
          type: [string, "null"]
          description: ISO timestamp from step.started, or null
        finished_at:
          type: [string, "null"]
          description: ISO timestamp from step.finished, or null
        duration_s:
          type: [number, "null"]
          description: Duration in seconds, or null when timestamps unavailable
        usd:
          type: [number, "null"]
          description: Cost in USD from store telemetry, or null when unknown
    FactoryStatusNext:
      type: object
      additionalProperties: true
      required: [step, stage, source]
      properties:
        step: { type: string }
        stage:
          type: [string, "null"]
        source:
          type: string
          enum: [workflow, line]
          description: 'Source of the next step: "workflow" from workflow body, "line" from profile stages'
