[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
dynamic = ["version"]
description = "Local, open-source code knowledge graph: index folders (code, tests, docs, configs, data) and serve hybrid semantic + graph retrieval over a CLI, an HTTP API and MCP."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["code-search", "knowledge-graph", "mcp", "pagerank", "tree-sitter", "rag"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2,<2"]
pdf = ["pypdf>=4"]
all = ["fastembed>=0.4", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2,<2", "pypdf>=4"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools]
packages = ["repolens", "repolens.extractors"]

[tool.setuptools.package-data]
repolens = ["ui/*.html"]

[tool.setuptools.dynamic]
version = { attr = "repolens.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or a model download"]

[tool.coverage.run]
source = ["repolens"]
omit = ["repolens/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "S603", "S607", "S608", "S310", "B008", "SIM108", "SIM905", "E741"]
