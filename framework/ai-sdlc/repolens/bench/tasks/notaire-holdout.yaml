# Held-out tasks: never used to tune ranking. They check that changes tuned on notaire.yaml generalise.
# Same format as notaire.yaml; ground truth verified with grep against main (2026-11-16).
name: notaire
corpus:
  repo: ../../../../..
  clone: ../.corpus/notaire
  profile: ../../examples/notaire.toml
answer_suffix: >-
  Answer concisely. Finish with one line that starts with `FILES:` followed by the repository-relative
  paths of every relevant file, comma-separated.
tasks:
  - id: payment-create
    category: cross-stack
    prompt: When a payment is registered from the web app, which frontend adapter sends it, which controller receives it and which service processes it?
    expected:
      - frontend/src/adapters/http/payment/payment-http-gateway\.ts$
      - adapter/in/web/payment/PaymentController\.java$
      - usecase/payment/ProcessPaymentService\.java$

  - id: audit-ui
    category: cross-stack
    prompt: Which frontend adapter loads the audit records and which backend controller serves them?
    expected:
      - frontend/src/adapters/http/audit/audit-http-gateway\.ts$
      - adapter/in/web/audit/AuditRecordController\.java$

  - id: budget-template-slice
    category: multi-hop
    prompt: Show the budget template feature end to end - the frontend HTTP adapter, the REST controller, the inbound ports and the use-case services.
    expected:
      - frontend/src/adapters/http/budget-template/budget-template-http-gateway\.ts$
      - adapter/in/web/budget/BudgetTemplateController\.java$
      - port/in/budget/ManageBudgetTemplatesUseCase\.java$
      - port/in/budget/QueryBudgetTemplatesUseCase\.java$
      - usecase/budget/BudgetTemplateWriteService\.java$
      - usecase/budget/BudgetTemplateQueryUseCaseService\.java$

  - id: token-revocation
    category: multi-hop
    prompt: How are revoked JWTs stored and checked? Name the migration that creates the table, the entity, the service and the filter that rejects revoked tokens.
    expected:
      - db/migration/V43__create_revoked_tokens\.sql$
      - business/RevokedToken\.java$
      - config/TokenRevocationService\.java$
      - config/JwtAuthenticationFilter\.java$

  - id: audit-personal-data
    category: multi-hop
    prompt: How is reading personal data audited? Name the annotation, the aspect that records it, a controller where it is applied and the table it writes to.
    expected:
      - audit/AuditPersonalDataRead\.java$
      - audit/AuditAspect\.java$
      - adapter/in/web/person/PersonController\.java$
      - (V47__audit_records_append_only\.sql|business/AuditRecord\.java)$

  - id: revocation-impact
    category: impact
    prompt: If I change TokenRevocationService, which classes depend on it and which tests should I run?
    expected:
      - config/JwtAuthenticationFilter\.java$
      - adapter/in/web/user/UserController\.java$
      - TokenRevocationServiceTest\.java$
      - JwtAuthenticationFilterTest\.java$
      - UserLogoutControllerTest\.java$

  - id: login-attempts
    category: lexical
    prompt: Where are failed login attempts counted and persisted, and which test covers the lockout logic?
    expected:
      - security/LoginAttemptService\.java$
      - (business/LoginAttempt|security/JpaLoginAttemptStore)\.java$
      - LoginAttemptServiceTest\.java$

  - id: pdf-reports
    category: lexical
    prompt: Where are PDF reports rendered in the backend, and which REST controller exposes them?
    expected:
      - adapter/out/pdf/PdfBoxReportRenderer\.java$
      - adapter/out/report/ReportService\.java$
      - adapter/in/web/report/ReportController\.java$

  - id: payment-tests
    category: tests
    prompt: Which tests cover processing a payment?
    expected:
      - usecase/payment/ProcessPaymentServiceTest\.java$
      - unit/PaymentUseCaseTest\.java$

  - id: theme-tokens
    category: lexical
    prompt: Where are the frontend design tokens such as colors, spacing and radii defined?
    expected:
      - frontend/src/theme/tokens\.ts$

  - id: login-alerts
    category: docs
    prompt: Which Prometheus alert rules fire on login failures, and where are those alerts routed?
    expected:
      - infra/observability/prometheus/alert-rules\.yml$
      - infra/observability/alertmanager/alertmanager\.yml$

  - id: deed-schema
    category: multi-hop
    prompt: Which Flyway migration renamed the deed and folio tables to English, and which persistence adapters read and write deeds?
    expected:
      - db/migration/V32__rename_deed_and_folio_tables_to_english\.sql$
      - persistence/deed/DeedLookupAdapter\.java$
      - persistence/deed/DeedOpsAdapter\.java$
