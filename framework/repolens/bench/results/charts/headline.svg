<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" role="img" aria-label="repolens vs grep-driven navigation"><style>
.bg { fill: #fcfcfb; } text { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  fill: #52514e; } .title { font-size: 13px; font-weight: 600; fill: #0b0b0b; } .value { font-weight: 600;
  fill: #0b0b0b; } .axis { stroke: #e4e3df; stroke-width: 1; } .grep { fill: #2a78d6; } .graph { fill: #1baf7a; }
@media (prefers-color-scheme: dark) { .bg { fill: #1a1a19; } text { fill: #c3c2b7; } .title, .value { fill: #f0efec; }
  .axis { stroke: #353431; } .grep { fill: #3987e5; } .graph { fill: #199e70; } }
</style><rect class="bg" width="760" height="566" rx="8"/><text class="title" x="20" y="28" style="font-size:16px">repolens vs grep-driven navigation</text><text x="20" y="50">Notaire, 9.6k files. Retrieval: the same questions answered by grep keyword ranking and by repolens.</text><text x="20" y="66">Agent: the same model, prompt and tools, with and without the repolens MCP server.</text><rect class="grep" x="20" y="78" width="12" height="11" rx="2"/><text x="38" y="88">without repolens (grep / Read / Glob)</text><rect class="graph" x="290" y="78" width="12" height="11" rx="2"/><text x="308" y="88">with repolens</text><text class="title" x="20" y="122">Accuracy — higher is better</text><line class="axis" x1="20" x2="740" y1="128" y2="128"/><text x="20" y="157">Right files in top 10, tuning tasks</text><g class="bar"><title>Right files in top 10, tuning tasks, without repolens: 0.18</title><path class="grep" d="M300,142 H354.38495575221236 Q358.38495575221236,142 358.38495575221236,146.0 V149.0 Q358.38495575221236,153 354.38495575221236,153 H300 Z"/></g><text class="value" x="364.38495575221236" y="152">0.18</text><g class="bar"><title>Right files in top 10, tuning tasks, with repolens: 0.90</title><path class="graph" d="M300,155 H586.0 Q590.0,155 590.0,159.0 V162.0 Q590.0,166 586.0,166 H300 Z"/></g><text class="value" x="596.0" y="165">0.90</text><text class="value" x="740" y="157" text-anchor="end">5.0x more</text><text x="20" y="199">Right files in top 10, held-out tasks</text><g class="bar"><title>Right files in top 10, held-out tasks, without repolens: 0.31</title><path class="grep" d="M300,184 H408.9007633587786 Q412.9007633587786,184 412.9007633587786,188.0 V191.0 Q412.9007633587786,195 408.9007633587786,195 H300 Z"/></g><text class="value" x="418.9007633587786" y="194">0.31</text><g class="bar"><title>Right files in top 10, held-out tasks, with repolens: 0.79</title><path class="graph" d="M300,197 H586.0 Q590.0,197 590.0,201.0 V204.0 Q590.0,208 586.0,208 H300 Z"/></g><text class="value" x="596.0" y="207">0.79</text><text class="value" x="740" y="199" text-anchor="end">2.6x more</text><text x="20" y="241">Rank of first right file (MRR), held-out</text><g class="bar"><title>Rank of first right file (MRR), held-out, without repolens: 0.22</title><path class="grep" d="M300,226 H367.5290178571429 Q371.5290178571429,226 371.5290178571429,230.0 V233.0 Q371.5290178571429,237 367.5290178571429,237 H300 Z"/></g><text class="value" x="377.5290178571429" y="236">0.22</text><g class="bar"><title>Rank of first right file (MRR), held-out, with repolens: 0.90</title><path class="graph" d="M300,239 H586.0 Q590.0,239 590.0,243.0 V246.0 Q590.0,250 586.0,250 H300 Z"/></g><text class="value" x="596.0" y="249">0.90</text><text class="value" x="740" y="241" text-anchor="end">4.1x higher</text><text class="title" x="20" y="280">Speed and size per query — lower is better</text><line class="axis" x1="20" x2="740" y1="286" y2="286"/><text x="20" y="315">Latency (ms)</text><g class="bar"><title>Latency (ms), without repolens: 1,147</title><path class="grep" d="M300,300 H586.0 Q590.0,300 590.0,304.0 V307.0 Q590.0,311 586.0,311 H300 Z"/></g><text class="value" x="596.0" y="310">1,147</text><g class="bar"><title>Latency (ms), with repolens: 28</title><path class="graph" d="M300,313 H303.00487732588294 Q307.00487732588294,313 307.00487732588294,317.0 V320.0 Q307.00487732588294,324 303.00487732588294,324 H300 Z"/></g><text class="value" x="313.00487732588294" y="323">28</text><text class="value" x="740" y="315" text-anchor="end">41x faster</text><text x="20" y="357">Text returned to the model (KB)</text><g class="bar"><title>Text returned to the model (KB), without repolens: 204.3</title><path class="grep" d="M300,342 H586.0 Q590.0,342 590.0,346.0 V349.0 Q590.0,353 586.0,353 H300 Z"/></g><text class="value" x="596.0" y="352">204.3</text><g class="bar"><title>Text returned to the model (KB), with repolens: 2.3</title><path class="graph" d="M300,355 H300.0 Q303.2638069986205,355 303.2638069986205,358.2638069986205 V362.7361930013795 Q303.2638069986205,366 300.0,366 H300 Z"/></g><text class="value" x="309.2638069986205" y="365">2.3</text><text class="value" x="740" y="357" text-anchor="end">89x less</text><text class="title" x="20" y="396">Claude Sonnet agent, held-out tasks (6 + 6 sessions)</text><line class="axis" x1="20" x2="740" y1="402" y2="402"/><text x="20" y="431">Answer accuracy — higher is better</text><g class="bar"><title>Answer accuracy — higher is better, without repolens: 1.00</title><path class="grep" d="M300,416 H586.0 Q590.0,416 590.0,420.0 V423.0 Q590.0,427 586.0,427 H300 Z"/></g><text class="value" x="596.0" y="426">1.00</text><g class="bar"><title>Answer accuracy — higher is better, with repolens: 1.00</title><path class="graph" d="M300,429 H586.0 Q590.0,429 590.0,433.0 V436.0 Q590.0,440 586.0,440 H300 Z"/></g><text class="value" x="596.0" y="439">1.00</text><text class="value" x="740" y="431" text-anchor="end">same</text><text x="20" y="473">Tool calls per task — lower is better</text><g class="bar"><title>Tool calls per task — lower is better, without repolens: 4.0</title><path class="grep" d="M300,458 H586.0 Q590.0,458 590.0,462.0 V465.0 Q590.0,469 586.0,469 H300 Z"/></g><text class="value" x="596.0" y="468">4.0</text><g class="bar"><title>Tool calls per task — lower is better, with repolens: 2.0</title><path class="graph" d="M300,471 H441.0 Q445.0,471 445.0,475.0 V478.0 Q445.0,482 441.0,482 H300 Z"/></g><text class="value" x="451.0" y="481">2.0</text><text class="value" x="740" y="473" text-anchor="end">2.0x fewer</text><text x="20" y="515">Seconds per task — lower is better</text><g class="bar"><title>Seconds per task — lower is better, without repolens: 8.7</title><path class="grep" d="M300,500 H586.0 Q590.0,500 590.0,504.0 V507.0 Q590.0,511 586.0,511 H300 Z"/></g><text class="value" x="596.0" y="510">8.7</text><g class="bar"><title>Seconds per task — lower is better, with repolens: 7.3</title><path class="graph" d="M300,513 H539.4225639226554 Q543.4225639226554,513 543.4225639226554,517.0 V520.0 Q543.4225639226554,524 539.4225639226554,524 H300 Z"/></g><text class="value" x="549.4225639226554" y="523">7.3</text><text class="value" x="740" y="515" text-anchor="end">-16%</text><text x="20" y="550">Data: bench/results/retrieval*.json, agent-*.json. Cost per task and every other measure: README, Benchmark.</text></svg>