# Endpoints in backend-api/openapi/openapi.yaml that frontend/src does not call (issue #1250).
# contracts/tests/test_api_reachability.py fails on any unreferenced endpoint missing here and on any
# entry that is stale (endpoint removed, or the UI now calls it). CONSTITUTION section 4 wants every
# endpoint invoked from the UI: an entry is either intentionally API-only (say why) or debt to triage
# (call it from the UI with a Playwright scenario, or remove it with OpenAPI, Bruno and the CU-API matrix).
# Keys are 'METHOD /api/v1/path' exactly as in OpenAPI.
#
# Owner triage of the baseline (2026-10-07, #1250): A = read-by-id, stays API-only; B = management
# history, API-only with ADMIN-only PUT/DELETE; C = UI backlog; D = likely redundant, removal later.
# Owner decision 2026-10-09 (#1336): the former bucket E report (rebuilt in-house by #567, #1363) and
# manual testimony-movement POST/PUT/DELETE (#1364) are API-only (bucket A).
endpoints:
  "GET /api/v1/audit-log/{id}": "API-only (#1250 bucket A): REST read-by-id; the UI works from lists"
  "GET /api/v1/procedure-folders/{id}": "API-only (#1250 bucket A): REST read-by-id; the UI works from lists"
  "GET /api/v1/copies/{id}": "API-only (#1250 bucket A): REST read-by-id; the UI works from lists"
  "GET /api/v1/notebooks/{id}": "API-only (#1250 bucket A): REST read-by-id; the UI works from lists"
  "GET /api/v1/folios/{id}/in-use": "Likely redundant (#1250 bucket D): confirm, then remove with OpenAPI, Bruno and the CU-API matrix"
  "PUT /api/v1/managements/{id}": "Likely redundant (#1250 bucket D): the UI edits a management through PUT /api/v1/managements/{id}/complete-case (#1360); confirm, then remove with OpenAPI, Bruno and the CU-API matrix"
  "GET /api/v1/managements/{id}/current-status": "UI backlog (#1250 bucket C): expose in the UI with a Playwright scenario"
  "GET /api/v1/history": "API-only (#1250 bucket B): paged audit read; the UI reads GET /api/v1/managements/{id}/history"
  "POST /api/v1/history": "API-only (#1250 bucket B): state transitions record history; kept for integrations"
  "GET /api/v1/history/management/{idManagement}": "API-only (#1250 bucket B): the UI reads GET /api/v1/managements/{id}/history"
  "DELETE /api/v1/history/{id}": "API-only (#1250 bucket B): ADMIN-only removal from the CU13 audit trail"
  "GET /api/v1/history/{id}": "API-only (#1250 bucket A): REST read-by-id; the UI works from lists"
